<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Room Plan</title>
<!-- Shared palette tokens (:root custom properties), served from static/ and
     linked absolutely so the four pages cannot drift. Vite leaves an absolute
     URL alone, which is why this is not an import. -->
<link rel="stylesheet" href="/tokens.css" />
<!-- Shared selection-persistence helpers (seedProjectId / persistSelection /
     urlParam), the classic script the other three pages also load, so the
     project a reader picks here is the one the settings page opens with. -->
<script src="/common.js"></script>
<!-- The plan renderer, published as the global `PlanRenderer`: TypeScript in
     src-js/renderer/, bundled by its own Vite config and committed at
     static/vendor/. A classic script rather than an import, because that
     bundle is an IIFE assigning a global, and because loading it twice — once
     here and once through the module graph — would put two WebGL renderers in
     one page. -->
<script src="/vendor/renderer.bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>

# Known-benign hits for `scripts/weekly_review.py`, each with the reason it is
# benign. The reason is the point of the file: an ignore list with no reasons
# becomes a place to hide findings, and nobody can later tell an entry that is
# still true from one that stopped being true.
#
# The check asks "does this identifier exist anywhere in the tree?", so anything
# naming an *external* API, a *past* design, or an *unbuilt* one answers no
# while being perfectly correct prose. Those are the three shapes below.
#
# Adding an entry is the normal outcome of a review, not an admission of
# defeat — the goal is that next week's run is quieter than this week's, so a
# genuine finding is visible instead of buried.

[symbols]

# --- External APIs the docs cite by name. Not ours, never will be. ---
"Int64" = "Revit API type, in STRATEGY.md's parameter-storage discussion"
"IntegerValue" = "Revit API ElementId member"
"ActiveProjectLocation" = "Revit API, in the georeferencing discussion"
"IfcRelSpaceBoundary" = "IFC schema entity, cited in the area-standards comparison"
"BitmapText" = "PixiJS class, cited in the renderer strategy"
"FormData" = "browser DOM API"
"HttpClient" = "IronPython/.NET, used by the extractor's transport discussion"
"StringContent" = ".NET, same discussion"

# --- Prose that happens to match an identifier shape. ---
"Comments" = "prose — the English word, in STRATEGY-ENTITIES' authored-data list"
"DELETE" = "prose — the HTTP verb, in STRATEGY-SECURITY's method table"

# --- Deliberately illustrative placeholders. ---
"foo.rs" = "CODING-CONVENTIONS' worked example of a module split; not a real file"
"crate::foo::Bar" = "same worked example"
"foo.ts" = "CODING-CONVENTIONS:128's 'foo.ts beside foo.test.ts' co-location example"

# --- duHast and Revit symbols PLAN-ffe cites. They live in
#     SampleCodeRevitBatchProcessor-NET8/src/duHast, not here, and the plan's
#     whole subject is what that export does and does not carry — so naming
#     them is the point rather than an accident.
#
#     SCOPED to the one document, deliberately. `Transform` in particular is a
#     word a live doc could reasonably use about our own code, and a bare key
#     would silence that hit forever. ---
"DataBase@PLAN-ffe.md" = "duHast base class; the plan turns on DataItem extending it and not DataFamilyBase"
"DataElementGeometryBase@PLAN-ffe.md" = "duHast geometry mixin an item does not have — the finding the plan exists to record"
"DataFamilyBase@PLAN-ffe.md" = "duHast base class DataDoor and DataWindow extend"
"DataItem@PLAN-ffe.md" = "duHast's FFE record, the subject of the plan"
"DataLevel@PLAN-ffe.md" = "duHast level data object, cited in the level-heuristic risk"
"DataRoomToPhase@PLAN-ffe.md" = "duHast per-phase room reference, cited in the opening-vs-item table"
"GetRoomAtPoint@PLAN-ffe.md" = "Revit API Document member; the plan rejects the producer-side fallback that calls it"
"Transform@PLAN-ffe.md" = "Revit API BoundingBoxXYZ member — the placement the flattening applies"
"data_window.py@PLAN-ffe.md" = "duHast file, named to say which copy of the library the plan was read against"
"windows_location_by_rooms.py@PLAN-ffe.md" = "duHast module, named as the rejected precedent for producer-side room resolution"

# --- Designs recorded but not built. Absence is the documented state. ---
"DocumentIndex" = "STRATEGY-AUTHORED is flagged 'design settled, not built'"

# PLAN-ffe names what it proposes to build. Every one of these SHOULD fail this
# check today; the day it stops failing is the day the plan is built and the
# entry comes out. Scoped, so the same names used as live references anywhere
# else are still reported.
"Ffe@PLAN-ffe.md" = "the proposed SnapshotKind and ReferenceEntity variant"
"ItemReport@PLAN-ffe.md" = "the proposed QA report under the new `items` key"
"ItemResponse@PLAN-ffe.md" = "the proposed read-side response type"
"post_ffe.py@PLAN-ffe.md" = "proposed extractor module"
"room_m/exporters/ffe.py@PLAN-ffe.md" = "proposed extractor module"
"utils/items.py@PLAN-ffe.md" = "proposed extractor module"

# --- History written on purpose: the doc names an old symbol to explain a
#     rename or a split. Deleting these names would make the docs worse, not
#     better.
#
#     These are SCOPED (`symbol@doc`) rather than global, so the same name used
#     as a live reference in some other document is still reported. A bare
#     `contract.rs` key would have silenced the genuine STRATEGY.md:206 hit that
#     the 2026-08-08 review found. ---
"DrofusRecord" = "STRATEGY-SOURCES:65 explains 'ReferenceRecord, renamed from DrofusData/DrofusRecord'"
"BuiltinProperties" = "STRATEGY-SOURCES:236 describes a v3 design that was reconsidered"
"contract.rs@STRATEGY-ENTITIES.md" = "Decision 4 says 'the former contract.rs' to name the split doors triggered"

# Modules past CODING-CONVENTIONS' ~500 real-line split trigger that have been
# judged and kept whole. Being over the trigger is not a defect — it is "worth a
# second look" — so this section records the second look, and an entry here is a
# claim that the same reason is (or should be) in the module's own header, where
# the next reader of that file will find it.
#
# An entry is NOT a permanent exemption. Delete it if the module's shape changes
# and the argument stops holding.

[modules]

"handlers.rs" = "ingest is the one part with no service/ counterpart (MCP exposes none), so it accretes here by design; the seam if it ever splits is ingest versus the read adapters"
"storage/fs.rs" = "one impl of one trait — splitting the impl from its trait contract would separate the rules from the code that keeps them"
"contract/mod.rs" = "already split once, when doors triggered it; rooms deliberately did not move out alongside them, and its header says why"
"service/validation.rs" = "one report over one project, and the parts are only correct together -- the phase check, the reference reconciliation and the opening reports all read the same scoped rooms, and splitting them would mean three passes that could disagree about which rooms they were describing"

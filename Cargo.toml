[package]
name = "roommate"
version = "0.0.1-beta.4"
edition = "2024"

# Discovery aid, not a gate: `too_many_lines` (fires >100 lines) surfaces
# functions worth a second look. `warn`, never `deny` — a long-but-cohesive
# function carries `#[allow(clippy::too_many_lines)]` with a reason rather
# than being fragmented into single-use helpers just to hit the number.
[lints.clippy]
too_many_lines = "warn"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
# `set-header` is what puts `cache-control: no-cache` on the viewer's static
# files — see `viewer_cache_control` in main.rs for why serving them without it
# was a bug rather than a missing nicety.
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "decompression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
# Comment-PRESERVING TOML writing, for the settings save path only. `toml`
# above still does every read and every byte of formatting, including on save;
# this crate is used purely to move the OLD file's comments onto the newly
# generated one, because regenerating a project file from the typed struct threw
# away the rationale comments those files are mostly made of. Already in the
# tree as a `toml` dependency — this only makes it direct. Default features
# (parse + display) are all it needs: nothing here serializes through it, which
# is what keeps `toml::to_string_pretty` the single source of format truth.
toml_edit = "0.22"
anyhow = "1"
chrono = "0.4"
csv = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
rmcp = { version = "2.1.0", features = ["server", "macros", "transport-io", "schemars"] }
# HTTP *client* for the MCP binary's upload_drofus tool, which forwards to the
# running HTTP server (the single writer) instead of writing the store itself.
# default-features = false: the target is loopback plain HTTP, no TLS stack.
reqwest = { version = "0.12", default-features = false }
geo = "0.33.1"
# `ServiceBuilder`, to layer a header onto the static-file service ALONE rather
# than onto the router. Already in the tree behind axum and tower-http — this
# only makes it direct, the same trade `toml_edit` above documents. The `util`
# feature is the tests' `oneshot`, which is why this was a dev-dependency until
# the cache-control layer needed the crate at build time too.
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]

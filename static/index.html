<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Room Plan</title>
<!-- Shared palette tokens (:root custom properties) live in one file so the
     three sibling pages can't drift; page-specific CSS stays in <style> below. -->
<link rel="stylesheet" href="tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    display: grid;
    /* header / zones / bottom region (results + source-data grid).
       The bottom row is auto so an empty region costs no plan height.
       `minmax(0, 1fr)` is load-bearing, not decoration: a grid item defaults
       to `min-width: auto`, so the grid's very wide table (dozens of columns)
       would otherwise stretch the single column to its intrinsic width and
       drag `main` — and the plan canvas — out to several thousand pixels. */
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
  }

  header {
    display: flex;
    flex-wrap: wrap; /* scope pickers joined the header; degrade by wrapping, not clipping */
    align-items: baseline;
    gap: 0.6rem 1rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--ink);
  }
  header h1 {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0;
  }
  header .links { margin-left: auto; display: flex; gap: 1rem; align-items: baseline; }
  header .links a { color: var(--accent); font-size: 0.72rem; text-decoration: none; }
  header .links a:hover { text-decoration: underline; }

  /* Global scope pickers: project / milestone / building — one scope for the
     whole page (the single-project viewer). */
  header select.picker {
    font-family: var(--mono); font-size: 0.72rem;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); padding: 0.25rem 0.4rem;
  }
  header select.picker.hidden { display: none; }

  /* App-wide controls: add/remove zone, link toggle. */
  header button.ctl {
    font-family: var(--mono); font-size: 0.72rem;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); padding: 0.25rem 0.5rem; cursor: pointer;
  }
  header button.ctl:hover { background: var(--fill); }
  header button.ctl:disabled { opacity: 0.4; cursor: default; }
  header button.ctl.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* Global room search: input + a "Fields" checklist popover. */
  header .search { position: relative; display: flex; gap: 0.4rem; align-items: center; }
  header #searchInput {
    font-family: var(--mono); font-size: 0.72rem; color: var(--ink);
    background: var(--paper); border: 1px solid var(--ink); padding: 0.25rem 0.5rem;
  }
  .fields-panel {
    position: absolute; top: 100%; left: 0; margin-top: 0.3rem; z-index: 10;
    background: var(--paper); border: 1px solid var(--rule); padding: 0.5rem 0.6rem;
    max-height: 40vh; overflow: auto; min-width: 12rem;
  }
  .fields-panel.hidden { display: none; }
  .fields-panel .fields-actions { margin-bottom: 0.4rem; display: flex; gap: 0.5rem; }
  .fields-panel .fields-actions a { color: var(--accent); font-size: 0.66rem; cursor: pointer; }
  .fields-panel label { display: block; font-size: 0.7rem; white-space: nowrap; cursor: pointer; }

  /* The zone grid. The 1px gap over a dark background is the hairline rule
     between zones. Column count is set on `main` from the zone count. */
  /* Zones + inspector. `minmax(0, 1fr)` on the zones column for the same reason
     `body` carries it: a grid item's min-width defaults to `auto`, so one long
     unwrapped property value in the inspector would otherwise stretch this row
     and drag the plan canvas out with it — the bug the band-2 table already hit
     once. The inspector column is `auto`, so a hidden inspector costs nothing. */
  #mainRow {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    min-height: 0;
    min-width: 0;
  }

  main {
    display: grid;
    gap: 1px;
    background: var(--ink);
    min-height: 0;
    min-width: 0;
  }

  /* ---- room inspector (selection is page state) ---------------------------
     ONE per page, never one per zone: selection is page state, so a per-zone
     inspector would sit empty in every zone but one. A layout participant that
     reflows the plans, NOT an absolutely-positioned overlay inside
     `.zone-canvas` — that was how `.validation-panel`/`.areas-panel` worked, and
     getting them out of there was the point of the bottom-region work. */
  #inspector {
    width: 22rem;
    max-width: 40vw;          /* never let the panel crowd out the plan */
    background: var(--paper);
    border-left: 1px solid var(--ink);
    overflow-y: auto;
    min-height: 0;
    font-size: 0.7rem;
  }
  #inspector.hidden { display: none; }
  #inspector .insp-head {
    position: sticky; top: 0; background: var(--paper);
    border-bottom: 1px solid var(--ink);
    padding: 0.5rem 0.7rem;
  }
  #inspector .insp-title { font-weight: 600; letter-spacing: 0.06em; word-break: break-word; }
  #inspector .insp-sub { color: var(--accent); font-size: 0.64rem; letter-spacing: 0.06em; margin-top: 0.15rem; }
  #inspector .insp-controls { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: center; margin-top: 0.45rem; }
  #inspector .insp-controls input[type="search"] {
    flex: 1 1 7rem; min-width: 0;
    font-family: var(--mono); font-size: 0.66rem;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule); padding: 0.2rem 0.3rem;
  }
  #inspector .insp-controls label { display: flex; align-items: center; gap: 0.25rem; font-size: 0.64rem; white-space: nowrap; }
  #inspector .insp-count { color: var(--accent); font-size: 0.62rem; letter-spacing: 0.06em; }
  #inspector h4 {
    margin: 0; padding: 0.4rem 0.7rem 0.2rem;
    font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
  }
  /* Model vs reference-source data stay visually distinct: STRATEGY-SOURCES
     keeps every reference source a separate sub-object with its own
     lifecycle, and band 2 already tints its columns as a block. The
     inspector must not be the place that blurs it. `.src-reference` is
     shared by every joined source (dRofus, or any other), not just dRofus. */
  #inspector .insp-rows.src-reference { background: var(--reference-tint, rgba(0, 0, 0, 0.03)); }
  #inspector .insp-row {
    display: grid; grid-template-columns: 45% 1fr; gap: 0.4rem;
    padding: 0.18rem 0.7rem; align-items: start;
  }
  #inspector .insp-row:nth-child(odd) { background: rgba(0, 0, 0, 0.02); }
  #inspector .insp-k { color: var(--accent); word-break: break-word; }
  #inspector .insp-v { word-break: break-word; white-space: pre-wrap; }
  /* `insp-empty`, NOT a bare `empty`: the zone's no-data overlay owns `.empty`
     globally as `position: absolute; inset: 0`. A row carrying that class picked
     the positioning up, and with no positioned ancestor it resolved against the
     viewport — an invisible full-page shield over the plans that swallowed every
     click, drag and wheel. */
  #inspector .insp-v.insp-empty { opacity: 0.45; font-style: italic; }
  #inspector .insp-note { padding: 0.3rem 0.7rem 0.6rem; opacity: 0.6; font-style: italic; }

  .zone {
    position: relative;
    background: var(--paper);
    display: grid;
    grid-template-rows: auto 1fr;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  /* Per-zone toolbar — a caption strip: this zone's own colour/level pickers
     (presentation) plus its validation toggle and meta line. Scope pickers
     live in the header; a zone never chooses what data it shows. */
  .zone-toolbar {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 0.4rem; padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--ink);
  }
  .zone-toolbar select.picker {
    font-family: var(--mono); font-size: 0.72rem;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); padding: 0.2rem 0.4rem;
  }
  .zone-toolbar select.picker.hidden { display: none; }
  .zone-toolbar button.validation-toggle {
    font-family: var(--mono); font-size: 0.72rem;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); padding: 0.2rem 0.4rem; cursor: pointer;
  }
  .zone-toolbar button.validation-toggle.issues { border-color: var(--accent); color: var(--accent); }
  .zone-toolbar button.validation-toggle.hidden { display: none; }
  .zone-toolbar button.export-svg {
    font-family: var(--mono); font-size: 0.72rem;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); padding: 0.2rem 0.4rem; cursor: pointer;
  }
  .zone-toolbar button.export-svg.hidden { display: none; }
  .zone-toolbar .meta { font-size: 0.66rem; letter-spacing: 0.08em; color: var(--accent); margin-left: auto; }
  .zone-toolbar .meta.stale { color: var(--ink); opacity: 0.5; }

  /* The canvas region below the toolbar; holds the SVG, the empty-state note,
     and the validation panel (both absolutely positioned over the SVG). */
  .zone-canvas { position: relative; overflow: hidden; min-height: 0; }
  /* --- the zone's layer stack, stated explicitly ---
     DOM order is NOT what decides this, and assuming it did was a real bug: the
     canvas is `position: absolute` and the <svg> was `position: static`, and CSS
     paints every positioned element AFTER every non-positioned one regardless of
     which comes first in the document. So the canvas covered the overlay, and
     the dashed selection outline drawn into that overlay disappeared under the
     room fills — visible only where it overhung a fill's edge.
     `pointer-events: none` on the canvas hid the symptom from hit-testing, so
     `elementFromPoint` still reported the <svg> on top while the pixels said
     otherwise.
       0  canvas    the plan: fills, holes, outlines, labels
       1  svg       the overlay: selection + hover marks, areas footprints
       2  empty     "no rooms" message
       4  busy      "drawing plan" panel, covers everything while it builds
       5  tip       the room tooltip, above all of it */
  .zone-canvas svg {
    position: relative; z-index: 1;
    width: 100%; height: 100%; display: block; cursor: grab;
  }
  .zone-canvas svg:active { cursor: grabbing; }
  /* The WebGL plan layer sits UNDER the <svg>, which stays in the DOM for the
     areas overlay, the selection/hover marks and every pointer handler. The svg
     keeps its own background transparent, so the two read as one drawing.
     `pointer-events: none` because the svg above owns the pointer -- the canvas
     receiving a click would break the capture the drag/click distinction needs. */
  .zone-canvas canvas.plan-gl {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none;
    z-index: 0; /* see the layer stack above -- without this it paints OVER the svg */
  }

  .grid line { stroke: var(--rule); stroke-width: 0.5; vector-effect: non-scaling-stroke; }

  .room { fill: var(--fill); stroke: var(--ink); stroke-width: 1.5;
          stroke-linejoin: round; transition: fill 0.12s ease; vector-effect: non-scaling-stroke; }
  .room:hover { fill: var(--fill-hover); }
  .room.error { fill: var(--error); }
  .room.error:hover { fill: var(--accent); }
  /* Search: matches get a bold accent outline (composes over any fill — colour
     plan or error); non-matches fade so matches stand out. `.dim` is opacity so
     it works regardless of an inline colour-plan fill. */
  .room.match { stroke: var(--accent); stroke-width: 3; }
  /* Click-selection: ONE room at a time for the
     whole page. Deliberately louder than `.match` and dashed, so a selected room
     is still distinguishable when it is also a search match — the two states are
     independent and routinely co-occur. Stroke only, never fill: a colour plan
     fill must survive being selected. */
  .room.selected { stroke: var(--accent); stroke-width: 5; stroke-dasharray: 6 3; }

  /* --- marks drawn by the WebGL renderer into this SVG layer ---
     Selection and hover are ONE room each, so they stay SVG while the thousands
     of rooms move to GL (HANDOVER-webgl-renderer.md, Decision 1). These rules
     MIRROR `.room.selected` and `.room:hover` above rather than reusing them,
     for one reason each:
       - the selection mark carries `fill: none`, because the fill it sits on is
         painted by a different technology and must show through. In SVG the
         class went on the room polygon itself, so the fill came free.
       - the hover mark is a real element, so `:hover` (which needs the pointer
         to be over THAT element) cannot drive it -- the pick does. */
  .plan-marks .room-selected-mark {
    fill: none; stroke: var(--accent); stroke-width: 5; stroke-dasharray: 6 3;
    stroke-linejoin: round; vector-effect: non-scaling-stroke;
  }
  /* A door mark is SOLID and thinner than a room's dashed one. A door glyph is
     a few feet across, so the room's 6/3 dash would resolve to two or three
     dashes around the whole outline and read as a rendering artefact rather
     than as a selection. Same accent colour, because it is the same state. */
  .plan-marks .door-selected-mark {
    fill: none; stroke: var(--accent); stroke-width: 3;
    stroke-linejoin: round; vector-effect: non-scaling-stroke;
  }
  /* No hover rule here on purpose. Hover is a FILL, and a fill in this overlay
     sits above the canvas -- and so above the labels the canvas draws, hiding
     the label of the room being pointed at. It is drawn in the GL layer beneath
     the labels instead (gl/renderer.ts, `#drawHover`), which is the ordering the
     SVG renderer got for free by recolouring the room polygon itself. */

  /* Per-room tooltip. Every room polygon used to carry an SVG <title>, giving
     the browser a native tooltip for free; WebGL has no elements and therefore
     no equivalent, so the hover pick drives this instead. Small, but it is a
     shipped feature that would otherwise disappear silently. */
  .plan-tip {
    position: absolute; z-index: 5; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); padding: 0.15rem 0.35rem;
    font-family: var(--mono); font-size: 0.72rem; white-space: nowrap;
    transform: translate(0.6rem, 0.6rem);
  }
  .plan-tip.hidden { display: none; }

  /* Shown while a large level is being built. Covers the plan rather than
     sitting beside it, because the thing underneath during a rebuild is either
     the PREVIOUS level or nothing, and both are misleading. */
  .plan-busy {
    position: absolute; inset: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--paper) 78%, transparent);
    font-family: var(--mono); font-size: 0.78rem; color: var(--ink);
    letter-spacing: 0.08em;
  }
  .plan-busy.hidden { display: none; }
  .plan-busy span::after {
    content: ""; display: inline-block; width: 0.6rem;
    animation: plan-busy-dots 1.2s steps(4, end) infinite;
  }
  @keyframes plan-busy-dots { 0% { content: ""; } 100% { content: "..."; } }
  /* Respect a reduced-motion preference: the message alone still says what is
     happening, which is the whole job. */
  @media (prefers-reduced-motion: reduce) {
    .plan-busy span::after { animation: none; }
  }
  .dim { opacity: 0.15; }
  .hole { fill: var(--paper); stroke: var(--ink); stroke-width: 1;
          stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }

  .label { fill: var(--ink); text-anchor: middle;
           dominant-baseline: middle; pointer-events: none; }
  .label .tag { fill: var(--accent); letter-spacing: 0.05em; }

  /* Scoped to the zone canvas that owns it, NOT a bare `.empty`. Unscoped, this
     rule reached anything anywhere that happened to use so generic a word: the
     inspector's empty-value rows picked up `position: absolute; inset: 0`, and
     with no positioned ancestor they sized against the viewport — an invisible
     full-page shield over the plans that ate every click, drag and wheel.
     (`#bottomRegion.empty` is a different state on a different element, already
     scoped by its id.)

     `:not(.hidden)` is load-bearing, not decoration: scoping raised this rule's
     specificity above the `.hidden` utility that switches the overlay off, which
     left it displayed over every plan — the same shield bug wearing a different
     hat. Stated here rather than fought with `!important`. */
  .zone-canvas .empty:not(.hidden) {
    position: absolute; inset: 0; z-index: 2; display: grid; place-content: center;
    text-align: center; gap: 0.4rem; color: var(--ink); padding: 1rem;
    /* It is a message, not a control — nothing in it is clickable. Without this
       it covers the canvas it sits on and eats pan, zoom and click, which is the
       same shield this file has now been bitten by twice. */
    pointer-events: none;
  }
  .zone-canvas .empty strong { font-weight: 600; letter-spacing: 0.05em; }
  .zone-canvas .empty span { font-size: 0.72rem; opacity: 0.6; }
  .zone-canvas .empty code { background: #0001; padding: 0.1rem 0.4rem; }
  .hidden { display: none; }

  /* --- bottom region: the results band ---
     Tabular/temporal output lives at the bottom of the page, not in overlays
     covering the plan. Band 1 = results (QA, area figures): sometimes
     visible, collapsed to a one-line strip by default — a fully hidden band
     gets forgotten, an always-open one eats plan area. Each block's body has
     a max height and scrolls internally so a long mismatch list can never
     squeeze the plans; expanding a block never resizes them either (the
     region is auto-height below a cap). Band 2 (the always-on source-data
     grid) is the next step and slots in as a sibling block. */
  /* ONE height for the whole region, user-draggable, now that band 2 (the
     always-visible grid) gives it a persistent height to drag. Expanding a
     band-1 block takes space from the GRID, never from the plans — the plans
     must not resize because a QA run finished. Band 1 blocks are auto-height
     (capped, scrolling internally); the grid flexes into whatever is left. */
  #bottomRegion {
    border-top: 1px solid var(--ink); background: var(--paper);
    display: flex; flex-direction: column;
    /* 20rem, not 16: the region hosts a results band over the grid now, and
       16rem left too little for both once a results block was expanded. */
    height: var(--bottom-h, 20rem); min-height: 0;
    min-width: 0; /* see body's grid-template-columns: the grid must scroll, not stretch */
  }
  /* Two shrink states, both dropping the dragged height so a folded region
     doesn't hold a band of blank paper over the plans (see updateRegionHeight):
     - `.empty`  — nothing to show at all: the footer collapses to ~0, its
        content crushed by the greedy `1fr` zones row against min-height:0.
     - `.strips` — everything collapsed to its one-line strip (band-1 blocks
        closed, band 2 folded to its bar): the strips must stay visible at the
        bottom, so min-content stops that same `1fr` row from crushing them. */
  #bottomRegion.empty { height: auto; }
  #bottomRegion.strips { height: auto; min-height: min-content; }
  /* Drag handle: the region's whole top edge — resizes the region against
     the plans. The second handle (#bandDivide) splits band 1 against band 2
     *within* that height; the two never fight, because this one moves the
     region's outer edge and that one moves an inner boundary. */
  #regionDrag { flex: 0 0 4px; cursor: row-resize; background: transparent; }
  #regionDrag:hover, #regionDrag.dragging { background: var(--accent); }

  /* Band 1 as a real element, so the split between the results and the grid
     has something to move. Content-sized by default (a collapsed strip costs
     one line); once dragged it takes an explicit height and `.sized` wins. */
  /* `--band1-max` is recomputed in JS as "region minus the grid's own
     minimum", so band 1 can never starve the table — a percentage cap can't
     express that, since the grid's floor depends on its toolbar and header. */
  #band1 { display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; max-height: var(--band1-max, 65%); }
  #band1.sized { flex: 0 0 var(--band1-h); }
  #bandDivide {
    flex: 0 0 5px; cursor: row-resize; background: var(--rule);
    border-top: 1px solid var(--ink);
  }
  #bandDivide:hover, #bandDivide.dragging { background: var(--accent); }
  #bandDivide.hidden { display: none; }

  .result-band {
    border-bottom: 1px solid var(--rule);
    display: flex; flex-direction: column; min-height: 0;
    flex: 0 0 auto;
  }
  /* An expanded block shares band 1's height with any sibling; a collapsed
     one stays exactly its summary strip. `flex-basis: auto` (not 0) is
     required: band 1 is content-sized until it is dragged, and a zero basis
     would collapse that parent to nothing. */
  .result-band.open { flex: 1 1 auto; }
  .result-band.hidden { display: none; }
  /* A block dragged against its immediate neighbour (the .band-split between
     them) gets an explicit starting height instead of an equal automatic
     share. `1 1`, not `0 0`: the pair must still yield under real space
     pressure (region shrunk, a third block opened) rather than spilling out
     of band 1 — the squeeze then shows up as internal scrolling, the same way
     an un-sized open block already behaves. */
  .result-band.open.sized { flex: 1 1 var(--band-h); }
  /* The split between two adjacent band-1 blocks — #bandDivide's role
     (band 1 vs band 2) generalized to a pair sharing band 1's own height.
     Hidden unless BOTH neighbours are open: a collapsed block is a fixed
     strip, nothing to trade height with. */
  .band-split { flex: 0 0 5px; cursor: row-resize; background: var(--rule); }
  .band-split:hover, .band-split.dragging { background: var(--accent); }
  .band-split.hidden { display: none; }
  .band-head {
    display: block; width: 100%; text-align: left; flex: 0 0 auto;
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em;
    background: none; color: var(--ink); border: none;
    padding: 0.35rem 1.25rem; cursor: pointer;
  }
  .band-head:hover { background: var(--fill); }
  .band-head .issues { color: var(--accent); font-weight: 600; }
  /* Flex inside the region's capped height, so expanded blocks divide it and
     each scrolls internally rather than growing the page. */
  .band-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0.2rem 1.25rem 0.7rem; font-size: 0.72rem; }
  .band-body.hidden { display: none; }
  .band-body section { margin-bottom: 1rem; }
  .band-body section h3 { font-size: 0.68rem; margin: 0 0 0.35rem; }
  /* One QA block per reference source. The rule is the divider — a finding
     only means something against the source that found it, so the sections
     must not read as one flat list when a project configures two. */
  .band-body section.qa-source { border-top: 1px solid var(--rule); padding-top: 0.5rem; }
  .band-body section.qa-source > h2 {
    font-size: 0.72rem; margin: 0 0 0.5rem; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .band-body .qa-source-meta { text-transform: none; letter-spacing: 0; opacity: 0.7; font-weight: 400; }
  /* The phase block is not a source block: it reports that the models disagree
     about which Revit phase they were filtered to, which is a property of the
     project rather than of anything joined onto it. Accented so it does not
     read as a fourth reference source in the list. */
  .band-body section.qa-phases { border-top-color: var(--accent); }
  .band-body section.qa-phases > h2 { color: var(--accent); }
  .band-body section.qa-phases > p { margin: 0 0 0.4rem; opacity: 0.8; }
  .band-body ul { margin: 0; padding-left: 1.1rem; }
  .band-body .mismatch { margin-bottom: 0.3rem; }
  .band-body .ok { opacity: 0.6; }
  /* A misconfigured join, not a data finding — the one thing in this band that
     is about the SETTINGS rather than the rooms, so it is the one thing given a
     box instead of a heading and a list. It sits above every list it invalidates. */
  .band-body section.config-error {
    margin: 0 0 0.6rem; padding: 0.5rem 0.7rem;
    border: 2px solid var(--error);
    background: color-mix(in srgb, var(--error) 12%, transparent);
  }
  .band-body section.config-error > h3 { margin: 0 0 0.3rem; }
  /* QA entries are jump targets into the grid below. */
  .band-body [data-room] { cursor: pointer; }
  .band-body [data-room]:hover { color: var(--accent); }
  .band-body button.refresh {
    font-family: var(--mono); font-size: 0.68rem; background: var(--paper);
    color: var(--ink); border: 1px solid var(--ink); padding: 0.25rem 0.5rem;
    cursor: pointer; margin: 0.2rem 0.5rem 0.6rem 0;
  }
  .band-body select.picker {
    font-family: var(--mono); font-size: 0.68rem;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); padding: 0.2rem 0.4rem; margin-bottom: 0.6rem;
  }

  /* --- adjacency graph (band 1, canvas) ---
     The canvas fills whatever height the band is given, same as before — but
     that height can now drop below the canvas's own floor (its min-height
     plus the bar), whether from the region being dragged small or from the
     new split against a neighbouring block. Scroll rather than clip: the
     canvas keeps its full min-height and the body scrolls to reach the rest,
     so a small band loses convenience, not visibility, of the graph. */
  #adjBody { display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 0.4rem; }
  /* `.band-body.hidden` (0,2,0) loses to the `#adjBody` rule above (1,0,0) —
     the collapsed band kept its canvas flex-visible, holding the bottom
     region open. Qualify with the id (1,1,0) so hidden always wins here. */
  #adjBody.hidden { display: none; }
  /* Sticky, not static: once the body scrolls, the depth/colour/wall-gap
     controls must stay reachable rather than scrolling out of view with the
     canvas — the same reasoning as the grid's sticky column headers. */
  #adjBar {
    position: sticky; top: 0; background: var(--paper); z-index: 1;
    flex: 0 0 auto; display: flex; align-items: center; gap: 0.9rem;
    flex-wrap: wrap; margin-bottom: 0.4rem;
  }
  #adjBar label { display: flex; align-items: center; gap: 0.3rem; font-size: 0.68rem; letter-spacing: 0.04em; }
  #adjBar select.picker { margin-bottom: 0; }
  #adjBar input[type="range"] { width: 8rem; accent-color: var(--accent); }
  #adjBar .count { font-size: 0.66rem; color: var(--accent); letter-spacing: 0.06em; }
  #adjBar #adjMeta { margin-left: auto; }
  /* A minimum so a collapsed-to-nothing band never renders a 3px canvas; the
     region's own drag handle is how the user gives the graph real room. */
  #adjCanvas { flex: 1 1 auto; min-height: 200px; width: 100%; display: block; }

  /* --- hierarchy gross-area footprints: overlay + summary --- */
  .zone-toolbar button.areas-toggle {
    font-family: var(--mono); font-size: 0.72rem;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); padding: 0.2rem 0.4rem; cursor: pointer;
  }
  .zone-toolbar button.areas-toggle.on { border-color: var(--accent); color: var(--accent); }
  .zone-toolbar button.areas-toggle.hidden,
  .zone-toolbar select.areasTier.hidden { display: none; }
  /* Rooms recede so the dissolved footprints read clearly on top. */
  svg.plan.areas-active .room,
  svg.plan.areas-active .hole { opacity: 0.16; }
  svg.plan.areas-active .label { opacity: 0.22; }
  /* The selection is page state and must read in EVERY zone showing it — ghosted
     to 0.16 under a footprint it was there but invisible, so a room selected
     with areas on looked like nothing had happened. */
  svg.plan.areas-active .room.selected { opacity: 1; }
  /* Footprints ARE hit targets — they are what an areas-on plan is showing, and
     `areaAtNode` resolves a click on one to its group. This was briefly
     `pointer-events: none` to stop the overlay swallowing room clicks: a hit on
     it made `roomAtNode` return null, which the pointerup handler reads as
     "clicked empty space", so an areas-on zone silently CLEARED the page
     selection — including one made in another zone. The click now means
     something instead of being disabled. */
  .area-poly { fill-opacity: 0.32; stroke: var(--area-colour); stroke-width: 2;
               vector-effect: non-scaling-stroke; cursor: pointer; }
  /* A group withheld from tiers above (Case-A exclusion) reads as dashed + faint. */
  .area-poly.faded { fill-opacity: 0.12; stroke-dasharray: 5 4; }
  /* Same visual language as `.room.selected` — dashed accent, stroke only, so a
     selected footprint keeps its group colour and its counted/uncounted read.
     AFTER `.faded` on purpose: equal specificity, so source order decides, and a
     selected uncounted group must still show it is selected. */
  .area-poly.selected { stroke: var(--accent); stroke-width: 5; stroke-dasharray: 6 3; fill-opacity: 0.42; }
  .area-label { fill: var(--ink); text-anchor: middle; dominant-baseline: middle;
                pointer-events: none; font-weight: 600; }
  /* Areas results table (band 1). Table shape shared with the old overlay
     panel; the note/total/swatch styling carried over. */
  .band-body .note { opacity: 0.6; margin: 0 0 0.6rem; }
  .band-body table { border-collapse: collapse; min-width: 34rem; }
  .band-body th, .band-body td { text-align: right; padding: 0.22rem 0.5rem; border-bottom: 1px solid var(--rule); }
  .band-body th:first-child, .band-body td:first-child,
  .band-body th.lvl, .band-body td.lvl { text-align: left; }
  .band-body thead th { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.6; }
  .band-body tr.total td { font-weight: 600; border-top: 2px solid var(--ink); }
  .band-body .swatch { display: inline-block; width: 0.6rem; height: 0.6rem; margin-right: 0.35rem; vertical-align: middle; }
  .band-body .uncounted { opacity: 0.6; font-style: italic; }

  /* --- bottom region, band 2: the source-data grid ---
     Ambient, always visible, not dismissable: the tabular view of what the
     plans show graphically. Takes whatever height band 1 leaves. */
  /* `flex-basis: 0`, not auto: an auto basis resolves to the whole table's
     content height (thousands of px), which would dominate the region's
     shrink distribution and squeeze band 1 to nothing. A zero basis makes
     the grid purely "whatever is left over". */
  #gridBand { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #gridBand.hidden { display: none; }
  #gridBar {
    flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem;
    padding: 0.3rem 1.25rem; font-size: 0.7rem; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--rule);
  }
  #gridBar label { cursor: pointer; }
  #gridBar .count { margin-left: auto; color: var(--accent); font-size: 0.66rem; }
  #gridBar button {
    font-family: var(--mono); font-size: 0.66rem; background: var(--paper);
    color: var(--ink); border: 1px solid var(--ink); padding: 0.15rem 0.4rem; cursor: pointer;
  }
  /* The collapse toggle reads as the bar's label, not a button — matching the
     band-1 blocks' ▾/▸ heads rather than the Clear/Download controls beside it. */
  #gridBar button.grid-collapse {
    font-weight: 700; letter-spacing: 0.06em; font-size: 0.7rem;
    background: none; border: none; padding: 0;
  }
  #gridBar button.grid-collapse:hover { color: var(--accent); }
  /* Collapsed: the band is just its bar. The table and empty-note fold away
     and the band stops flex-filling, so band 1 (or, via the region shrinking
     to its strips, the plans) reclaims the space. */
  #gridBand.collapsed { flex: 0 0 auto; }
  #gridBand.collapsed #gridScroll,
  #gridBand.collapsed #gridEmpty { display: none; }
  /* The scroll container for BOTH axes: rows scroll vertically (windowed —
     only the visible slice is in the DOM), columns horizontally when model +
     dRofus are shown together. */
  #gridScroll { flex: 1 1 auto; overflow: auto; min-height: 0; min-width: 0; }
  /* table-layout:fixed is load-bearing for windowing: content-derived widths
     would jitter as rows swap in and out, since only the visible slice is
     ever measured. */
  #gridTable { border-collapse: collapse; table-layout: fixed; font-size: 0.68rem; }
  #gridTable th, #gridTable td {
    width: 8rem; max-width: 8rem; padding: 0.15rem 0.4rem; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-right: 1px solid var(--rule);
  }
  #gridTable td { border-bottom: 1px solid var(--rule); }
  #gridTable thead th {
    position: sticky; background: var(--paper); z-index: 2;
    font-weight: 600; text-transform: uppercase; font-size: 0.6rem;
    letter-spacing: 0.06em; cursor: pointer; user-select: none;
  }
  /* Two header rows: the source group spans its columns, names sit beneath.
     The group label is pinned to the left of the *scroll viewport* rather
     than centred in its span — a span 48 columns wide centres its label
     thousands of pixels off-screen, so the group would be invisible exactly
     when the table is wide enough to need it. */
  #gridTable thead tr.group th { top: 0; text-align: left; cursor: default; border-bottom: 1px solid var(--ink); }
  #gridTable thead tr.group th > span { position: sticky; left: 0.4rem; display: inline-block; }
  #gridTable thead tr.names th { top: 1.35rem; border-bottom: 1px solid var(--ink); }
  #gridTable thead tr.group th.src-model { color: var(--ink); }
  #gridTable thead tr.group th.src-reference { color: var(--accent); }
  /* Reference-source columns (dRofus, or any other configured source)
     tinted as a block, so the "separate sub-object, never merged" boundary
     is visible rather than implied. */
  #gridTable .src-reference { background: color-mix(in srgb, var(--accent) 7%, var(--paper)); }
  /* A reference-source column with no Revit counterpart in row 2 of the CSV
     (only known for dRofus -- see detectReferenceSources): shown, visibly
     distinguished, never hidden (see field coverage). */
  #gridTable thead th.unmapped { font-style: italic; opacity: 0.75; }
  #gridTable thead th.sorted::after { content: " ▾"; color: var(--accent); }
  #gridTable thead th.sorted.asc::after { content: " ▴"; }
  #gridTable tbody tr:hover td { background: var(--fill); }
  #gridTable tbody tr.target td { outline: 1px solid var(--accent); }
  /* A cell the QA report disagrees on, marked in place — the (room, field)
     address compute_validation already produces IS a (row, column) here. */
  #gridTable td.err { color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--error) 45%, transparent); }
  #gridTable tr.spacer td { padding: 0; border: none; }
  #gridFilters input {
    font-family: var(--mono); font-size: 0.62rem; width: 100%;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule); padding: 0.1rem 0.2rem;
  }
  #gridEmpty { padding: 0.6rem 1.25rem; font-size: 0.7rem; opacity: 0.6; }
</style>
</head>
<body>
  <header>
    <h1>Room Plan</h1>
    <select class="picker hidden" id="projectSelect" title="Project — the scope of everything on screen"></select>
    <select class="picker hidden" id="milestoneSelect" title="Milestone — Latest or a pinned issue"></select>
    <select class="picker hidden" id="buildingSelect" title="Building"></select>
    <button class="ctl" id="addZone" title="Add a zone">+ zone</button>
    <button class="ctl" id="removeZone" title="Remove the last zone">− zone</button>
    <button class="ctl" id="linkToggle" title="Sync zoom/pan across all zones">Link views: off</button>
    <button class="ctl on" id="labelsToggle" title="Show or hide room labels (SVG export follows)">Labels: on</button>
    <button class="ctl on" id="doorsToggle" title="Show or hide door glyphs">Doors: on</button>
    <button class="ctl on" id="windowsToggle" title="Show or hide window glyphs">Windows: on</button>
    <button class="ctl on" id="ffeToggle" title="Show or hide furniture, fixtures and equipment">FF&amp;E: on</button>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Search rooms…" autocomplete="off" />
      <button class="ctl" id="fieldsToggle" title="Choose which fields to search">Fields ▾</button>
      <div id="fieldsPanel" class="fields-panel hidden"></div>
    </div>
    <div class="links">
      <a href="/comparison.html">compare</a>
      <a href="/settings.html">settings</a>
    </div>
  </header>
  <!-- The middle band is two columns: the zones, and the right-hand inspector
       (selection is page state). A wrapper rather than columns on <main>
       itself, because `main` IS the zone container and its
       `grid-template-columns` is rewritten from JS on every zone add/remove —
       any static column here would be overwritten. -->
  <div id="mainRow">
    <main id="zones"></main>
    <aside id="inspector" class="hidden" aria-label="Selected room"></aside>
  </div>

  <!-- Bottom region, band 1: results. One instance per page, never per zone —
       both blocks are scope-derived, and a region that multiplied with zone
       count would stop being a stable place users can point at. -->
  <footer id="bottomRegion">
    <div id="regionDrag" title="Drag to resize the whole panel"></div>
    <div id="band1">
    <div class="result-band hidden" id="qaBand">
      <button class="band-head" id="qaHead">▸ QA</button>
      <div class="band-body hidden" id="qaBody">
        <button class="refresh" id="qaRefresh">Refresh</button>
        <button class="refresh" id="qaDownload">Download CSV</button>
        <div id="qaContent"></div>
      </div>
    </div>
    <div class="band-split hidden" id="qaAreasSplit" title="Drag to split space between QA and Hierarchy areas"></div>
    <div class="result-band hidden" id="areasBand">
      <button class="band-head" id="areasHead">▸ Hierarchy areas</button>
      <div class="band-body hidden" id="areasBody">
        <select class="picker" id="areasBandTier" title="Tier for the figures below"></select>
        <button class="refresh" id="areasDownload">Download CSV</button>
        <div id="areasContent"></div>
      </div>
    </div>
    <div class="band-split hidden" id="areasAdjSplit" title="Drag to split space between Hierarchy areas and Adjacency"></div>
    <!-- Adjacency graph. A band-1 block like the other two, for the same
         reason: it is a page-level result derived from the scope (plus the one
         page selection), not a per-zone presentation. Lives here rather than in
         a right-hand column because that column is reserved for the room
         inspector. -->
    <div class="result-band hidden" id="adjBand">
      <button class="band-head" id="adjHead">▸ Adjacency</button>
      <div class="band-body hidden" id="adjBody">
        <div id="adjBar">
          <!-- Depth is a client-side ring cap over data already held, so the
               list can run as deep as the graph does. 2 stays the DEFAULT
               (the readability guarantee — the whole level is a hairball), but
               "All" is a legitimate question and there is no reason the control
               stopped at 3. -->
          <label>Depth
            <select class="picker" id="adjDepth" title="How many walls out from the selected room or area; All follows the graph as far as it reaches">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="8">8</option>
              <option value="all">All</option>
            </select>
          </label>
          <label>Colour <select class="picker" id="adjTier" title="Classification tier driving node colour"></select></label>
          <!-- The wall tolerance, in mm because that is what a UK/EU hospital
               job is drawn in; the wire value is feet, converted at this edge.
               A TUNING INSTRUMENT, not a settled preference: it opens showing
               the tolerance the SERVER derived for this project (the declared
               [areas] max_wall_thickness, or zero where every level in scope is
               centreline) and only overrides it once dragged. See the
               `adjWallMm` / `syncWallFromServer` pair below. -->
          <label id="adjWallLabel" title="Largest gap still counted as a shared wall. Opens at the project's declared value — 0 where rooms are drawn to wall centrelines (neighbours touch exactly), the wall thickness where they are drawn to finish faces. Drag only to probe a different tolerance.">
            Wall gap
            <input type="range" id="adjWall" min="0" max="900" step="10" />
            <span id="adjWallOut" class="count"></span>
          </label>
          <span class="count" id="adjMeta"></span>
        </div>
        <canvas id="adjCanvas"></canvas>
      </div>
    </div>
    </div><!-- /#band1 -->

    <!-- The band 1 / band 2 split. Shown only when a band-1 block is actually
         expanded, since there is nothing to redistribute between a collapsed
         summary strip and the grid. -->
    <div id="bandDivide" class="hidden" title="Drag to split space between the results and the table"></div>

    <!-- Band 2: source data. Always visible (never a summary strip) — it is
         the tabular view of the data itself, not the output of an action. -->
    <div id="gridBand" class="hidden">
      <div id="gridBar">
        <!-- The Rooms label doubles as a collapse toggle, the same ▾/▸
             affordance the band-1 blocks carry — folding band 2 down to its
             bar when the plans matter more than the table. -->
        <button class="grid-collapse" id="gridHead" title="Collapse the table">▾ Rooms</button>
        <label><input type="checkbox" id="srcModel" checked /> Model</label>
        <!-- One checkbox per discovered reference source (dRofus, or any
             other), rendered by syncReferenceSources() -- see detectReferenceSources. -->
        <span id="srcToggles"></span>
        <button id="gridClearFilters" title="Clear all column filters">Clear filters</button>
        <button id="gridDownload">Download CSV</button>
        <span class="count" id="gridCount"></span>
      </div>
      <div id="gridScroll"><table id="gridTable"></table></div>
      <div id="gridEmpty" class="hidden"></div>
    </div>
  </footer>

  <!-- One zone's DOM. Cloned per panel by createZone(); every stateful node is
       reached via querySelector on the clone, never a document-wide id. -->
  <template id="zoneTemplate">
    <div class="zone">
      <!-- Presentation only: scope (project/milestone/building) is global and
           lives in the header — zones differ in level and colour, never data. -->
      <div class="zone-toolbar">
        <select class="picker colourSelect hidden"></select>
        <select class="picker levelSelect hidden"></select>
        <button class="export-svg hidden" title="Export every level as its own SVG file">Export SVGs</button>
        <button class="areas-toggle hidden" title="Show hierarchy footprints on this zone's plan">Areas</button>
        <select class="picker areasTier hidden" title="Footprint tier (this zone's overlay)"></select>
        <span class="meta">waiting for data</span>
      </div>
      <div class="zone-canvas">
        <svg class="plan" xmlns="http://www.w3.org/2000/svg"></svg>
        <!-- The `waiting` state of setZoneEmpty(), spelled out here so it paints
             before any JS runs. That function rewrites this content for the
             `scope` and `level` states — keep the two in step. -->
        <div class="empty">
          <strong>No rooms received yet</strong>
          <span>POST room JSON to <code>/rooms</code>, then this updates.</span>
        </div>
        <!-- Replaces the per-room SVG <title> the browser used to draw for
             free. Present for both renderers, but only the WebGL one uses it:
             the SVG renderer still has real <title> elements. -->
        <div class="plan-tip hidden"></div>
        <!-- Shown while a large level is being built. See `paintWithBusy`. -->
        <div class="plan-busy hidden"><span>Drawing plan…</span></div>
      </div>
    </div>
  </template>

<!-- Shared selection-persistence helpers (seedProjectId / persistSelection),
     the same file settings.html and comparison.html load. -->
<script src="common.js"></script>
<!-- The adjacency graph's canvas renderer. Its own file, not another few
     hundred lines of index.html: it is the page's second renderer (canvas, not
     SVG) and the file boundary is where the concern boundary is. -->
<script src="graph.js"></script>
<!-- The plan renderer, and the one file on this page that is BUILT rather than
     written: TypeScript in src-js/, bundled by Vite, committed at
     static/vendor/ so a fresh clone plus `cargo run` still serves a working
     viewer with no node installed. Edit the source, run `npm run build`, commit
     the result -- CI rebuilds it and fails if the two disagree.
     A classic <script>, not type="module", deliberately: it must finish
     executing before the inline script below runs, and a module would defer
     past it. See docs/Superseded/PLAN-webgl-renderer.md. -->
<script src="vendor/renderer.bundle.js"></script>
<script>
const SVG = "http://www.w3.org/2000/svg";
const zonesEl = document.getElementById("zones");
const zoneTemplate = document.getElementById("zoneTemplate");

// A zone is a PRESENTATION of the one global scope: its own SVG, view
// transform, level and colour selection. Scope (project/milestone/building),
// the poll cursor, the payload, colour-plan config, and validation state are
// module-level singletons — there is exactly one scope on screen, so zones
// can never disagree about what data they show, only how they draw it
// (there is one scope on screen: the single-project viewer). Multiple zones
// exist to show several LEVELS of one building at once.
const zones = [];
let zoneSeq = 0;

// ---- global scope + data (one for the page, not per zone) ----
let projectId = null;
let buildingKey = null;
let milestone = null;        // null = Latest
let currentPayload = null;   // the one /rooms payload every zone renders from
// The one /doors payload, fetched and revisioned exactly like the rooms one.
// SEPARATE from currentPayload rather than merged into it: doors are pushed
// independently of rooms (the extractor has its own entry point for them), so
// they change on their own schedule and a shared revision would make each
// entity's poll re-render the other for nothing.
let doorsPayload = null;
let lastDoorsRevision = null;
// The one /windows payload. A THIRD list rather than merging into the doors
// one: the two are pushed independently, toggled independently, and draw
// differently, so a shared revision would make each entity's poll re-render the
// other for nothing -- the same argument that kept doors out of currentPayload.
let windowsPayload = null;
let lastWindowsRevision = null;
// The one /ffe payload. A FOURTH list rather than merging into the openings,
// for the reason windows got a third: the three draw differently and toggle
// independently. It matters most here -- a furnished level carries hundreds of
// items against tens of openings, so this is the layer a reader turns off first.
let ffePayload = null;
let lastFfeRevision = null;
let lastRevision = null;     // poll change-detection cursor
// The server's ETag for the last body we actually received, per entity.
//
// A SECOND cursor beside `lastRevision`, not a replacement for it, and the two
// answer different questions. `revision` rides in the body and says whether the
// content we now hold differs from what we drew — it decides whether to
// re-render. The ETag is sent back up as `If-None-Match` and lets the SERVER
// decide not to build a body at all; it is deliberately more conservative than
// the revision (see `service::scope_cursor`), so the two are not interchangeable
// and must not be collapsed into one.
//
// Neither needs clearing on a scope change, unlike `lastRevision` beside them:
// the tag is computed over the project/building/milestone/filter it was issued
// for, so a tag from the old scope simply cannot match and the server answers
// 200. The failure this rules out — a stale 304 hiding a scope switch — is
// structural rather than something the reset lines below have to remember.
let lastRoomsEtag = null;
let lastDoorsEtag = null;
let lastWindowsEtag = null;
let lastFfeEtag = null;
// Picker refresh guards (diff signatures so the 2s tick doesn't fight the user).
let lastProjectIds = null;
let lastBuildingsSignature = null;
let lastMilestonesSignature = null;
// One-shot guards: URL/localStorage restore runs once, then ticks re-default plainly.
let seededProject = false;
let seededScope = false;
// Colour-plan config for the current project (fetched once per project change).
// Which plan is APPLIED stays per zone — that is presentation.
let colourPlans = [];
let colourPlansProjectId = null;
// Validation is project-scoped: one report, one error set, one results block
// in the bottom band. Error highlighting on the plans follows the QA block's
// expansion — page state, since the block it tracks is page-level.
let currentValidation = null;
let errorRoomIds = new Set();
let showErrors = false;
// Hierarchy-areas data is scope-derived, so one dataset serves every zone's
// overlay AND the bottom band's figures. Per zone remain only the overlay
// toggle (areasMode) and the overlay's tier (areasTier); the band's figures
// have their own tier picker (areasBandTier) — overlay is presentation on one
// zone's level, the figures are results over the whole scope.
let areasData = null;
let areasBandTier = 0;

// Global: sync the view transform across every zone when on (see commitView).
let linkViews = false;

// Global: render room labels (default on). Threads through paintLevel's
// options rather than a CSS class on the zone SVG, because the SVG export
// calls paintLevel directly and never sees zone-level classes — a CSS-only
// toggle would be silently ignored by every exported file. Deliberately not
// persisted: linkViews isn't either, and view prefs should persist together
// or not at all (STRATEGY-BROWSER.md, "UI growth").
let showRoomLabels = true;
// Doors default to ON: a door is plan information, not an annotation, and the
// people who asked for the glyph want it by default. Page state, not per zone,
// matching how labels work.
let showDoors = true;
let showWindows = true;
let showFfe = true;

// Global room search (see the "search" section lower down): one query + one set
// of enabled field keys, applied to every zone. `searchFields` empty means "not
// yet initialised" — populated to all-available on first data / panel build.
let searchQuery = "";
const searchFields = new Set();
let searchFieldsInitialised = false;
// One payload -> one match set; zones share it and differ only in which level's
// matches are visible.
let searchMatchIds = null;
let searchActive = false;

// ---- selection: PAGE state, not zone state
// One selected THING at a time regardless of which zone the click landed in. The
// same room can legitimately appear in two zones showing the same level, so the
// highlight is applied in EVERY zone that draws it, while `zoneId` records where
// the click came from. That id is a *label* (the graph panel and the inspector
// name it), not `activeZoneId` focus machinery — selection is explicit, never
// inferred from where the user last interacted, which is what made the old focus
// model expensive.
//
// `kind` is what makes this more than a room id. The plan draws two selectable
// things already (rooms, and the hierarchy footprints on top of them) and the
// pipeline anticipates a third (FFE — see STRATEGY.md "Any future upload"). One
// tagged shape means a new kind is a renderer registration plus a hit test, not
// another parallel id and another `if` in every consumer.
let selection = null;   // { kind: "room" | "area", id, zoneId } | null

// The selected ROOM id, or null when the selection is something else. Every
// room-only consumer (the plan outline, the adjacency graph, the grid jump)
// reads this rather than `selection.id`, so an area selection can never be
// mistaken for a room id — feeding one to the graph would hunt for a node that
// does not exist.
function roomSelection() { return selection && selection.kind === "room" ? selection.id : null; }
function doorSelection() { return selection && selection.kind === "door" ? selection.id : null; }
function windowSelection() { return selection && selection.kind === "window" ? selection.id : null; }
function itemSelection() { return selection && selection.kind === "item" ? selection.id : null; }

// Anything that wants to react to a selection change registers here. Listeners
// receive the whole `selection` object (or null), so a kind-blind listener must
// filter — see the adjacency one at the bottom of the file. Both current
// listeners registered themselves rather than editing `select`, which is what
// the list was for.
const selectionListeners = [];

async function fetchJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${url} -> ${res.status}`);
  return res.json();
}

// ======================= pure geometry helpers =======================
// These MOVED to src-js/renderer/geometry.ts and are re-bound here under their
// original names, so the ~20 call sites below read exactly as they did.
//
// Why they moved: the WebGL renderer needs the same flip, the same bboxes and
// the same fitted frame as the SVG export, and a second copy of that arithmetic
// is a drift waiting to happen. They are also pure, which made them the
// cheapest possible first thing to put under test — see geometry.test.ts,
// including the degenerate-ring case that would otherwise place a label at NaN.
//
// The coordinate rule they encode is unchanged and still load-bearing: payload
// data is Y-up, everything from here down is Y-down.
const { flip, bounds, loopBox, pointsAttr, centroid, roomBBox, fittedBounds, addLabel } = PlanRenderer;

// Build the ordered list of levels to show. Prefer the payload's `levels`
// array (ordered by elevation on the server); fall back to deriving from
// rooms if an older payload omits it.
function levelsForPayload(payload) {
  if (Array.isArray(payload.levels) && payload.levels.length) {
    return payload.levels.slice().sort((a, b) => a.elevation - b.elevation);
  }
  const seen = new Map();
  for (const r of payload.rooms || []) {
    const id = r.level_id || "unknown";
    if (!seen.has(id)) seen.set(id, { id, name: id, elevation: 0 });
  }
  return [...seen.values()];
}

function roomsOnLevel(payload, levelId) {
  return (payload.rooms || []).filter(r => (r.level_id || "unknown") === levelId);
}

// ============================ colour plans ============================
//
// All client-side by design: the server stores `colour_plans` verbatim and
// computes nothing (see settings `colour_plans`). All three modes —
// property-compare, hierarchy, date-range — are wired here. Every function in
// this block is pure (data in, colour/number out) and zone-agnostic; a zone
// only carries the *selected* plan (`zone.activeColourPlan`).

// Fill for a room the active plan can't colour — missing/unparseable property,
// ratio-by-zero, a value in a gap between bands, or an undefined hierarchy
// tier. A muted neutral, deliberately distinct from --fill so "not coloured by
// this plan" reads as a state, not a bug.
const NO_DATA_COLOUR = "#c9c2b0";
// match mode is binary and needs no palette — two fixed, colour-blind-safe
// stops (ColorBrewer RdYlGn extremes): within tolerance vs. not.
const MATCH_COLOUR = "#1a9850";     // green: |A−B| within tolerance
const MISMATCH_COLOUR = "#d73027";  // red:   outside tolerance

// ---- Renderer notes ---------------------------------------------------------
//
// The plan is drawn by ONE renderer now: WebGL, via `PlanRenderer` in
// static/vendor/renderer.bundle.js (source: src-js/renderer/). The SVG live
// renderer that preceded it is deleted, and with it two switches that used to
// live here.
//
// `CULL_ENABLED` is gone because viewport culling is gone. It was an SVG
// necessity -- the DOM charges per element per frame, and a zoomed-in pan on
// `big-plate` cost 16.5 ms/frame with it against 912 ms without. WebGL charges
// four draw calls whatever the room count, so there is nothing to hide and
// nothing to switch off.
//
// `RENDERER` is gone because there is no second renderer to select. What it
// existed for -- re-measuring rather than believing -- is kept as
// `measureSvgPaint()` further down, which times the export painter against the
// same level. See STRATEGY-BROWSER.md "Renderer" for the numbers that justified
// the deletion:
//
//     fitted pan, p95     SVG 733 ms   ->   WebGL 1 ms  (DPR 1), 2 ms (DPR 2)
//     build + layout      SVG 1,175 ms ->   WebGL 1,155 ms
//
// date-range: a date after near_date is "future" — a fixed blue, separate from
// the green→red near/far ramp (the RdYlGn scheme has no blue of its own).
const FUTURE_COLOUR = "#2c7fb8";

// `SCHEMES`, `hexToRgb`, `rgbToHex` and `qualitative` now live in common.js —
// the graph mode colours its nodes by department and must sample the exact same
// stops the hierarchy colour plan does. They are plain globals loaded ahead of
// this script; the plan-specific maths below still reads them unchanged.
function sampleScheme(name, t) {
  const stops = SCHEMES[name] || SCHEMES.RdBu; // unknown scheme -> a safe default
  t = Math.max(0, Math.min(1, t));
  if (stops.length === 1) return stops[0];
  const pos = t * (stops.length - 1);
  const i = Math.min(Math.floor(pos), stops.length - 2);
  const f = pos - i;
  const a = hexToRgb(stops[i]), b = hexToRgb(stops[i + 1]);
  return rgbToHex(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f);
}

// Resolve one authored property name against a room, as a raw string or null.
// A `<source>.<label>` name reads that joined reference record's field; anything
// else is one of the room's own properties. Absent and blank collapse to the
// same null, matching the server's `lookup_property` — a colour plan cannot act
// on an empty string any more than on a missing key.
//
// The split follows the server's rule (`split_namespace` in service/rooms.rs):
// a prefix binds as a namespace only when it names a source this payload
// actually carries, so a Revit property with a dot in its name keeps resolving
// as itself. `knownReferenceSources` is the vocabulary, refreshed by
// `syncReferenceSources()` at the top of `ingestAll` — before any zone renders,
// which is why colour can rely on it being current.
//
// Where the two rules part company: the server treats an unrecognised word
// before a dot as an error, and there is no error channel at colour time — an
// unresolvable plan just greys its rooms, the same "no data" degradation an
// unparseable value already gets. `validate_namespaced_field` (via
// bootstrap::load_project_bundle) refuses that typo at settings-load instead,
// where the message has somewhere to go.
function roomValue(room, name) {
  const dot = name.indexOf(".");
  if (dot > 0) {
    const source = name.slice(0, dot);
    if (knownReferenceSources.includes(source)) {
      const record = room[source];
      const value = record && record.fields ? record.fields[name.slice(dot + 1).trim()] : null;
      return value == null || value === "" ? null : value;
    }
  }
  const p = room.properties && room.properties[name];
  return p && p.value != null && p.value !== "" ? p.value : null;
}

function numericProp(room, name) {
  const raw = roomValue(room, name);
  if (raw == null) return null;
  const n = parseFloat(raw);
  return Number.isFinite(n) ? n : null;
}

function lighten(hex, t) {
  const [r, g, b] = hexToRgb(hex);
  return rgbToHex(r + (255 - r) * t, g + (255 - g) * t, b + (255 - b) * t);
}

function classKey(room, tierName) {
  const tv = (room.classification || []).find(t => t.tier === tierName);
  if (!tv || tv.undefined) return null;
  return tv.code != null ? tv.code : (tv.name != null ? tv.name : null);
}

function parseDate(value, format) {
  if (value == null || value === "") return null;
  if (format) return parseStrftime(value, format);
  const ms = Date.parse(value);
  return Number.isFinite(ms) ? ms : null;
}

function parseStrftime(value, pattern) {
  const order = [];
  let regex = "^";
  for (let i = 0; i < pattern.length; i++) {
    if (pattern[i] !== "%") { regex += pattern[i].replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); continue; }
    i++;
    let nopad = false;
    if (pattern[i] === "-") { nopad = true; i++; }
    const spec = pattern[i];
    const num = nopad ? "\\d{1,2}" : "\\d{2}";
    switch (spec) {
      case "Y": regex += "(\\d{4})"; order.push("Y"); break;
      case "y": regex += "(\\d{2})"; order.push("y"); break;
      case "m": regex += `(${num})`; order.push("m"); break;
      case "d": regex += `(${num})`; order.push("d"); break;
      case "H": regex += `(${num})`; order.push("H"); break;
      case "I": regex += `(${num})`; order.push("I"); break;
      case "M": regex += `(${num})`; order.push("M"); break;
      case "S": regex += `(${num})`; order.push("S"); break;
      case "p": regex += "([AaPp][Mm])"; order.push("p"); break;
      case "z": regex += "(Z|[+-]\\d{2}:?\\d{2})"; order.push("z"); break;
      case "%": regex += "%"; break;
      default: return null; // unsupported specifier -> refuse to guess
    }
  }
  const m = new RegExp(regex + "$").exec(String(value).trim());
  if (!m) return null;
  const f = {};
  order.forEach((k, idx) => f[k] = m[idx + 1]);
  const year = f.Y != null ? +f.Y : (f.y != null ? 2000 + +f.y : null);
  if (year == null) return null;
  let hour = f.H != null ? +f.H : (f.I != null ? +f.I : 0);
  if (f.p && f.I != null) hour = (+f.I % 12) + (/pm/i.test(f.p) ? 12 : 0);
  let ms = Date.UTC(year, (f.m != null ? +f.m - 1 : 0), (f.d != null ? +f.d : 1), hour, (f.M != null ? +f.M : 0), (f.S != null ? +f.S : 0));
  if (f.z && f.z !== "Z") {
    const zm = /([+-])(\d{2}):?(\d{2})/.exec(f.z);
    if (zm) ms += (zm[1] === "-" ? 1 : -1) * ((+zm[2]) * 60 + (+zm[3])) * 60000; // shift to UTC
  }
  return ms;
}

function propertyCompareNumber(room, mode) {
  const a = numericProp(room, mode.property_a);
  const b = numericProp(room, mode.property_b);
  if (a == null || b == null) return null;
  if (mode.op === "ratio") return b === 0 ? null : a / b;
  return a - b; // "diff" (default)
}

function buildColourContext(rooms, plan) {
  const ctx = { maxAbs: 0 };
  if (!plan) return ctx;
  const mode = plan.mode;

  if (mode.kind === "propertycompare" && mode.colouring.style === "diverging") {
    for (const room of rooms) {
      const n = propertyCompareNumber(room, mode);
      if (n != null) ctx.maxAbs = Math.max(ctx.maxAbs, Math.abs(n));
    }
  } else if (mode.kind === "hierarchy") {
    const parentTier = (mode.tiers || [])[0];
    const childTier = (mode.tiers || [])[1];
    const parents = new Set();
    const childrenByParent = new Map(); // parentKey -> Set(childKey)
    for (const room of rooms) {
      const pk = parentTier ? classKey(room, parentTier) : null;
      if (pk == null) continue;
      parents.add(pk);
      if (childTier) {
        const ck = classKey(room, childTier);
        if (ck != null) {
          if (!childrenByParent.has(pk)) childrenByParent.set(pk, new Set());
          childrenByParent.get(pk).add(ck);
        }
      }
    }
    ctx.parentHue = new Map();
    [...parents].sort().forEach((pk, i) => ctx.parentHue.set(pk, qualitative(mode.scheme, i)));
    ctx.childColour = new Map(); // `${pk}\0${ck}` -> tinted hex
    for (const [pk, set] of childrenByParent) {
      const base = ctx.parentHue.get(pk);
      const list = [...set].sort();
      list.forEach((ck, j) => ctx.childColour.set(`${pk}\0${ck}`, lighten(base, list.length > 1 ? (j / (list.length - 1)) * 0.55 : 0)));
    }
    ctx.parentTier = parentTier;
    ctx.childTier = childTier;
  } else if (mode.kind === "daterange") {
    ctx.nearMs = parseDate(mode.near_date, null); // near_date is a plain YYYY-MM-DD from the editor
    ctx.maxPast = 0;
    for (const room of rooms) {
      const d = parseDate(roomValue(room, mode.property), mode.format);
      if (d == null || ctx.nearMs == null) continue;
      const delta = d - ctx.nearMs;
      if (delta <= 0) ctx.maxPast = Math.max(ctx.maxPast, -delta); // past/at only; future goes blue
    }
  }
  return ctx;
}

function colourForRoom(room, plan, ctx) {
  const mode = plan.mode;

  if (mode.kind === "hierarchy") {
    const pk = ctx.parentTier ? classKey(room, ctx.parentTier) : null;
    if (pk == null) return NO_DATA_COLOUR;
    if (ctx.childTier) {
      const ck = classKey(room, ctx.childTier);
      if (ck != null && ctx.childColour.has(`${pk}\0${ck}`)) return ctx.childColour.get(`${pk}\0${ck}`);
    }
    return ctx.parentHue.get(pk) || NO_DATA_COLOUR;
  }

  if (mode.kind === "daterange") {
    const d = parseDate(roomValue(room, mode.property), mode.format);
    if (d == null || ctx.nearMs == null) return NO_DATA_COLOUR;
    const delta = d - ctx.nearMs;
    if (delta > 0) return FUTURE_COLOUR;
    const t = ctx.maxPast > 0 ? 1 - (Math.abs(delta) / ctx.maxPast) : 1;
    return sampleScheme(mode.scheme, t);
  }

  if (mode.kind !== "propertycompare") return NO_DATA_COLOUR; // unknown mode
  const number = propertyCompareNumber(room, mode);
  if (number == null) return NO_DATA_COLOUR;

  const c = mode.colouring;
  if (c.style === "match") {
    return Math.abs(number) <= c.tolerance ? MATCH_COLOUR : MISMATCH_COLOUR;
  }
  if (c.style === "diverging") {
    const extent = ctx.maxAbs || 1;
    return sampleScheme(c.scheme, 0.5 + number / (2 * extent));
  }
  if (c.style === "bands") {
    // Ordered first-match scan over half-open [lo, hi). Simplicity earned by
    // the server-side validation (bands sorted/disjoint) — no overlap logic.
    for (const band of c.bands) {
      const aboveLo = band.lo == null || number >= band.lo;
      const belowHi = band.hi == null || number < band.hi;
      if (aboveLo && belowHi) return band.colour;
    }
    return NO_DATA_COLOUR;
  }
  return NO_DATA_COLOUR; // unknown colouring style
}

// ============================ per-zone render ============================

// Everything below goes through `zone.renderer` — the seam
// (src-js/renderer/seam.ts), implemented today by the SVG code that has always
// drawn the plan.
//
// The seam owns what there are THOUSANDS of: fills, holes, outlines, labels,
// the pick, and the selection/hover marks. It does NOT own the areas overlay —
// dozens of footprints, staying SVG, `renderAreasOverlay` untouched
// (HANDOVER-webgl-renderer.md, Decision 1).

function setViewBox(zone) {
  // One call, and no cull scheduling behind it any more. Panning used to need a
  // requestAnimationFrame-throttled pass to hide off-screen rooms before the
  // next frame; the WebGL renderer draws the whole level in four draw calls, so
  // there is nothing to hide and nothing to throttle.
  zone.renderer.setView(zone.view);
}

// `fittedBounds` moved with the geometry (aliased above).

// The EXPORT painter's adapter. `paintLevel` no longer draws anything on
// screen -- the plan is WebGL -- and this is reached only from
// `buildLevelSvgFile`.
//
// It exists for ONE reason: the colour plan. The painter takes a
// `colourFor(room)` callback rather than a plan, because the palette lives in
// `common.js` -- a classic script four pages load, which the bundle cannot
// import. So the precedence rule (plan beats error beats default) is in the
// typed module and tested; which hex a value maps to stays here, where the
// palette is. Resolving the plan's per-level context once, here, also keeps it
// out of the per-room path.
function paintLevel(svg, rooms, fitted, { colourPlan = null, errorRoomIds = null, showErrors = false, matchRoomIds = null, searchActive = false, showLabels = true } = {}) {
  const colourCtx = colourPlan ? buildColourContext(rooms, colourPlan) : null;
  PlanRenderer.paintLevel(svg, rooms, fitted, {
    colourFor: colourPlan ? (room) => colourForRoom(room, colourPlan, colourCtx) : undefined,
    errorRoomIds, showErrors, matchRoomIds, searchActive, showLabels,
  });
}

// The re-measurement handle, replacing the deleted `RENDERER` flag.
//
// The point of that flag was never to offer a choice -- it was so the claim
// "WebGL is faster than SVG here" could be re-derived rather than believed,
// whenever the renderer changes again. Keeping a whole second live renderer
// alive to preserve that would have meant maintaining it forever, and an
// unexercised fallback rots.
//
// So the comparison is done against the EXPORT painter instead, which has to
// exist anyway and draws exactly the same geometry, into a detached <svg>. It
// measures the DOM construction; the browser's layout and paint of those nodes
// is the larger half and is what a live SVG renderer would additionally have
// paid every frame. Console-only, deliberately:
//
//   measureSvgPaint()            // active zone's level
//   measureSvgPaint("L0")        // a named level
function measureSvgPaint(levelId, runs = 5) {
  if (!currentPayload) return "no payload";
  const zone = zones[0];
  const id = levelId || zone.activeLevelId;
  const rooms = roomsOnLevel(currentPayload, id);
  const fitted = fittedBounds(rooms);
  if (!fitted) return `level ${id} has no drawable rooms`;
  const times = [];
  for (let i = 0; i < runs; i++) {
    const svg = document.createElementNS(SVG, "svg");
    const t = performance.now();
    paintLevel(svg, rooms, fitted, { showLabels: showRoomLabels });
    times.push(performance.now() - t);
  }
  times.sort((a, b) => a - b);
  return {
    level: id,
    rooms: rooms.length,
    nodes: rooms.length * 2,
    medianMs: +times[Math.floor(runs / 2)].toFixed(1),
    note: "DOM construction only; a live SVG renderer also paid layout+paint every frame",
  };
}


// The canvas overlay says one of three DIFFERENT things, and collapsing them
// into the one "No rooms received yet" message was the confusion worth fixing:
// only `waiting` is a setup step the user acts on. The other two describe data
// that arrived perfectly well, and until now showed as a blank canvas saying
// nothing at all — indistinguishable from a broken render.
//
//   waiting — nothing pushed yet. The initial state, in the template markup so
//             it paints before any JS runs.
//   scope   — a payload with no levels: the project/building/milestone pick
//             matched nothing. Fixed at the header pickers, not on the zone.
//   level   — this level has no rooms. The model is fine; the level is empty,
//             and the level picker already says "(0 rm)" next to its name.
function setZoneEmpty(zone, state, levelName = "") {
  const el = zone.els.empty;
  el.classList.toggle("hidden", !state);
  if (!state) return;

  const title = document.createElement("strong");
  const detail = document.createElement("span");
  if (state === "waiting") {
    title.textContent = "No rooms received yet";
    const code = document.createElement("code");
    code.textContent = "/rooms";
    detail.append("POST room JSON to ", code, ", then this updates.");
  } else if (state === "scope") {
    title.textContent = "No rooms in this scope";
    detail.textContent = "The data has no levels to draw — check the project, building and milestone pickers.";
  } else {
    // Named rather than "this level": with three zones open, which one is empty
    // is the question, and the panel is the only place that answers it.
    title.textContent = `${levelName || "This level"} has no rooms`;
    detail.textContent = "The model arrived; this level is empty. Pick another level above.";
  }
  el.replaceChildren(title, detail);
}

// Above this many rooms on a level, show a busy panel while the plan is built.
//
// A ROOM COUNT, not a duration, and that is forced rather than chosen. The
// build is synchronous — triangulating and uploading a level blocks the main
// thread — so the usual "show it only if the work takes longer than 150 ms"
// timer can never fire: nothing runs during the block, including timers. The
// decision has to be made BEFORE the work starts, and room count is the only
// thing known then that correlates with cost.
//
// 1,000 sits between the two regimes rather than in the middle of either.
// Measured: House A (12) and the showcase levels (~50) are imperceptible, the
// 299-room synthetic is still under ~100 ms, and `big-plate` at 5,046 takes
// ~1.3 s. Nothing real sits near the line, so a wrong call on either side of it
// costs a barely-visible flash or a barely-noticeable wait.
const BUSY_ROOM_THRESHOLD = 1000;

// Run a level build with a busy panel in front of it.
//
// The `requestAnimationFrame` is the load-bearing part: showing the panel only
// changes the DOM, and the browser will not PAINT that change until the current
// task yields. Calling the build straight afterwards would block through the
// whole thing and the panel would appear and vanish having never been seen. So
// the panel goes up, the frame is handed back, and the build runs on the next
// one.
//
// Below the threshold the build runs INLINE and synchronously — deliberately.
// Deferring every level by a frame would make the common case worse to save a
// flash nobody sees, and it would change the ordering that callers of
// `renderLevel` rely on.
function paintWithBusy(zone, roomCount, build) {
  if (roomCount < BUSY_ROOM_THRESHOLD) { build(); return; }
  const busy = zone.els.busy;
  if (!busy) { build(); return; }
  busy.classList.remove("hidden");
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      try { build(); } finally { busy.classList.add("hidden"); }
    });
  });
}

function renderLevel(zone, payload, levelId, { refit = true } = {}) {
  // Clearing the drawing and clearing the index behind it are ONE operation,
  // and the renderer now guarantees that rather than each caller remembering
  // it. Every early return below used to skip the reset — switching to a level
  // with no rooms (House A's LEVEL 02) left the previous level's 14 units live
  // against 0 drawn polygons, so a click could resolve to a room that was not
  // on screen and the cull spent its passes toggling `display` on nodes in no
  // document. `dispose()` here is that same reset, named for what it does.
  zone.renderer.dispose();
  const rooms = roomsOnLevel(payload, levelId);
  // Set from the one place that knows, and in BOTH directions — a level with
  // rooms must clear a message left by the last one.
  const levelName = (payload.levels || []).find(l => l.id === levelId)?.name || levelId;
  setZoneEmpty(zone, rooms.length === 0 ? "level" : null, levelName);

  if (rooms.length === 0) {
    if (refit) { zone.view = { ...zone.fitted }; setViewBox(zone); }
    return;
  }

  if (refit) {
    const fitted = fittedBounds(rooms);
    if (!fitted) return;
    zone.fitted = fitted;
    zone.view = { ...fitted };
    setViewBox(zone);
  }
  if (!zone.fitted) return; // no established frame yet (unbounded first render)

  // The colour plan resolves to a `colourFor` callback here, for the reason
  // given on the export's own adapter: the palette lives in common.js, which
  // the bundle cannot import, so the precedence rule is in the module and the
  // hex lookup stays with the palette.
  const plan = zone.activeColourPlan;                // presentation: per zone
  const colourCtx = plan ? buildColourContext(rooms, plan) : null;
  paintWithBusy(zone, rooms.length, () => {
    zone.renderer.paint(rooms, zone.fitted, {
      colourFor: plan ? (room) => colourForRoom(room, plan, colourCtx) : undefined,
      errorRoomIds,                        // data-quality state: global
      showErrors,                          // follows the QA block's expansion (global)
      matchRoomIds: searchMatchIds,        // one payload -> one match set
      searchActive,
      showLabels: showRoomLabels,
      doors: doorsOnLevel(levelId),
      showDoors,
      windows: windowsOnLevel(levelId),
      showWindows,
      ffe: ffeOnLevel(levelId),
      showFfe,
    });
    // Inside the deferred build, not after it: on a large level these run a
    // frame later than the surrounding code, and re-applying a selection to a
    // level that has not been painted yet marks nothing.
    applySelection(zone);
    if (zone.areasMode) renderAreasOverlay(zone);
  });
  // NOTE: `applySelection` and `renderAreasOverlay` are called INSIDE the build
  // above, not after it. renderLevel is the single choke point every re-render
  // (poll, colour, validation, level switch) passes through, so that one call
  // site keeps the footprints painted without each caller knowing about them —
  // but on a large level the build is deferred a frame, and running either of
  // them out here would apply them to a plan that has not been drawn yet.
}

// `addLabel` moved to src-js/renderer/svg/paint.ts (aliased above). The
// three-state `label` rule it encodes -- absent falls back to name/id,
// present-but-empty renders nothing -- is now typed (`Room.label`) and covered
// by tests, because the two empty-ish states looking identical on screen is a
// bug in whichever direction it happens.

// Populate this zone's level picker, highest elevation first.
function buildLevelControl(zone, payload, levels) {
  const sel = zone.els.levelSelect;
  sel.replaceChildren();
  const ordered = levels.slice().sort((a, b) => b.elevation - a.elevation);
  for (const lvl of ordered) {
    const count = roomsOnLevel(payload, lvl.id).length;
    const opt = document.createElement("option");
    opt.value = lvl.id;
    opt.textContent = `${lvl.name} (${count} rm)`;
    if (lvl.id === zone.activeLevelId) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.classList.toggle("hidden", levels.length <= 1);
}

function selectLevel(zone, levelId) {
  if (!currentPayload) return;
  zone.activeLevelId = levelId;
  renderLevel(zone, currentPayload, levelId, { refit: true });
  updateMeta(zone);
  // The overlay follows via renderLevel; the bottom band's figures span all
  // levels, so a level switch doesn't touch them.
}

function updateMeta(zone) {
  if (!currentPayload) return;
  const lvls = levelsForPayload(currentPayload);
  const active = lvls.find(l => l.id === zone.activeLevelId);
  const n = roomsOnLevel(currentPayload, zone.activeLevelId).length;
  const lvlName = active ? active.name : "—";
  // While a search is active, surface the match count (over the whole payload,
  // all levels — highlighting is visible only on this zone's shown level).
  const matches = searchActive && searchMatchIds
    ? ` · ${searchMatchIds.size} match${searchMatchIds.size === 1 ? "" : "es"}`
    : "";

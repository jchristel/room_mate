    gridRows.length === total ? `${total} rooms` : `${gridRows.length} of ${total} rooms`;
}

// Scroll: re-window only (columns and row set are unchanged), throttled to a
// frame, the way the old cull scheduler did.
let gridRaf = 0;
function onGridScroll() {
  gridScrollTop = document.getElementById("gridScroll").scrollTop;
  if (gridRaf) return;
  gridRaf = requestAnimationFrame(() => {
    gridRaf = 0;
    const cols = visibleGridColumns();
    if (cols.length) renderGridBody(cols);
  });
}

// Scroll the grid to a room and mark it — the jump target band 1 needs so a
// mismatch entry can point at its row instead of duplicating the detail.
function gridScrollToRoom(roomId) {
  const idx = gridRows.findIndex(r => r.id === roomId);
  if (idx < 0) return false;
  if (gridCollapsed) toggleGrid(); // unfold — a jump target is pointless hidden
  const scroll = document.getElementById("gridScroll");
  scroll.scrollTop = Math.max(0, idx * GRID_ROW_H - scroll.clientHeight / 2);
  onGridScroll();
  requestAnimationFrame(() => {
    const row = document.querySelector(`#gridTable tbody tr[data-room="${CSS.escape(roomId)}"]`);
    if (row) row.classList.add("target");
  });
  return true;
}

// CSV of what is on screen: the visible columns in order, every filtered row
// (not just the windowed slice), honouring the source toggle. Client-side,
// the same "a CSV is a presentation reshuffle of data the browser already
// has" line as the validation and areas exports.
function buildGridCsv() {
  const cols = visibleGridColumns();
  if (cols.length === 0) return "";
  const rows = [cols.map(c => (c.source === "model" ? c.label : `${c.source}.${c.label}`))];
  for (const room of gridRows) rows.push(cols.map(c => c.get(room)));
  return rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
}

function downloadGridCsv() {
  if (!gridRows.length) return;
  downloadCsv(`rooms-${projectId || "project"}.csv`, buildGridCsv());
}

// ============================ room search (global) ============================
//
// One search box + a field checklist, applied to EVERY zone. Matching is a local
// substring scan over rooms already in memory; highlighting toggles classes on
// the already-rendered nodes (the cull-unit room->nodes map) rather than
// rebuilding the SVG — so it stays smooth at thousands of rooms. See the plan /
// See STRATEGY-BROWSER.md for why this is frontend-only.

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// Intrinsic/aggregate field keys carry a friendly label; raw property keys show
// verbatim. `$<source>` pseudo-fields (one per discovered reference source)
// route through sourceDisplayName instead of a fixed table entry.
const SEARCH_FIELD_LABELS = { "$name": "Name", "$id": "Id", "$classification": "Classification" };
function searchFieldLabel(key) {
  if (key.startsWith("$") && knownReferenceSources.includes(key.slice(1))) return sourceDisplayName(key.slice(1));
  return SEARCH_FIELD_LABELS[key] || key;
}

// Every field the search can look at: the intrinsic/aggregate keys, one
// `$<source>` pseudo-field per discovered reference source, plus the union of
// raw property keys across the loaded payload (one payload for the page —
// every zone shows the same scope).
function availableSearchFields() {
  const props = new Set();
  for (const r of (currentPayload ? currentPayload.rooms : []))
    for (const k of Object.keys(r.properties || {})) props.add(k);
  return ["$name", "$id", "$classification", ...knownReferenceSources.map(n => `$${n}`), ...[...props].sort()];
}

// True when `q` (already lowercased) is a substring of any ENABLED field's value.
function roomMatches(room, q, fields) {
  const hit = (v) => v != null && String(v).toLowerCase().includes(q);
  if (fields.has("$name") && hit(room.name)) return true;
  if (fields.has("$id") && hit(room.id)) return true;
  if (fields.has("$classification") && room.classification &&
      room.classification.some(t => hit(t.name) || hit(t.code))) return true;
  for (const name of knownReferenceSources) {
    if (fields.has(`$${name}`) && room[name] && room[name].fields &&
        Object.values(room[name].fields).some(hit)) return true;
  }
  const props = room.properties || {};
  for (const k in props) if (fields.has(k) && hit(props[k].value)) return true;
  return false;
}

// Recompute the match set over the WHOLE payload (level-independent, so a
// level switch re-paints with the same set). One payload -> one match set,
// shared by every zone; each zone only differs in which level's matches are
// on screen.
function computeMatches() {
  const q = searchQuery.trim().toLowerCase();
  searchActive = q.length > 0;
  if (!q || !currentPayload) { searchMatchIds = null; return; }
  const ids = new Set();
  for (const r of currentPayload.rooms) if (roomMatches(r, q, searchFields)) ids.add(r.id);
  searchMatchIds = ids;
}

// Fast path, and the property that must survive the WebGL swap: search state is
// applied to what is ALREADY drawn, never by re-rendering. A search can match
// thousands of rooms and a keystroke must not re-upload a level -- under SVG
// that means toggling classes, under GL it means writing a vertex attribute,
// and the seam is what lets the caller stop caring which.
function applyHighlight(zone) {
  zone.renderer.applyHighlight({ searchActive, matchRoomIds: searchMatchIds });
}

// ============================ selection ============================
//
// The other consumer of the cull-unit room->nodes map, and deliberately built
// the same way as `applyHighlight` above: toggling a class on already-rendered
// nodes, never a re-render. Selecting must not disturb pan/zoom, must not
// re-paint 5,000 polygons, and must survive a level switch or a poll re-render
// (renderLevel re-applies it after painting).
//
// Built as its own step because two features need it: the adjacency graph
// (which centres on the selection) and the inspector
// (selection is page state). Neither owns it.

// Toggle `.selected` on whatever the selection names, in one zone. Rooms come
// from the cull units (nodes[0] is the outer polygon — holes and the label are
// excluded on purpose, since the outline is what carries the selection stroke);
// footprints come from the areas overlay, which stamps its own key.
//
// Both loops run every time rather than branching on kind: the class must come
// OFF the other kind's nodes when the selection moves between kinds, and a
// linear pass over a level's nodes is free at any rate a click can reach.
function applySelection(zone) {
  // Rooms are the renderer's: it holds the index and, once the plan is GL, will
  // draw the selected outline into a thin SVG overlay instead of toggling a
  // class. Footprints are NOT -- the areas overlay stays SVG and stays outside
  // the seam, so the page keeps that half itself.
  zone.renderer.setSelection(roomSelection() || null);
  zone.renderer.setDoorSelection(doorSelection() || null);
  zone.renderer.setWindowSelection(windowSelection() || null);
  zone.renderer.setItemSelection(itemSelection() || null);

  const areaId = selection && selection.kind === "area" ? selection.id : null;
  for (const p of zone.svg.querySelectorAll(".area-poly"))
    p.classList.toggle("selected", !!areaId && p.dataset.areaKey === areaId);
}

// Set (or clear, with null) the page selection and notify every listener.
// `zoneId` records which zone the click came from; it is null for a selection
// that did not originate on a plan (e.g. a graph node click), where "which zone"
// has no answer.
function select(next) {
  const same = next && selection
    ? next.kind === selection.kind && next.id === selection.id && next.zoneId === selection.zoneId
    : next === selection;
  if (same) return;
  selection = next || null;
  for (const z of zones) applySelection(z);
  for (const fn of selectionListeners) fn(selection);
}

// Kind-specific entry points. `selectRoom` keeps its signature because callers
// that can only ever mean a room (the graph's node click, the project-switch
// clear) should not have to spell the shape out.
function selectRoom(roomId, zoneId = null) {
  select(roomId ? { kind: "room", id: roomId, zoneId } : null);
}
function selectArea(areaId, zoneId = null) {
  select(areaId ? { kind: "area", id: areaId, zoneId } : null);
}
function selectDoor(doorId, zoneId = null) {
  select(doorId ? { kind: "door", id: doorId, zoneId } : null);
}
function selectWindow(windowId, zoneId = null) {
  select(windowId ? { kind: "window", id: windowId, zoneId } : null);
}
function selectItem(itemId, zoneId = null) {
  select(itemId ? { kind: "item", id: itemId, zoneId } : null);
}

// The room a plan click landed on, or null for empty space / the grid. Resolved
// by scanning the zone's cull units rather than stamping an id attribute onto
// every polygon: `paintLevel` is shared verbatim with the SVG export, and an
// export has no business carrying selection plumbing. One linear scan per click
// is free at any room count a click rate can reach.
function roomAtPoint(zone, clientX, clientY) {
  return zone.renderer.roomAt(clientX, clientY);
}

// The footprint a plan click landed on, or null. Unlike rooms this DOES read an
// attribute off the node, and can: the overlay is built by `renderAreasOverlay`
// alone and the SVG export never goes through it (the export paints its own
// document with `paintLevel`), so the stamp cannot leak into an exported file.
// That is exactly the risk `roomAtNode` scans to avoid — `paintLevel` IS shared
// with the export.
function areaAtNode(zone, node) {
  if (!node || !node.classList || !node.classList.contains("area-poly")) return null;
  const key = node.dataset.areaKey;
  return (areasData ? areasData.groups : []).find(g => areaKey(g) === key) || null;
}

// ========================= inspector (right column) =========================
//
// selection is page state, and this is the third consumer of that layer
// after the graph and the plan highlight. Deliberately a *listener plus a
// renderer*: it never calls into `select`, never introduces an `activeZoneId`,
// and never re-renders a zone — a selection change stays a class toggle.
// Read-only, same stance as the band-2 grid.
//
// It renders whatever KIND is selected rather than assuming a room: one
// dispatcher (`INSPECTORS`) over one shared header, with a renderer per kind.
// The plan already draws two selectable things and the pipeline anticipates a
// third, so "show the properties of the selected thing" is the panel's job —
// "show the properties of the selected room" was the narrower special case.
//
// See STRATEGY-BROWSER.md, "UI growth" for the measurements behind the filtering.

// A room's 45 properties (House A) are not 45 useful ones: 19 of them hold no
// real value on ANY room. Revit emits the literal string "None" for an unset
// parameter, so an emptiness test that only checks for "" hides nothing at all —
// that single detail is what makes the hide-empty default worth having.
function isEmptyPropValue(v) {
  const s = (v ?? "").trim();
  return s === "" || s.toLowerCase() === "none";
}

let inspHideEmpty = true;   // default ON: 45 -> 26 on House A, no config needed
let inspFilter = "";        // substring match on property NAME

// Deliberately not persisted — `linkViews`, the labels toggle and the search
// field picker are all unpersisted too, and the persistence decision made
// "persist every view pref or none" a standing decision. The durable version of
// "which properties matter" is `room_label` in project settings, server-side.

function inspRow(parent, key, rawValue) {
  const empty = isEmptyPropValue(rawValue);
  const row = document.createElement("div");
  row.className = "insp-row";
  const k = document.createElement("div");
  k.className = "insp-k";
  k.textContent = key;
  const v = document.createElement("div");
  v.className = "insp-v" + (empty ? " insp-empty" : "");
  v.textContent = empty ? "—" : rawValue;
  row.append(k, v);
  parent.appendChild(row);
}

function inspSection(host, title, entries, { source = null } = {}) {
  if (!entries.length) return 0;
  const h = document.createElement("h4");
  h.textContent = title;
  host.appendChild(h);
  const rows = document.createElement("div");
  rows.className = "insp-rows" + (source ? ` src-${cssIdent(source)}${source !== "model" ? " src-reference" : ""}` : "");
  for (const [k, v] of entries) inspRow(rows, k, v);
  host.appendChild(rows);
  return entries.length;
}

// Apply the filters to a [key, value] list. Name filter first (it is what the
// user typed), then hide-empty.
//
// `hideEmpty: false` exempts a section from the emptiness filter. Classification
// uses it: hide-empty exists for the 45 model properties, and applying it to a
// two-row tier path deleted the whole section for every `sample-project` room —
// whose tiers are all resolved-but-`undefined`. "This room is unclassified" is a
// fact worth showing (the areas service treats the undefined bucket as a real
// group), not an empty value to suppress.
function inspApplyFilters(entries, { hideEmpty = true } = {}) {
  const q = inspFilter.trim().toLowerCase();
  return entries.filter(([k, v]) =>
    (!q || k.toLowerCase().includes(q)) && (!(hideEmpty && inspHideEmpty) || !isEmptyPropValue(v)));
}

// One renderer per selectable kind. Adding a kind (FFE is the one the pipeline
// already anticipates) is a line here plus a hit test in the pointerup handler —
// not another branch inside a room-shaped function. An unknown kind is NAMED in
// the panel rather than silently rendering nothing: a blank panel reads as a bug
// in the selection, which is exactly what it would be hiding.
const INSPECTORS = {
  room: renderRoomInspector,
  area: renderAreaInspector,
  door: renderDoorInspector,
  window: renderWindowInspector,
  item: renderItemInspector,
};

// The header every kind shares: a title, a sub-line, and the zone the click came
// from. `kind` is spelled out for anything that is not a room, because "which of
// the two things under the pointer did I just select" is the question the panel
// has to answer first once the plan draws both.
function inspHead(host, { kind, title, sub }) {
  const head = document.createElement("div");
  head.className = "insp-head";
  const t = document.createElement("div");
  t.className = "insp-title";
  t.textContent = title;
  const s = document.createElement("div");
  s.className = "insp-sub";
  // `selection.zoneId` is a LABEL, not focus state: the same room can appear in
  // two zones on the same level, so naming where the click came from is the
  // whole reason that id exists.
  const from = selection && selection.zoneId ? ` · from ${selection.zoneId}` : "";
  s.textContent = (kind === "room" ? "" : `${kind.toUpperCase()} · `) + sub + from;
  head.append(t, s);
  host.appendChild(head);
  return head;
}

function renderInspector() {
  const host = document.getElementById("inspector");
  if (!host) return;

  if (!selection) {                // no selection -> the column costs no width
    host.classList.add("hidden");
    host.replaceChildren();
    return;
  }

  host.classList.remove("hidden");
  host.replaceChildren();

  const render = INSPECTORS[selection.kind];
  if (!render) {
    const note = document.createElement("div");
    note.className = "insp-note";
    note.textContent = `No inspector for a "${selection.kind}" selection.`;
    host.appendChild(note);
    return;
  }
  render(host);
}

// ---- the door inspector -----------------------------------------------------
//
// A door's own panel rather than a redirect to the room that owns it, because
// the two answer different questions and the door's is the one nothing else on
// the page can answer: which rooms it joins, which room it is ATTRIBUTED to
// under the project's policy, and its two property tiers.
//
// The tiers stay SPLIT, and that is the point of the section titles. "This leaf
// is 820 wide" and "every door of this type is 820 wide" are different claims,
// and a hardware schedule joins against the second — flattening them here would
// throw away the distinction the contract went out of its way to keep.
function renderDoorInspector(host) {
  const door = (doorsPayload?.doors || []).find(d => d.id === selection.id);
  if (!door) {
    const note = document.createElement("div");
    note.className = "insp-note";
    note.textContent = `Door ${selection.id} is not in the current scope.`;
    host.appendChild(note);
    return;
  }

  const levelName = (currentPayload?.levels || []).find(l => l.id === door.level_id)?.name || door.level_id;
  inspHead(host, {
    kind: "door",
    title: door.type_name || door.id,
    sub: `${door.id} · ${levelName}`,
  });

  const roomName = (id) => {
    if (!id) return "";
    const r = (currentPayload?.rooms || []).find(x => x.id === id);
    return r ? (r.name || r.id) : `${id} (not in scope)`;
  };

  // ---- references and attribution -------------------------------------------
  // Every one of these has a meaningful EMPTY state, so they are spelled out
  // rather than dropped by the hide-empty filter. "(none)" against `from` means
  // an external door, which is ordinary; an empty owner means homeless, which is
  // a reported state the server distinguishes from "no reference at all".
  const refs = [
    ["Opens from", door.from_room ? roomName(door.from_room) : "(none — external)"],
    ["Opens into", door.to_room ? roomName(door.to_room) : "(none — external)"],
    ["Attributed to", (door.owner_rooms || []).length
      ? door.owner_rooms.map(roomName).join(", ")
      : "(homeless — no room attributed)"],
  ];
  inspSection(host, "Rooms", refs);

  // ---- what the plan is drawing ---------------------------------------------
  // Named explicitly because a door drawn as a bare arrow, or missing entirely,
  // otherwise looks like a rendering fault. It is the honest report of what the
  // model carried.
  const hasBox = !!(door.loops && door.loops.length && door.loops[0]?.points?.length);
  const geom = [
    ["Footprint", hasBox ? "yes" : "none — drawn from its insertion point"],
    ["Direction", door.through_wall_normal ? "yes" : "unknown — no arrow drawn"],
  ];
  inspSection(host, "Geometry", geom);

  const inst = Object.entries(door.properties || {}).map(([k, v]) => [k, v?.value ?? ""]);
  inst.sort((a, b) => a[0].localeCompare(b[0]));
  inspSection(host, "Instance properties", inspApplyFilters(inst));

  const type = Object.entries(door.type_properties || {}).map(([k, v]) => [k, v?.value ?? ""]);
  type.sort((a, b) => a[0].localeCompare(b[0]));
  inspSection(host, "Type properties", inspApplyFilters(type));
}

// ---- the window inspector ---------------------------------------------------
//
// Its own panel rather than the door one under another name, even though the
// RECORD is identical -- measured, on two documents. What differs is what the
// values mean, and the panel exists to say so.
//
// "Opens from / into" reads oddly for glazing, so the labels name the sides
// rather than the act. And an absent room is not the same story it is for a
// door: for a door, one side absent means external and both absent is a
// finding; for a window in a facade model both absent is the NORMAL state,
// because Revit cannot resolve a room across a link. Telling a reader that a
// correct model is broken is the failure this wording avoids.
function renderWindowInspector(host) {
  const win = (windowsPayload?.windows || []).find(w => w.id === selection.id);
  if (!win) {
    const note = document.createElement("div");
    note.className = "insp-note";
    note.textContent = `Window ${selection.id} is not in the current scope.`;
    host.appendChild(note);
    return;
  }

  const levelName = (currentPayload?.levels || []).find(l => l.id === win.level_id)?.name || win.level_id;
  inspHead(host, {
    kind: "window",
    title: win.type_name || win.id,
    sub: `${win.id} · ${levelName}`,
  });

  const roomName = (id) => {
    if (!id) return "";
    const r = (currentPayload?.rooms || []).find(x => x.id === id);
    return r ? (r.name || r.id) : `${id} (not in scope)`;
  };

  const sided = win.from_room || win.to_room;
  const refs = [
    ["Faces from", win.from_room ? roomName(win.from_room) : "(none)"],
    ["Faces into", win.to_room ? roomName(win.to_room) : "(none)"],
    ["Attributed to", (win.owner_rooms || []).length
      ? win.owner_rooms.map(roomName).join(", ")
      : sided
        ? "(homeless — no room attributed)"
        : "(no room reference — normal in a facade model)"],
  ];
  inspSection(host, "Rooms", refs);

  // What the plan is drawing, named so a window shown as a bare symbol -- or as
  // a footprint with no symbol -- does not look like a rendering fault.
  const hasBox = !!(win.loops && win.loops.length && win.loops[0]?.points?.length);
  const geom = [
    ["Footprint", hasBox ? "yes" : "none — drawn from its insertion point"],
    ["Direction", win.through_wall_normal ? "yes" : "unknown — no symbol drawn"],
  ];
  inspSection(host, "Geometry", geom);

  const inst = Object.entries(win.properties || {}).map(([k, v]) => [k, v?.value ?? ""]);
  inst.sort((a, b) => a[0].localeCompare(b[0]));
  inspSection(host, "Instance properties", inspApplyFilters(inst));

  const type = Object.entries(win.type_properties || {}).map(([k, v]) => [k, v?.value ?? ""]);
  type.sort((a, b) => a[0].localeCompare(b[0]));
  inspSection(host, "Type properties", inspApplyFilters(type));
}

// ---- the FF&E inspector -----------------------------------------------------
//
// Its own panel, and unlike the window one that is not a fine distinction: an
// item is a different RECORD, so most of what the opening panels show does not
// exist here. There is one room rather than two sides, no swing and no facing
// direction through a wall, a Revit category no opening carries, and -- for now
// -- no footprint at all.
//
// The three things this panel exists to say, none of which the reader can get
// from the plan:
//
//  * WHICH KIND. Category is the first question anyone asks of FF&E, and the
//    marker on the plan deliberately does not answer it -- nine categories
//    would need nine drawing conventions invented here.
//  * WHY THERE IS NO OUTLINE. Every item today is drawn as a marker because the
//    exporter carries no footprint yet. Unstated, that reads as a rendering
//    fault rather than as the data.
//  * WHETHER IT IS A COMPONENT. A joinery handle inside a casework run is a
//    real instance the project chose to show; without saying so, an inspector
//    full of hardware looks like a modelling mess rather than a policy.
function renderItemInspector(host) {
  const it = (ffePayload?.ffe || []).find(x => x.id === selection.id);
  if (!it) {
    const note = document.createElement("div");
    note.className = "insp-note";
    note.textContent = `Item ${selection.id} is not in the current scope.`;
    host.appendChild(note);
    return;
  }

  // `-1` is Revit's "no element" id, which an unhosted item legitimately
  // carries -- 71 of 644 when measured. Named rather than shown raw, because
  // "-1" reads as a bug and "unhosted" reads as the fact it is.
  const levelName = it.level_id === "-1"
    ? "unhosted (no level)"
    : (currentPayload?.levels || []).find(l => l.id === it.level_id)?.name || it.level_id;
  inspHead(host, {
    kind: "item",
    title: it.type_name || it.id,
    sub: `${it.id} · ${levelName}`,
  });

  const roomName = (id) => {
    if (!id) return "";
    const r = (currentPayload?.rooms || []).find(x => x.id === id);
    return r ? (r.name || r.id) : `${id} (not in scope)`;
  };

  inspSection(host, "Placement", [
    ["Category", it.category || "(unknown)"],
    // One room, so one line. An opening's panel has two and has to explain
    // which is which; there is nothing here to disambiguate.
    ["In room", it.room ? roomName(it.room) : "(none)"],
    ["Attributed to", (it.owner_rooms || []).length
      ? it.owner_rooms.map(roomName).join(", ")
      : "(homeless — outside every room, which is often correct)"],
  ]);

  // What the plan is drawing, named so a marker does not look like a fault.
  const hasBox = !!(it.loops && it.loops.length && it.loops[0]?.points?.length);
  inspSection(host, "Geometry", [
    ["Footprint", hasBox
      ? "yes"
      : "none — drawn as a marker at its insertion point"],
    ["Facing", it.facing ? "yes" : "unknown — no orientation drawn"],
  ]);

  if (it.is_component || it.super_component_id) {
    inspSection(host, "Nesting", [
      ["Component of", it.super_component_id || "(another instance)"],
      ["Shown because", "this project sets [ffe] nested_components = include"],
    ]);
  }

  const inst = Object.entries(it.properties || {}).map(([k, v]) => [k, v?.value ?? ""]);
  inst.sort((a, b) => a[0].localeCompare(b[0]));
  inspSection(host, "Instance properties", inspApplyFilters(inst));

  const type = Object.entries(it.type_properties || {}).map(([k, v]) => [k, v?.value ?? ""]);
  type.sort((a, b) => a[0].localeCompare(b[0]));
  inspSection(host, "Type properties", inspApplyFilters(type));
}

// ---- the area (hierarchy footprint) inspector -------------------------------
//
// Answers "what is this one footprint", the same question the room renderer
// answers for a room. Every figure is already client-side — the group from
// `/areas`, the net room area summed with the SAME roomNetArea + pathKey
// identity the band and the CSV use, so the three can never disagree. No server
// work, and deliberately no duplication of the band: the band compares groups,
// this describes one.
function renderAreaInspector(host) {
  const grp = (areasData ? areasData.groups : []).find(g => areaKey(g) === selection.id);
  if (!grp) {
    // Real and reachable: the tier picker moved, the level changed, or the scope
    // was re-fetched without this group. Named, never a blank panel.
    inspHead(host, { kind: "area", title: "Footprint", sub: "no longer in scope" });
    const note = document.createElement("div");
    note.className = "insp-note";
    note.textContent = "This footprint is not in the current areas data — the tier or scope changed.";
    host.appendChild(note);
    return;
  }

  const depth = grp.path.length - 1;
  const levelName = (areasData.levels || []).find(l => l.id === grp.level_id)?.name || grp.level_id;
  inspHead(host, { kind: "area", title: tierLabel(grp.path[depth]), sub: `${grp.path[depth].tier} · ${levelName}` });

  // Member rooms by the same (level, path-prefix) identity the band groups on.
  const members = (currentPayload ? currentPayload.rooms : []).filter(r =>
    r.level_id === grp.level_id &&
    r.classification && r.classification.length >= depth + 1 &&
    pathKey(r.classification, depth) === pathKey(grp.path, depth));
  const net = members.reduce((a, r) => a + roomNetArea(r), 0);
  const fmt = (n) => n.toLocaleString(undefined, { maximumFractionDigits: 1 });

  inspSection(host, "Hierarchy", grp.path.map(t => [t.tier, t.undefined ? "(undefined)" : (t.name || t.code || "")]));

  // Δ is the point of showing both: it is the enclosed wall bands and filled
  // room voids, i.e. what a dissolved footprint counts that summed rooms do not.
  inspSection(host, "Areas", [
    ["Footprint (gross)", fmt(grp.area)],
    ["Net room area", fmt(net)],
    ["Δ (walls + voids)", fmt(grp.area - net)],
    ["Counts upward", grp.counted_upward ? "yes" : "no — withheld from tiers above"],
    ["Islands", String(grp.polygons.length)],
    ["Rooms", String(members.length)],
  ]);

  const note = document.createElement("div");
  note.className = "insp-note";
  note.textContent = "Model units². Footprint from the server's dissolve; net summed client-side from room loops.";
  host.appendChild(note);
}

// ---- the room inspector -----------------------------------------------------
function renderRoomInspector(host) {
  const room = currentPayload?.rooms.find(r => r.id === selection.id);
  if (!room) {                     // selected room not in the current scope
    const note = document.createElement("div");
    note.className = "insp-note";
    note.textContent = `Room ${selection.id} is not in the current scope.`;
    host.appendChild(note);
    return;
  }

  // ---- header: identity + the controls -------------------------------------
  const levelName = (currentPayload.levels || []).find(l => l.id === room.level_id)?.name || room.level_id;
  const head = inspHead(host, { kind: "room", title: room.name || room.id, sub: `${room.id} · ${levelName}` });

  const controls = document.createElement("div");
  controls.className = "insp-controls";
  const search = document.createElement("input");
  search.type = "search";
  search.placeholder = "Filter properties…";
  search.value = inspFilter;
  // Kept across selection changes on purpose: the common use is comparing one
  // field across rooms by clicking each in turn.
  search.addEventListener("input", (e) => { inspFilter = e.target.value; renderInspector(); });
  const hideLabel = document.createElement("label");
  const hideCb = document.createElement("input");
  hideCb.type = "checkbox";
  hideCb.checked = inspHideEmpty;
  hideCb.addEventListener("change", (e) => { inspHideEmpty = e.target.checked; renderInspector(); });
  hideLabel.append(hideCb, document.createTextNode("Hide empty"));
  controls.append(search, hideLabel);
  // Into the shared header, which `inspHead` already put on the page. The filter
  // and hide-empty controls stay ROOM-ONLY: they exist for the 45 model
  // properties, and an area's dozen derived figures have nothing to filter.
  head.appendChild(controls);

  // ---- classification ------------------------------------------------------
  // An `undefined` tier is named explicitly rather than shown as an empty value:
  // it means "the classifier ran and this room fell in the undefined bucket",
  // which is a different statement from "no data".
  const cls = (room.classification || []).map(t => [t.tier, t.undefined ? "(undefined)" : (t.name || t.code || "")]);
  inspSection(host, "Classification", inspApplyFilters(cls, { hideEmpty: false }));

  // ---- model properties ----------------------------------------------------
  const all = Object.entries(room.properties || {}).map(([k, v]) => [k, v?.value ?? ""]);
  all.sort((a, b) => a[0].localeCompare(b[0]));
  const shown = inspApplyFilters(all);
  inspSection(host, "Model", shown, { source: "model" });

  // ---- reference sources ----------------------------------------------------
  // Absent is a real, common state (an unmatched room, or a source with no
  // join for this project) and says something different from "matched but
  // blank" — so it is named, never rendered as an empty section. Loops every
  // discovered source (see detectReferenceSources) rather than a single
  // hardcoded "dRofus" block.
  for (const name of knownReferenceSources) {
    const display = sourceDisplayName(name);
    if (room[name]) {
      const dr = Object.entries(room[name].fields || {});
      dr.sort((a, b) => a[0].localeCompare(b[0]));
      inspSection(host, display, inspApplyFilters(dr), { source: name });
    } else {
      const h = document.createElement("h4");
      h.textContent = display;
      const note = document.createElement("div");
      note.className = "insp-note";
      note.textContent = `Not joined — this room matched no ${display} record.`;
      host.append(h, note);
    }
  }

  // ---- what the filters removed, never silently ----------------------------
  const count = document.createElement("div");
  count.className = "insp-note insp-count";
  count.textContent = `${shown.length} of ${all.length} model properties shown`;
  host.appendChild(count);
}

// Recompute once, then re-highlight every zone and refresh its match count.
function applySearch() {
  computeMatches();
  for (const z of zones) {
    applyHighlight(z);
    updateMeta(z);
  }
}
const debouncedApplySearch = debounce(applySearch, 200);

// Build/refresh the field checklist. Preserves existing ticks; a genuinely new
// field (from a newly loaded project) defaults on. First build ticks everything
// — the "all fields" default.
function refreshFieldsPanel() {
  const panel = document.getElementById("fieldsPanel");
  if (!panel) return;
  const fields = availableSearchFields();
  const known = new Set([...panel.querySelectorAll("input")].map(i => i.value));
  if (!searchFieldsInitialised) {
    fields.forEach(f => searchFields.add(f));
    searchFieldsInitialised = true;
  } else {
    fields.forEach(f => { if (!known.has(f)) searchFields.add(f); }); // new field -> on
  }

  panel.replaceChildren();
  const actions = document.createElement("div");
  actions.className = "fields-actions";
  const mkAction = (text, fn) => {
    const a = document.createElement("a");
    a.textContent = text;
    a.addEventListener("click", fn);
    return a;
  };
  actions.appendChild(mkAction("All", () => { fields.forEach(f => searchFields.add(f)); refreshFieldsPanel(); applySearch(); }));
  actions.appendChild(mkAction("None", () => { searchFields.clear(); refreshFieldsPanel(); applySearch(); }));
  panel.appendChild(actions);

  for (const f of fields) {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = f;
    cb.checked = searchFields.has(f);
    cb.addEventListener("change", () => {
      if (cb.checked) searchFields.add(f); else searchFields.delete(f);
      applySearch();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(" " + searchFieldLabel(f)));
    panel.appendChild(label);
  }
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  debouncedApplySearch();
});
document.getElementById("fieldsToggle").addEventListener("click", (e) => {
  e.stopPropagation();
  document.getElementById("fieldsPanel").classList.toggle("hidden");
});
// Click outside the search cluster closes the field panel.
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search")) document.getElementById("fieldsPanel").classList.add("hidden");
});

// ============================ polling (global) ============================
//
// One scope -> ONE fetch and ONE poll cursor per tick, fanned out to every
// zone. This deletes the bug class where two zones on the same project could
// drift a tick apart (each used to carry its own cursor and fetch).

// Build the /rooms URL from the global project/building/milestone selection.
function roomsUrl() {
  const params = new URLSearchParams();
  if (projectId) params.set("project", projectId);
  if (buildingKey) params.set("building", buildingKey);
  if (projectId && milestone) params.set("milestone", milestone);
  const qs = params.toString();
  return qs ? `/rooms?${qs}` : "/rooms";
}

// The /doors URL, from the same global scope as roomsUrl.
//
// ONE CAVEAT WORTH KNOWING: `building` scopes a door through the room it is
// attributed to, so a HOMELESS door — one whose owner_rooms is empty, a
// reported state rather than an error — matches no `?building=` filter and
// vanishes from the plan while a building is selected. That is the server's
// documented behaviour, not something to paper over here.
function doorsUrl() {
  const params = new URLSearchParams();
  if (projectId) params.set("project", projectId);
  if (buildingKey) params.set("building", buildingKey);
  if (projectId && milestone) params.set("milestone", milestone);
  const qs = params.toString();
  return qs ? `/doors?${qs}` : "/doors";
}

// The doors on one level. Keyed the same way rooms are, and carrying the same
// caveat: a level id is unique only WITHIN a model, so this is correct exactly
// as far as the scope above narrowed the models — which is the same trade
// roomsOnLevel already makes.
function doorsOnLevel(levelId) {
  if (!doorsPayload) return [];
  return (doorsPayload.doors || []).filter(d => (d.level_id || "unknown") === levelId);
}

// The /windows URL. Same caveat as doorsUrl, and it bites harder here: a
// window's building comes through the room it is attributed to, and in a facade
// model NO window is attributed to anything -- 0 of 158 carried a room
// reference when it was measured -- so selecting a building hides every window
// in such a project. That is the server's documented behaviour and the reason
// [windows] room_resolution exists, not something to paper over here.
function windowsUrl() {
  const params = new URLSearchParams();
  if (projectId) params.set("project", projectId);
  if (buildingKey) params.set("building", buildingKey);
  if (projectId && milestone) params.set("milestone", milestone);
  const qs = params.toString();
  return qs ? `/windows?${qs}` : "/windows";
}

// The windows on one level, keyed exactly as doors are and carrying the same
// within-one-model caveat.
function windowsOnLevel(levelId) {
  if (!windowsPayload) return [];
  return (windowsPayload.windows || []).filter(w => (w.level_id || "unknown") === levelId);
}

// The /ffe URL. Same caveat as doorsUrl and windowsUrl, and the middle ground
// between them: an item's building comes through the room it is IN, and unlike a
// facade model's windows most items do name one -- 572 of 647 when measured. So
// a building filter hides the homeless remainder rather than everything, which
// is the server's documented behaviour and not something to paper over here.
function ffeUrl() {
  const params = new URLSearchParams();
  if (projectId) params.set("project", projectId);
  if (buildingKey) params.set("building", buildingKey);
  if (projectId && milestone) params.set("milestone", milestone);
  const qs = params.toString();
  return qs ? `/ffe?${qs}` : "/ffe";
}

// The FF&E on one level, keyed exactly as doors and windows are.
//
// An item whose level is `-1` -- unhosted, 71 of 644 when measured -- lands
// under "unknown" like any other unmatched level rather than being dropped. It
// is a real item with a real position, and hiding it would make a plan quietly
// incomplete.
function ffeOnLevel(levelId) {
  if (!ffePayload) return [];
  return (ffePayload.ffe || []).filter(i => (i.level_id || "unknown") === levelId);
}

// FF&E polls on its own revision, in its own try -- an FF&E read that fails or
// 204s must not take rooms, doors or windows down with it. A model with rooms
// and no furniture is legitimate (a shell, a base-build package, a plantroom
// level), and the plan is still worth drawing without it.
async function pollFfe() {
  try {
    const res = await fetch(ffeUrl(), { cache: "no-store", headers: condHeaders(lastFfeEtag) });
    if (res.status === 304) return false;
    if (res.status === 204) {
      lastFfeEtag = null;
      if (ffePayload !== null) { ffePayload = null; lastFfeRevision = null; return true; }
      return false;
    }
    if (!res.ok) return false;
    lastFfeEtag = res.headers.get("ETag");
    const payload = await res.json();
    const incoming = payload.revision ?? JSON.stringify(payload);
    if (incoming === lastFfeRevision) return false;
    lastFfeRevision = incoming;
    ffePayload = payload;
    return true;
  } catch (err) {
    return false;   // rooms already report connection loss; one message is enough
  }
}

// Windows poll on their own revision, in their own try -- a windows read that
// fails or 204s must not take rooms or doors down with it. A model with rooms
// and no windows is legitimate (a service core, an internal floor), and the
// plan is still worth drawing without them.
async function pollWindows() {
  try {
    const res = await fetch(windowsUrl(), { cache: "no-store", headers: condHeaders(lastWindowsEtag) });
    if (res.status === 304) return false;
    if (res.status === 204) {
      // Drop the tag with the payload: 204 carries none, so holding the old one
      // would send `If-None-Match` for an entity we no longer have.
      lastWindowsEtag = null;
      if (windowsPayload !== null) { windowsPayload = null; lastWindowsRevision = null; return true; }
      return false;
    }
    if (!res.ok) return false;
    lastWindowsEtag = res.headers.get("ETag");
    const payload = await res.json();
    const incoming = payload.revision ?? JSON.stringify(payload);
    if (incoming === lastWindowsRevision) return false;
    lastWindowsRevision = incoming;
    windowsPayload = payload;
    return true;
  } catch (err) {
    return false;   // rooms already report connection loss; one message is enough
  }
}

// Doors poll on their own revision, in their own try. A doors read that fails
// or 204s must not take the rooms down with it: a model with rooms and no doors
// is legitimate (the server says so explicitly), and the plan is still worth
// drawing without them.
async function pollDoors() {
  try {
    const res = await fetch(doorsUrl(), { cache: "no-store", headers: condHeaders(lastDoorsEtag) });
    // Nothing changed, and the server spent nothing establishing that. No body
    // arrives, so there is nothing to compare or repaint.
    if (res.status === 304) return false;
    if (res.status === 204) {
      // No doors in scope. Clear rather than keep the last set — stale doors
      // over a new project's plan is worse than none.
      // Drop the tag with the payload: 204 carries none, so holding the old
      // one would send `If-None-Match` for an entity we no longer have.
      lastDoorsEtag = null;
      if (doorsPayload !== null) { doorsPayload = null; lastDoorsRevision = null; return true; }
      return false;
    }
    if (!res.ok) return false;
    lastDoorsEtag = res.headers.get("ETag");
    const payload = await res.json();
    const incoming = payload.revision ?? JSON.stringify(payload);
    if (incoming === lastDoorsRevision) return false;
    lastDoorsRevision = incoming;
    doorsPayload = payload;
    return true;
  } catch (err) {
    return false;   // rooms already report connection loss; one message is enough
  }
}

// `If-None-Match` for a poll, or no header at all on the first pass.
//
// Sent explicitly rather than relying on `cache: "no-cache"` to revalidate for
// us, and the difference matters: the browser cache would hand back its stored
// 200 on a 304, so the page would re-parse 73 MB of doors JSON to discover
// nothing had changed. Setting the header by hand with `cache: "no-store"` lets
// the 304 reach this code as a 304, with no body and no parse.
function condHeaders(etag) {
  return etag ? { "If-None-Match": etag } : {};
}

// Every zone's meta line reports poll-level states (waiting / connection lost)
// identically — they share the one fetch.
function metaAll(text) {
  for (const zone of zones) {
    zone.els.meta.textContent = text;
    zone.els.meta.classList.add("stale");
  }
}

async function poll() {
  try {
    const res = await fetch(roomsUrl(), { cache: "no-store", headers: condHeaders(lastRoomsEtag) });
    // A 304 settles the whole tick: rooms are unchanged, and `pollDoors` has
    // its own tag, so there is nothing to re-render on either side. Returning
    // here (rather than falling through to the revision compare) is what turns
    // an idle poll into two header exchanges.
    if (res.status === 304) { await pollDoors(); return; }
    if (res.status === 204) { lastRoomsEtag = null; metaAll("waiting for data"); return; }
    if (!res.ok) throw new Error(res.status);
    lastRoomsEtag = res.headers.get("ETag");
    const payload = await res.json();
    // Change-detection compares the server's one-value content revision instead
    // of re-stringifying the whole payload every poll (see the `revision` field
    // in rooms.rs / STRATEGY-BROWSER.md). A quiet system returns the
    // same revision every tick, so `ingestAll` (full teardown + rebuild) never
    // fires between real pushes. Fall back to a stringify only if an older
    // server omits the field, so the viewer still updates against one.
    const incoming = payload.revision ?? JSON.stringify(payload);
    // Doors are fetched on every tick but only re-render when THEY changed.
    // Awaited before the rooms branch so a tick that changed both paints once
    // with both, rather than painting rooms and then immediately repainting to
    // add the doors.
    const doorsChanged = await pollDoors();
    const windowsChanged = await pollWindows();
    const ffeChanged = await pollFfe();
    if (incoming !== lastRevision) {
      lastRevision = incoming;
      ingestAll(payload); // re-fits + rebuilds level controls only on real change
    } else if (doorsChanged || windowsChanged || ffeChanged) {
      // An element entity moved and rooms did not. Repaint in place: no refit,
      // because such a push must not throw away the user's pan and zoom.
      redrawAllZones();
    }
  } catch (err) {
    metaAll("connection lost");
  }
}

// Repaint every zone at its current level and view. The shared tail of every
// display-only change — a doors push, a doors toggle — none of which may refit.
function redrawAllZones() {
  for (const zone of zones)
    if (currentPayload && zone.activeLevelId)
      renderLevel(zone, currentPayload, zone.activeLevelId, { refit: false });
}

// ============================ view linking ============================

// Apply a view to a zone and repaint its viewBox.
function applyView(zone, v) {
  zone.view = { ...v };
  setViewBox(zone);
}

// Route a gesture's resulting view: linked -> every zone gets the SAME view;
// unlinked -> just the origin zone. When linked, each zone zooms around the
// origin zone's cursor point (all zones receive one `v`) — the correct,
// locked-together behaviour; the anchor is not recomputed per zone.
function commitView(originZone, v) {
  if (linkViews) {
    for (const z of zones) applyView(z, v);
  } else {
    applyView(originZone, v);
  }
}

// Attach pan/zoom to one zone's SVG. Each handler computes the new transform
// against THAT zone's view, then routes it through commitView.
// Pointer travel (CSS px) below which a press-release counts as a click rather
// than a pan. A real pan moves far more; a click on a trackpad or a shaky mouse
// still drifts a pixel or two, so zero would make selection feel broken.
const CLICK_SLOP_PX = 4;

// Hover, and the per-room tooltip that used to be an SVG `<title>`.
//
// Under SVG both were free: the browser handled `:hover` and drew the native
// tooltip from `<title>`. WebGL has no elements, so both become explicit — the
// pick answers "which room", the renderer draws the mark into the overlay, and
// the tooltip is a DOM node this function positions.
//
// Throttled to an animation frame. A pointermove fires far more often than the
// screen updates, and an unthrottled pick plus DOM write per event is real work
// for a result nobody sees.
function updateHover(zone, e) {
  if (zone._hoverRaf) return;
  zone._hoverPoint = { x: e.clientX, y: e.clientY };
  zone._hoverRaf = requestAnimationFrame(() => {
    zone._hoverRaf = 0;
    const p = zone._hoverPoint;
    if (!p) return;
    const room = zone.renderer.roomAt(p.x, p.y);
    zone.renderer.setHover(room ? room.id : null);
    showTip(zone, room, p);
  });
}

function clearHover(zone) {
  if (zone._hoverRaf) { cancelAnimationFrame(zone._hoverRaf); zone._hoverRaf = 0; }
  zone._hoverPoint = null;
  zone.renderer.setHover(null);
  showTip(zone, null, null);
}

// Same text the `<title>` carried — name, else id — so nothing about what the
// tooltip SAYS changes with the renderer.
function showTip(zone, room, point) {
  const tip = zone.els.tip;
  if (!tip) return;
  if (!room || !point) { tip.classList.add("hidden"); return; }
  tip.textContent = room.name || room.id;
  const host = tip.offsetParent ? tip.offsetParent.getBoundingClientRect() : { left: 0, top: 0 };
  tip.style.left = `${point.x - host.left}px`;
  tip.style.top = `${point.y - host.top}px`;
  tip.classList.remove("hidden");
}

function wireInteractions(zone) {
  const svg = zone.svg;
  let dragging = false, last = null;
  // Click-vs-pan: the node under the pointer at press time, and whether the
  // pointer has since travelled far enough to be a drag. `downNode` is captured
  // on pointerdown because `setPointerCapture` retargets every later event to
  // the <svg> itself — by pointerup the room polygon is no longer `e.target`.
  let downNode = null, downAt = null, movedFar = false;

  svg.addEventListener("pointerdown", e => {
    dragging = true; last = { x: e.clientX, y: e.clientY };
    downNode = e.target; downAt = { x: e.clientX, y: e.clientY }; movedFar = false;
    svg.setPointerCapture(e.pointerId);
  });

  svg.addEventListener("pointerup", () => {
    dragging = false;
    if (!movedFar) {
      // A click on empty space (the grid, or the bare canvas) clears the
      // selection — the same gesture that sets it should be able to unset it.
      //
      // FOOTPRINTS ARE TESTED FIRST, and that is not a reversal of the old
      // "rooms first" rule — it is the same rule, now stated instead of
      // inherited. The old order worked because with areas on, the node under
      // the pointer WAS the footprint, so the room lookup returned null on its
      // own. Once the plan is GL there is no room node to miss, so the
      // precedence has to be written down: clicking what you can SEE is the
      // rule, and the overlay is what you see, because it draws on top with the
      // rooms ghosted to 0.16 beneath it. Selecting a room under a footprint
      // means turning that zone's Areas off, which is per-zone, so a second
      // zone can hold the room view at the same time.
      //
      // The pick uses the coordinates captured at pointerdown, not the live
      // ones: `setPointerCapture` retargets every later event to the <svg>, and
      // by pointerup the pointer may have drifted within CLICK_SLOP_PX.
      // Areas still win over everything, for the reason above. Below them the
      // renderer answers rooms AND doors from one call, with doors first — a
      // glyph is drawn over the room it serves and is much smaller, so a click
      // inside one means the door.
      const area = areaAtNode(zone, downNode);
      const hit = area ? null : zone.renderer.pickAt(downAt.x, downAt.y);
      if (hit && hit.kind === "door") selectDoor(hit.door.id, zone.id);
      else if (hit && hit.kind === "window") selectWindow(hit.window.id, zone.id);
      else if (hit && hit.kind === "item") selectItem(hit.item.id, zone.id);
      else if (hit) selectRoom(hit.room.id, zone.id);
      else selectArea(area ? areaKey(area) : null, area ? zone.id : null);
    }
    downNode = null;
  });

  svg.addEventListener("pointermove", e => {
    if (!dragging) { updateHover(zone, e); return; }
    if (!movedFar && downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > CLICK_SLOP_PX)
      movedFar = true;
    // Both ends of the drag in WORLD units, from the renderer, and subtracted.
    //
    // Not `dx / rect.width * v.w`: `zone.view` is the raw view, and what is on
    // screen is that view widened to the canvas's aspect ratio. On the axis
    // `meet` gave the slack to, the raw view spans FEWER world units than the
    // pixels do, so the plan moved less than the pointer and slid out from
    // under it — on one axis only, which is why it read as a horizontal-pan
    // bug rather than a projection one. The other axis was right by accident:
    // it is the constrained one, where the two rects agree.
    //
    // Both conversions read the same view (nothing has committed yet), so the
    // difference is exact rather than an approximation of it.
    const to = zone.renderer.toWorld(e.clientX, e.clientY);
    const from = zone.renderer.toWorld(last.x, last.y);
    last = { x: e.clientX, y: e.clientY };
    if (!to || !from) return;
    const v = { ...zone.view };
    v.x -= to.x - from.x;
    v.y -= to.y - from.y;
    commitView(zone, v);
    // A pan is not a hover. Dropping the mark here also stops the tooltip
    // trailing the pointer across a drag, which reads as a stuck overlay.
    clearHover(zone);
  });

  // The pointer leaving the plan must clear both, or the last hovered room stays
  // lit while the cursor is somewhere else entirely.
  svg.addEventListener("pointerleave", () => clearHover(zone));

  svg.addEventListener("wheel", e => {
    e.preventDefault();
    // The anchor comes from the renderer for the same reason the pan's ends do:
    // the point under the cursor is only findable through the aspect-corrected
    // view. Scaling the RAW view about that point is still right — the fit is
    // centre-preserving and uniform, so the corrected view scales by the same
    // `k` about the same point.
    const m = zone.renderer.toWorld(e.clientX, e.clientY);
    if (!m) return;
    const v = { ...zone.view };
    const k = e.deltaY > 0 ? 1.1 : 0.9;
    v.x = m.x - (m.x - v.x) * k;
    v.y = m.y - (m.y - v.y) * k;
    v.w *= k; v.h *= k;
    commitView(zone, v);
  }, { passive: false });

  svg.addEventListener("dblclick", () => commitView(zone, zone.fitted));
}

// ============================ zone lifecycle ============================

// Presentation-only controls: level, colour, validation visibility, export,
// areas. Scope handlers live on the header pickers (see "header controls").
function wireZoneControls(zone) {
  const e = zone.els;
  e.levelSelect.addEventListener("change", () => selectLevel(zone, e.levelSelect.value));

  e.colourSelect.addEventListener("change", () => {
    // Re-render the current level with refit:false so pan/zoom is preserved —
    // a pure presentation change. No /rooms refetch.
    zone.activeColourPlan = e.colourSelect.value ? (colourPlans.find(p => p.name === e.colourSelect.value) || null) : null;
    if (currentPayload && zone.activeLevelId) renderLevel(zone, currentPayload, zone.activeLevelId, { refit: false });
  });

  e.exportSvg.addEventListener("click", () => exportZoneLevels(zone));

  e.areasToggle.addEventListener("click", () => {
    zone.areasMode = !zone.areasMode;
    e.areasToggle.classList.toggle("on", zone.areasMode);
    if (zone.areasMode) {
      loadAreas(); // fetch (shared) + this overlay + the band's figures
    } else {
      e.areasTier.classList.add("hidden");
      renderAreasOverlay(zone); // removes the overlay + un-ghosts rooms
      renderAreasBand();        // hides the band when no zone has areas open
      // A footprint selection outlives the overlay it was made on only while
      // some zone can still draw it. With the last one closed it has nothing to
      // point at, so it is cleared rather than left as a panel describing
      // something no longer on screen.
      if (selection && selection.kind === "area" && !zones.some(z => z.areasMode)) select(null);
    }
  });
  e.areasTier.addEventListener("change", () => {
    zone.areasTier = parseInt(e.areasTier.value, 10) || 0;
    renderAreasOverlay(zone); // this zone's overlay only; the band has its own tier
  });
}

// Build one zone: clone the template, wire its presentation state, controls,
// and interactions. Zones carry NO scope and no poll/validation/colour-config
// state — all global — so a new zone needs no seeding from its siblings: it
// catches up from the globals (see the add-zone handler).
function createZone() {
  const id = `zone-${zoneSeq++}`;
  const frag = zoneTemplate.content.cloneNode(true);
  const root = frag.querySelector(".zone");
  const q = (sel) => root.querySelector(sel);

  const zone = {
    id, root,
    svg: q("svg.plan"),
    view: { x: 0, y: 0, w: 100, h: 100 },
    fitted: { x: 0, y: 0, w: 100, h: 100 },
    activeLevelId: null,
    renderer: null,    // the plan renderer (seam); assigned just below
    canvas: null,      // the WebGL layer's canvas
    // presentation state — everything a zone still owns
    activeColourPlan: null,
    areasMode: false,  // this zone's footprint overlay on/off
    areasTier: 0,      // this zone's overlay tier (0 = outermost, e.g. Building)
    els: {
      colourSelect: q(".colourSelect"),
      levelSelect: q(".levelSelect"),
      exportSvg: q(".export-svg"),
      areasToggle: q(".areas-toggle"),
      areasTier: q(".areasTier"),
      meta: q(".meta"),
      empty: q(".empty"),
      tip: q(".plan-tip"),
      busy: q(".plan-busy"),
    },
  };

  // The canvas goes UNDER the <svg>, which stays in the DOM and keeps pointer
  // handling, the areas overlay, and the selection and hover marks. That is
  // Decision 1's hybrid, in one line of layout.
  zone.canvas = document.createElement("canvas");
  zone.canvas.className = "plan-gl";
  zone.svg.parentNode.insertBefore(zone.canvas, zone.svg);
  // The <svg> is handed over as the OVERLAY, and the renderer keeps its viewBox
  // in step with the projection -- without that the overlay is in pixel space
  // and every footprint lands in the top-left corner.
  zone.renderer = new PlanRenderer.GlPlanRenderer(zone.canvas, { overlay: zone.svg });
  // The GL context is created asynchronously. Repaint once it exists, or the
  // first level lands on a renderer with no context and silently draws nothing
  // -- which looks exactly like a broken payload.
  zone.renderer.ready.then(() => {
    if (currentPayload && zone.activeLevelId) renderLevel(zone, currentPayload, zone.activeLevelId, { refit: false });
  });

  wireZoneControls(zone);
  wireInteractions(zone);
  zonesEl.appendChild(root);
  zones.push(zone);
  return zone;
}

function removeZone() {
  if (zones.length <= 1) return;
  const zone = zones.pop();
  // Dispose BEFORE detaching the DOM. Harmless for SVG, load-bearing for GL: a
  // WebGL context is a capped resource (browsers allow ~16 and silently kill
  // the oldest past the limit), so a zone that is closed without releasing one
  // eventually blanks a different zone with no error anyone can act on.
  //
  // `dispose()` clears a LEVEL; `destroy()` releases the context. Both, in that
  // order, because only the second is what the cap counts.
  zone.renderer.dispose();
  zone.renderer.destroy?.();
  zone.root.remove();
  setLayout();
}

// Hard ceiling on open zones, and it exists for the GL renderer specifically.
// Browsers cap live WebGL contexts (commonly ~16) and silently kill the OLDEST
// past the limit — so an unbounded `+ zone` would blank an earlier zone with no
// error, no exception, and nothing a user could act on. 8 leaves headroom for
// graph.js's canvas and for other tabs on the same GPU process.
//
// Applied to both renderers rather than only to GL: a cap that appears when you
// flip a flag is a behaviour difference between the two paths, and the point of
// the flag is that everything except the drawing is identical.
//
// If the cap ever bites in practice, the escape hatch is one canvas across the
// whole zone strip with a gl.viewport/scissor per zone, rather than a context
// each. That is a bigger change and is not needed yet.
const MAX_ZONES = 8;

// The grid column count follows the zone count, capped at 3 (rows wrap beyond).
function setLayout() {
  zonesEl.style.gridTemplateColumns = `repeat(${Math.min(zones.length, 3)}, 1fr)`;
  document.getElementById("removeZone").disabled = zones.length <= 1;
  document.getElementById("addZone").disabled = zones.length >= MAX_ZONES;
}

// ============================ polling loop ============================

// True while a tick is still running, so the next interval firing steps over it
// rather than starting a second one alongside.
//
// `setInterval` fires on the clock, not on completion, and a tick is three
// awaited round trips — so a tick slower than its own interval used to overlap
// the next one, and the one after that, without bound. On the largest project
// here a cold tick is still ~4 s against a 2 s interval, and every overlapping
// copy costs the SERVER a full assemble: measured before the conditional poll
// landed, three concurrent doors reads took it from 245 MB to 904 MB resident.
let tickInFlight = false;

// Each tick: refresh the scope pickers (cheap, signature-gated — also how a
// newly-pushed project shows up without a reload), then ONE scoped /rooms
// fetch fanned out to every zone. Tick cost no longer scales with zone count.
//
// **A skipped tick is dropped, never queued**, and that is the right shape for
// a poll: every tick asks the same question ("what is the current state?"), so a
// tick deferred behind a slow one would only ask it again a moment later.
// Draining a backlog is exactly the pile-up this guard exists to prevent.
//
// The `finally` is load-bearing. `poll` handles its own failures, but
// `refreshScope` can throw, and a flag left set by one exception would stop the
// viewer polling for the rest of the session — a worse failure than the
// overlapping it prevents, and a silent one.
async function tick() {
  if (tickInFlight) return;
  tickInFlight = true;
  try {
    let projects = null;
    try {
      projects = await fetchJson("/projects");
    } catch (err) {
      // Connection issue: skip the picker refresh and let poll() surface it.
    }
    if (projects) await refreshScope(projects);
    await poll();
  } finally {
    tickInFlight = false;
  }
}

scopeEls.project.addEventListener("change", async () => {
  projectId = scopeEls.project.value;
  buildingKey = null;
  lastBuildingsSignature = null;
  milestone = null;
  lastMilestonesSignature = null;
  await loadBuildings(projectId);
  await loadMilestones(projectId);
  colourPlansProjectId = projectId; // keep the refresh guard in sync
  await loadColourPlans(projectId);
  loadValidation(projectId);
  lastRevision = null; // force the next poll tick to render immediately
  // A room id is only meaningful inside its project, so a scope change drops
  // the selection rather than carrying a stale one into the new project's data.
  selectRoom(null);
  adjData = null;
  adjRevision = null;
  // The tolerance is a property of the project (its declared wall thickness and
  // the regime its models were drawn to), so a value probed on one project must
  // not silently become an explicit override on the next — drop back to "let the
  // server decide", same reasoning as dropping the selection above.
  adjWallMm = null;
  document.getElementById("adjWallOut").textContent = "—";
  // One scope on screen means the URL always mirrors it — the "which zone's
  // scope does the URL carry" question is gone. building/milestone are null
  // here (just reset), so the helper drops them from the URL.
  persistSelection(projectId, { building: buildingKey, milestone });
});

// ============================ bottom-region controls ============================
//
// Each block collapses to its one-line summary strip. The QA strip carries the
// count the old header badge did, so nothing was lost by moving the panel down.

// Expand/collapse one block, returning the new open state.
function toggleBand(bodyId, headId, label) {
  const body = document.getElementById(bodyId);
  const open = body.classList.toggle("hidden") === false;
  const head = document.getElementById(headId);
  head.innerHTML = (open ? "▾ " : "▸ ") + label();
  // `.open` on the block is what lets an expanded block share band 1's height
  // with a sibling while a collapsed one stays a single strip.
  body.closest(".result-band").classList.toggle("open", open);
  // Opening a block may be the only thing now flex-filling the region (e.g.
  // with the grid folded), so re-evaluate its reserved height, not just the
  // divider. updateRegionHeight() calls updateBandDivide() itself.
  updateRegionHeight();
  // Expanding takes height from the grid, so its visible row count changed.
  onGridScroll();
  return open;
}

// The band 1 / band 2 divider is only meaningful when a band-1 block is
// expanded AND the grid is present — otherwise there are not two things to
// split. Also re-clamps a dragged height that no longer fits (e.g. after the
// region itself was shrunk, or a block collapsed).
function updateBandDivide() {
  const band1 = document.getElementById("band1");
  const divide = document.getElementById("bandDivide");
  const anyOpen = !!band1.querySelector(".result-band.open:not(.hidden)");
  // A folded grid is only its bar — there is nothing to split against, so the
  // divider hides even though the grid is technically still "shown".
  const gridShown =
    !document.getElementById("gridBand").classList.contains("hidden") && !gridCollapsed;
  divide.classList.toggle("hidden", !(anyOpen && gridShown));
  if (!anyOpen) {
    // Nothing expanded: drop any dragged height so collapsed strips don't
    // hold on to space they no longer need.
    band1.classList.remove("sized");
  }
  updateBand1Max();
  if (band1.classList.contains("sized")) clampBand1();
  updateBandSplits();
}

function bandOpen(id) {
  const el = document.getElementById(id);
  return el.classList.contains("open") && !el.classList.contains("hidden");
}

// The splits *within* band 1, one per adjacent pair of result-bands. Each is
// visible only when both its neighbours are open — with one closed there is
// only a fixed strip on that side, nothing to trade height with.
const BAND_SPLITS = [
  { id: "qaAreasSplit", a: "qaBand", b: "areasBand" },
  { id: "areasAdjSplit", a: "areasBand", b: "adjBand" },
];

function updateBandSplits() {
  for (const { id, a, b } of BAND_SPLITS) {
    const bothOpen = bandOpen(a) && bandOpen(b);
    document.getElementById(id).classList.toggle("hidden", !bothOpen);
    // A split appearing/disappearing means the set of blocks sharing band 1's
    // height just changed, so any dragged proportion between this pair no
    // longer means what it did — drop it rather than carry a stale split.
    if (!bothOpen) {
      for (const bandId of [a, b]) {
        const band = document.getElementById(bandId);
        band.classList.remove("sized");
        band.style.removeProperty("--band-h");
      }
    }
  }
}

// The floor the grid keeps when band 1 is dragged large: its own toolbar and
// sticky header plus a couple of data rows. Measured rather than guessed, so
// it stays right if the bar wraps to two lines on a narrow window.
function gridMinHeight() {
  const bar = document.getElementById("gridBar").offsetHeight || 30;
  // Folded, the grid reserves only its bar — so band 1 can take the rest.
  if (gridCollapsed) return bar;
  const head = document.querySelector("#gridTable thead")?.offsetHeight || 40;
  return bar + head + GRID_ROW_H * 2;
}

// How much height band 1 may take: everything the region has, less the two
// handles and the grid's own floor. Applies to BOTH the content-sized default
// (via the `--band1-max` cap) and any dragged height, so a tall results table
// can never squeeze the grid out of existence — which is what it did before
// this cap existed.
function band1Available() {
  const region = document.getElementById("bottomRegion");
  const handles = document.getElementById("regionDrag").offsetHeight
    + document.getElementById("bandDivide").offsetHeight;
  return Math.max(40, region.clientHeight - handles - gridMinHeight());
}

function updateBand1Max() {
  document.getElementById("band1").style.setProperty("--band1-max", `${Math.round(band1Available())}px`);
}

// Re-clamp a dragged height after the region itself changed size.
function clampBand1() {
  const band1 = document.getElementById("band1");
  const current = parseFloat(band1.style.getPropertyValue("--band1-h")) || band1.getBoundingClientRect().height;
  band1.style.setProperty("--band1-h", `${Math.round(Math.max(40, Math.min(current, band1Available())))}px`);
}

document.getElementById("adjHead").addEventListener("click", () => {
  const open = toggleBand("adjBody", "adjHead", () => "Adjacency");
  if (!open) return;
  // The canvas measured zero while collapsed, so size it now that it has a box,
  // then fetch. Both must happen in this order or the first paint is blurred
  // into a 1x1 backing store.
  ensureGraph().resize();
  loadAdjacency({ force: true });
});

document.getElementById("adjDepth").addEventListener("change", (e) => {
  // Depth is a client-side re-layout over data already held — no refetch: the
  // endpoint returns the whole level's graph and the cap is a readability
  // control, not a query. "All" is therefore free: it asks the layout for every
  // ring the data reaches, not the server for more data.
  ensureGraph().setDepth(e.target.value === "all" ? Infinity : (parseInt(e.target.value, 10) || 2));
  updateAdjMeta();
});

  ensureGraph().setTierDepth(parseInt(e.target.value, 10) || 0);
});

  setAdjWallMm(parseInt(e.target.value, 10) || 0);
  debouncedLoadAdjacency();
});

// The one place plan-side and graph-side selection meet: whatever set the
// selection, the graph re-centres. Registered rather than called from
// `select` so the inspector adds itself the same way.
// The inspector is a plain listener — exactly what `selectionListeners` was
// left open for (see its declaration).
selectionListeners.push(renderInspector);

selectionListeners.push(() => {
  updateAdjMeta();
  if (!adjBandOpen()) return;
  // A room and an area are both focusable (see `graphFocus`), and both are
  // answered by the same request — the payload is one room graph either way, so
  // a granularity change is a re-layout and never a refetch. Only a selection
  // the graph cannot resolve at all clears the focus instead of fetching.
  const focus = graphFocus();
  if (adjData || !focus) { ensureGraph().setFocus(focus); updateAdjMeta(); }
  else loadAdjacency({ force: true });
});

// ---- band 2: the grid ----
// Fold band 2 down to its bar, the same affordance the band-1 blocks carry.
// The region then shrinks to its strips unless a band-1 block is still holding
// it open (see updateRegionHeight), giving the plans the space back.
function toggleGrid() {
  gridCollapsed = !gridCollapsed;
  document.getElementById("gridBand").classList.toggle("collapsed", gridCollapsed);
  document.getElementById("gridHead").textContent = (gridCollapsed ? "▸ " : "▾ ") + "Rooms";
  updateRegionHeight(); // re-evaluates reserved height + the band divider
  onGridScroll();      // an expanded grid's visible row count changed
}
document.getElementById("gridHead").addEventListener("click", toggleGrid);

document.getElementById("gridScroll").addEventListener("scroll", onGridScroll);
document.getElementById("srcModel").addEventListener("change", () => {
  gridScrollTop = 0;
  document.getElementById("gridScroll").scrollTop = 0;
  renderGrid();
});
// Reference-source toggles are dynamic (one per discovered source) -- their
// change listeners are wired in renderSourceToggles() itself.
// Sort and filter are delegated off <thead>, which is rebuilt on every render.
document.getElementById("gridTable").addEventListener("click", (e) => {
  const th = e.target.closest("thead tr.names th");
  if (!th) return;
  const key = th.dataset.key;
  gridSort = gridSort.key === key ? { key, asc: !gridSort.asc } : { key, asc: true };
  renderGrid();
});
document.getElementById("gridTable").addEventListener("input", debounce((e) => {
  const input = e.target.closest("#gridFilters input");
  if (!input) return;
  const key = input.dataset.key;
  const v = input.value.trim().toLowerCase();
  if (v) gridFilters.set(key, v); else gridFilters.delete(key);
  gridScrollTop = 0;
  document.getElementById("gridScroll").scrollTop = 0;
  renderGrid(); // the head survives (same columns), so focus/caret are kept
}, 200));
document.getElementById("gridClearFilters").addEventListener("click", () => {
  gridFilters.clear();
  renderGrid();
});
document.getElementById("gridDownload").addEventListener("click", () => downloadGridCsv());

// ---- two drags: the region's outer edge, and the band 1 / band 2 split ----
//
// Shared plumbing: pointer capture, a `dragging` class, and a per-move
// callback. Both handles resize by *pixels from the drag start* rather than
// by tracking the cursor absolutely, so neither drifts if a clamp bites.
function wireDragHandle(handle, onStart, onMove) {
  let startY = 0, start = 0;
  handle.addEventListener("pointerdown", (e) => {
    startY = e.clientY;
    start = onStart();
    handle.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  handle.addEventListener("pointermove", (e) => {
    if (!handle.classList.contains("dragging")) return;
    onMove(start, e.clientY - startY);
    onGridScroll(); // either drag changes the grid's visible row count
    // ...and either drag changes the canvas's box. Unlike an SVG, a canvas does
    // not reflow: its backing store must be resized explicitly or the graph
    // stays at its old size, stretched.
    if (adjGraph && adjBandOpen()) adjGraph.resize();
  });
  const stop = () => handle.classList.remove("dragging");
  handle.addEventListener("pointerup", stop);
  handle.addEventListener("pointercancel", stop);
}

// The region's total height, against the plans. Dragging UP makes it taller.
(() => {
  const region = document.getElementById("bottomRegion");
  wireDragHandle(
    document.getElementById("regionDrag"),
    () => region.getBoundingClientRect().height,
    (startH, dy) => {
      // Clamped so the region can neither vanish nor swallow the plans.
      const h = Math.min(Math.max(startH - dy, 80), window.innerHeight * 0.75);
      region.style.setProperty("--bottom-h", `${Math.round(h)}px`);
      // A taller/shorter region changes what band 1 may take, both as a cap
      // on the content-sized default and as a clamp on a dragged height.
      updateBand1Max();
      if (document.getElementById("band1").classList.contains("sized")) clampBand1();
    }
  );
})();

// The split between band 1 (results) and band 2 (the table), *within* the
// region's height: dragging DOWN gives the results more and the table less.
// The region total doesn't move, so the plans are untouched either way.
(() => {
  const band1 = document.getElementById("band1");
  const region = document.getElementById("bottomRegion");
  wireDragHandle(
    document.getElementById("bandDivide"),
    () => {
      // First drag switches band 1 from content-sized to explicitly sized,
      // starting at exactly its current height so nothing jumps.
      const h = band1.getBoundingClientRect().height;
      band1.style.setProperty("--band1-h", `${Math.round(h)}px`);
      band1.classList.add("sized");
      return h;
    },
    (startH, dy) => {
      const h = Math.max(40, Math.min(startH + dy, band1Available()));
      band1.style.setProperty("--band1-h", `${Math.round(h)}px`);
    }
  );
})();

// The split *within* band 1 between two adjacent blocks — trading height
// between just that pair, leaving a third open block (and band 2) untouched.
// Same mechanic as #bandDivide, generalized: both sides switch to an explicit
// height at drag start, so their combined space is fixed and only the
// division between them moves.
function wireBandSplit(splitId, aId, bId) {
  const a = document.getElementById(aId);
  const b = document.getElementById(bId);
  wireDragHandle(
    document.getElementById(splitId),
    () => {
      const ha = a.getBoundingClientRect().height;
      const hb = b.getBoundingClientRect().height;
      a.style.setProperty("--band-h", `${Math.round(ha)}px`);
      b.style.setProperty("--band-h", `${Math.round(hb)}px`);
      a.classList.add("sized");
      b.classList.add("sized");
      return [ha, hb];
    },
    ([ha, hb], dy) => {
      const total = ha + hb;
      const newA = Math.max(40, Math.min(total - 40, ha + dy));
      a.style.setProperty("--band-h", `${Math.round(newA)}px`);
      b.style.setProperty("--band-h", `${Math.round(total - newA)}px`);
    }
  );
}
for (const { id, a, b } of BAND_SPLITS) wireBandSplit(id, a, b);

// A window resize changes the canvas's box without any drag. Same reasoning as
// the drag handler: canvas has no reflow.
window.addEventListener("resize", () => {
  if (adjGraph && adjBandOpen()) adjGraph.resize();
});

// ============================ boot ============================

createZone();
setLayout();
// The wall-tolerance slider is deliberately NOT seeded here. There is no honest
// value to seed it with before a response: the default is per project and per
// boundary regime, and the last thing that stood here was a hardcoded 1.5 ft
// that then overrode whatever the project declared. It fills in from the first
// `/adjacency` response instead (`syncWallFromServer`) — until then the band is
// collapsed and there is no graph for a tolerance to apply to.
document.getElementById("adjWallOut").textContent = "—";
tick();
setInterval(tick, 2000);
</script>
</body>
</html>

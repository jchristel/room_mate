  zone.els.meta.textContent = `${lvlName} · ${n} room${n === 1 ? "" : "s"} · v${currentPayload.schema_version} · ${new Date().toLocaleTimeString()}${matches}`;
  zone.els.meta.classList.remove("stale");
}

// Fan a freshly-changed payload out: the page-level half runs once (search
// fields + match set are payload-derived, not zone-derived), then each zone
// re-renders its own level from the shared payload.
function ingestAll(payload) {
  currentPayload = payload;
  // A new payload may add/drop reference sources (a different project) —
  // refresh the discovered-source list and its toggles before anything below
  // reads knownReferenceSources.
  syncReferenceSources();
  // A new payload may add properties (a different project) — refresh the search
  // field checklist, then recompute the match set so the renders below carry
  // the highlight.
  refreshFieldsPanel();
  computeMatches();
  for (const zone of zones) ingestZone(zone);
  // The grid's column set is payload-derived (property keys + the response's
  // dRofus labels, plus any other discovered source's joined fields), so it
  // is rebuilt here rather than on every render.
  gridColumns = buildGridColumns();
  renderGrid();
  // The inspector reads the selected room OUT of this payload, so a new push (or
  // a scope change that drops the room from scope) has to re-render it — a
  // selection-only listener would leave stale values on screen.
  renderInspector();
  // New room data means the footprints changed: refresh them (data + overlays
  // + band figures) while any zone has the mode open. Fire-and-forget.
  if (zones.some(z => z.areasMode)) loadAreas();

  // The adjacency block has something to graph once rooms exist. Same on-demand
  // lifecycle as the areas fetch: the strip appears, but nothing is computed
  // until the user opens it.
  document.getElementById("adjBand").classList.remove("hidden");
  updateRegionHeight();
  loadAdjacency(); // no-op while collapsed; refreshes the graph when open
}

// Bring ONE zone up to date with the current global payload. Also the whole
// init a newly-added zone needs (see the add-zone handler).
function ingestZone(zone) {
  const payload = currentPayload;
  if (!payload) return;
  zone.els.exportSvg.classList.remove("hidden"); // there's now something to export
  zone.els.areasToggle.classList.remove("hidden"); // footprints can be computed now

  const levels = levelsForPayload(payload);
  const prevLevelId = zone.activeLevelId;
  if (!levels.some(l => l.id === zone.activeLevelId)) {
    zone.activeLevelId = levels.length ? levels[0].id : null;
  }

  buildLevelControl(zone, payload, levels);
  // Refit (reset zoom/pan to the fitted view) only on the first render or when
  // the active level actually changed. A plain data re-push on the same level
  // keeps the user's current zoom rather than snapping back to fitted, which
  // read as zoom-specific stutter (see STRATEGY-BROWSER.md, "Endpoints follow fetch lifecycle"). The
  // first render must fit: zone.fitted has to exist for a no-refit render, whose
  // grid/label sizing reads it. Explicit level switches still refit via
  // selectLevel.
  const refit = !zone.fitted || zone.activeLevelId !== prevLevelId;
  // renderLevel owns the overlay whenever there is a level to render. With no
  // levels at all it never runs, so the scope message is set here — otherwise a
  // payload that matched nothing leaves the stale "waiting" message claiming
  // nothing was ever pushed.
  if (zone.activeLevelId) renderLevel(zone, payload, zone.activeLevelId, { refit });
  else setZoneEmpty(zone, "scope");
  updateMeta(zone);
}

// ============================ colour picker ============================

function populateColourSelect(zone, plans) {
  const sel = zone.els.colourSelect;
  sel.replaceChildren();
  const none = document.createElement("option");
  none.value = "";
  none.textContent = "No colour";
  sel.appendChild(none);
  for (const p of plans) {
    const opt = document.createElement("option");
    opt.value = p.name;
    opt.textContent = p.name;
    sel.appendChild(opt);
  }
  sel.classList.toggle("hidden", plans.length === 0);
}

// Reset one zone's picker to the loaded plan list, applying the `active`
// default. Used on project change (every zone resets together) and to bring a
// newly-added zone up to speed. "No colour" always overrides, so `active` is
// just the default.
function applyColourPlans(zone) {
  populateColourSelect(zone, colourPlans);
  const active = colourPlans.find(p => p.active) || null;
  zone.activeColourPlan = active;
  zone.els.colourSelect.value = active ? active.name : "";
}

// Read the project's colour plans from the settings API — the viewer's one
// read-only use of /api/settings, once per project change (scope is global,
// so this is one fetch for the page, not one per zone).
async function loadColourPlans(pid) {
  try {
    // Resolving route (not the strict /api/settings/projects/{id} the editors
    // use): the viewer holds the *payload* project id, which is not a settings
    // project_id, so it needs the server's default-fallback to find the file
    // that carries this project's colour plans. See resolve_project_file.
    const data = await fetchJson(`/api/settings/resolve/${encodeURIComponent(pid)}`);
    colourPlans = (data.settings && data.settings.colour_plans) || [];
  } catch (err) {
    colourPlans = [];
  }
  for (const zone of zones) applyColourPlans(zone);
}

// ============================ scope pickers (header, global) =============
//
// One project/milestone/building selection for the whole page. Under the old
// per-zone scope these were populated per zone and carried per-zone diff
// signatures, a one-shot seed for zones[0] only, and a focus question ("whose
// scope does the URL persist?"). Global scope deletes all of that: one set of
// header <select>s, one signature each, no zones[0] special case.

const scopeEls = {
  project: document.getElementById("projectSelect"),
  milestone: document.getElementById("milestoneSelect"),
  building: document.getElementById("buildingSelect"),
};

function populateProjectSelect(projects) {
  const sel = scopeEls.project;
  const prevValue = sel.value;
  sel.replaceChildren();
  for (const p of projects) {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.name;
    sel.appendChild(opt);
  }
  sel.classList.toggle("hidden", projects.length === 0);
  if (projects.some(p => p.id === prevValue)) sel.value = prevValue;
}

function populateBuildingSelect(data) {
  const sel = scopeEls.building;
  const prevValue = sel.value;
  sel.replaceChildren();
  for (const b of data.buildings) {
    const opt = document.createElement("option");
    opt.value = b.key;
    let label = b.unclassified ? "Unclassified" : (b.name || b.code || b.key);
    if (b.ambiguous && b.name && b.code) label = `${b.name} (${b.code})`;
    opt.textContent = label;
    sel.appendChild(opt);
  }
  sel.classList.toggle("hidden", data.buildings.length <= 1);
  if (data.buildings.some(b => b.key === prevValue)) sel.value = prevValue;
}

function populateMilestoneSelect(data) {
  const sel = scopeEls.milestone;
  const prevValue = sel.value;
  sel.replaceChildren();
  const latest = document.createElement("option");
  latest.value = "";
  latest.textContent = "Latest";
  sel.appendChild(latest);
  for (const m of data.milestones) {
    const opt = document.createElement("option");
    opt.value = m.name;
    opt.textContent = `${m.name} (${m.date})`;
    sel.appendChild(opt);
  }
  sel.classList.toggle("hidden", data.milestones.length === 0);
  if (data.milestones.some(m => m.name === prevValue)) sel.value = prevValue;
}

// Refresh the global scope from the known-projects list; auto-select if the
// current project no longer exists. Diffs against the last-seen id list so
// the 2s tick doesn't fight an in-progress user selection.
async function refreshScope(projects) {
  // Colour plans depend only on the *current* project, not on whether the
  // project *list* changed — so load them before the early-return guard below.
  // Without this, the picker never appears in the steady state: the list is
  // unchanged every tick, so the code below the guard is unreachable. The
  // colourPlansProjectId guard keeps this to one fetch per project change.
  if (projectId && colourPlansProjectId !== projectId) {
    colourPlansProjectId = projectId;
    loadColourPlans(projectId);
  }

  const ids = projects.map(p => p.id).join(",");
  if (ids === lastProjectIds) return;
  lastProjectIds = ids;
  populateProjectSelect(projects);

  if (!projects.some(p => p.id === projectId)) {
    // Restore the project from URL/localStorage on first resolve; later
    // re-resolves keep the plain projects[0] default. A seed the server no
    // longer lists falls through to projects[0].
    let fallback = projects.length ? projects[0].id : null;
    if (!seededProject && projects.length) {
      seededProject = true; // one-shot, so a later project deletion re-defaults cleanly
      const seed = seedProjectId();
      if (seed && projects.some(p => p.id === seed)) fallback = seed;
    }
    projectId = fallback;
    // Sync the picker to the resolved/restored project. populateProjectSelect
    // above runs before this block, so on a first-load restore it would
    // otherwise leave the dropdown showing projects[0] while the page renders
    // the restored project — a confusing mismatch.
    if (projectId) scopeEls.project.value = projectId;
    lastBuildingsSignature = null;
    lastMilestonesSignature = null;
    milestone = null;
    if (projectId) {
      loadValidation(projectId);
      // Colour plans load via the guarded block above; a reset changes
      // projectId, so the guard re-fires on the next tick.
    }
  }
  if (projectId) {
    await loadBuildings(projectId);
    await loadMilestones(projectId);

    // Restore building/milestone from the URL once, after their option lists
    // exist — and only if the freshly-loaded lists still contain them (stale
    // scope falls away, same discipline as the project seed). A second
    // one-shot flag so the 2s poll's picker refreshes never clobber a later
    // manual change. building/milestone are URL-only (never localStorage).
    if (!seededScope) {
      seededScope = true;
      const hasOpt = (sel, v) => Array.from(sel.options).some(o => o.value === v);
      const b = urlParam("building");
      if (b && hasOpt(scopeEls.building, b)) {
        buildingKey = b;
        scopeEls.building.value = b;
        lastRevision = null;
      }
      const m = urlParam("milestone");
      if (m && hasOpt(scopeEls.milestone, m)) {
        milestone = m;
        scopeEls.milestone.value = m;
        lastRevision = null;
      }

      // Seed cross-page persistence from a restored/deep-linked selection too,
      // so the viewer matches settings/comparison (whose restore persists via
      // their selectProject). Writes the project id to localStorage + URL and
      // mirrors the actual current scope — a URL value, or the auto-selected
      // building — back into the URL, replacing any stale scope the deep-link
      // carried. This is why a bookmarked viewer link carries the project to
      // the other pages.
      persistSelection(projectId, { building: buildingKey, milestone });
    }
  }
}

async function loadBuildings(pid) {
  let data;
  try {
    data = await fetchJson(`/projects/${encodeURIComponent(pid)}/buildings`);
  } catch (err) {
    return;
  }
  const signature = `${data.tier_configured}:${data.buildings.map(b => b.key).join(",")}`;
  if (signature === lastBuildingsSignature) return;
  lastBuildingsSignature = signature;
  populateBuildingSelect(data);

  if (!data.buildings.some(b => b.key === buildingKey)) {
    buildingKey = data.buildings.length ? data.buildings[0].key : null;
  }
}

async function loadMilestones(pid) {
  let data;
  try {
    data = await fetchJson(`/projects/${encodeURIComponent(pid)}/milestones`);
  } catch (err) {
    return;
  }
  const signature = data.milestones.map(m => `${m.name}@${m.date}`).join(",");
  if (signature === lastMilestonesSignature) return;
  lastMilestonesSignature = signature;
  populateMilestoneSelect(data);

  if (milestone && !data.milestones.some(m => m.name === milestone)) {
    milestone = null;
    scopeEls.milestone.value = "";
    lastRevision = null; // selection changed under us -> re-render next tick
  }
}

// ============================ validation (QA band) ============================
//
// An on-demand health check, not part of the room poll. Fetched once when the
// project changes, or via the band's Refresh button. Everything is
// page-level: one report, one error set, ONE results block in the bottom
// band whose collapsed strip doubles as the old header badge ("▸ QA · ⚠ 3").
// Expanding the block turns on the plans' error highlighting (`showErrors`),
// mirroring the old panel-open-shows-errors behaviour.

function section(title, items, renderItem) {
  if (items.length === 0) return "";
  return `<section><h3>${title} (${items.length})</h3><ul>${items.map(renderItem).join("")}</ul></section>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// A reference-source name as a CSS class token. Source names come from the
// operator's settings file, so they are free text: `src-${name}` interpolated
// raw into a `class="..."` attribute let a name containing a quote close the
// attribute, and one containing a space silently became two classes.
//
// Escaping is the wrong tool here — `&quot;` keeps the attribute intact but
// yields a class no CSS rule can select. A class only has to be a stable,
// selector-safe token, so anything outside `[A-Za-z0-9_-]` becomes `_`.
// Two sources can collide in principle (`a.b` and `a-b` both give `a_b`) and
// it does not matter: the class only drives colour banding, while `data-key`
// — which addresses a column — carries the exact name, escaped.
function cssIdent(s) {
  return String(s).replace(/[^A-Za-z0-9_-]/g, "_");
}

function renderFieldCoverage(coverage) {
  if (!coverage || coverage.length === 0) return "";
  return `<section><h3>Field coverage (${coverage.length})</h3><ul>${coverage.map(c =>
    `<li class="${c.checked ? "ok" : ""}">${escapeHtml(c.label)}: ${c.checked ? "yes" : "no"}`
    + `${c.revit_property ? ` (${escapeHtml(c.revit_property)})` : ""}</li>`
  ).join("")}</ul></section>`;
}

// Every room id flagged by one source's report. Per source because each
// source reconciles on its own link property, so the same room can be clean
// for one and unmatched for another.
//
// `reference_unmatched` is deliberately absent: it holds the source's own
// LINK VALUES, not room ids, and the finding is precisely that no room
// corresponds to them. Mixing them in would put non-room ids into a set used
// to highlight rooms on the plan and mark rows in the grid — at best inert, at
// worst flagging an unrelated room whose id happens to equal a link value.
function sourceErrorRoomIds(report) {
  return [
    ...report.rooms_missing_link_value,
    ...report.duplicate_link_values.flatMap(d => d.room_ids),
    ...report.rooms_unmatched,
    ...report.property_mismatches.map(m => m.room_id),
    ...report.fields_absent_in_revit.map(m => m.room_id),
    ...report.fields_empty_in_revit.map(m => m.room_id),
  ];
}

// One source's findings, as a titled block. The six sections are the same
// six the single-source band always showed; what is new is that they are
// rendered once PER SOURCE, under a heading naming it, because a discrepancy
// is only meaningful against the source that found it — "unmatched" means
// unmatched in dRofus or unmatched in FFE, never just "unmatched".
function renderSourceValidation(name, report) {
  // Each entry names its room via `data-room`, which makes it a jump target
  // into band 2 rather than a place to repeat the row's detail (see the
  // delegated handler below). Cheap to allow for now, expensive to retrofit.
  const at = (id) => ` data-room="${escapeHtml(id)}"`;
  const label = escapeHtml(sourceDisplayName(name));
  const body = [
    // Ahead of every list, because when this fires the lists below are all
    // noise: every room is missing a link value and every row is unmatched,
    // and reading them top to bottom tells you the data is catastrophically
    // broken when the truth is that one property name never resolved. Says
    // what to change, not just what is wrong — the fix is a settings edit and
    // nothing about the CSV or the model is at fault.
    report.link_property_absent_everywhere
      ? `<section class="config-error"><h3>⚠ Link property "${escapeHtml(report.link_property)}" `
        + `does not exist on any room</h3><ul><li>Nothing can join: every room below is listed only `
        + `because this lookup found no property of that name, not because its data is missing. `
        + `Either ${label}'s CSV names a property the rooms do not carry (row 2, first column), or `
        + `this project needs a <code>[[builtin_properties]]</code> entry mapping `
        + `<code>${escapeHtml(report.link_property)}</code> to the Revit property that holds it.</li></ul></section>`
      : "",
    section("Missing link value", report.rooms_missing_link_value, id => `<li${at(id)}>${escapeHtml(id)}</li>`),
    section("Duplicate link values", report.duplicate_link_values,
      d => `<li>${escapeHtml(d.value)}: ${d.room_ids.map(id => `<span${at(id)}>${escapeHtml(id)}</span>`).join(", ")}</li>`),
    // These two headings are deliberately symmetrical, and each names BOTH
    // sides in a fixed order: which population was looked in, then which one
    // was searched. "Rooms unmatched in X" read as a value comparison and gave
    // no clue which side was short — the question it actually answers is
    // "where is the data missing", and 1205 unmatched rooms against an export
    // covering 1824 of 3045 is an answer nobody could reach from the old
    // wording without opening the CSV.
    section(`Rooms in the model with no match in ${label}`, report.rooms_unmatched,
      id => `<li${at(id)}>${escapeHtml(id)}</li>`),
    // The reverse direction. "Rows", not "Rooms", and the asymmetry is the
    // honest one: these are the source's own link values — CSV rows — and a
    // source keyed on something other than a room number would make "rooms"
    // simply wrong. Deliberately NOT a `data-room` jump target either, for the
    // same reason: there is no room to jump to, that being the entire finding.
    section(`Rows in ${label} with no match in the model`, report.reference_unmatched || [],
      value => `<li>${escapeHtml(value)}</li>`),
    // Both of these are about the uploaded FILE, not about any room: rows the
    // loader had to drop. No `data-room` for the same reason as above.
    section(`${label} ids used by more than one row`, report.reference_duplicate_ids || [],
      value => `<li>${escapeHtml(value)} <span class="uncounted">(only the last row kept)</span></li>`),
    ...(report.reference_blank_id_rows
      ? [`<section><h3>${label} rows with no id (${report.reference_blank_id_rows})</h3>`
         + `<ul><li>skipped at load — check the CSV's key column</li></ul></section>`]
      : []),
    section("Property mismatches", report.property_mismatches, m =>
      `<li class="mismatch"${at(m.room_id)}>room ${escapeHtml(m.room_id)} · ${escapeHtml(m.field)}: `
      + `"${escapeHtml(m.room_value)}" vs ${label} "${escapeHtml(m.reference_value)}"</li>`),
    section("Field absent in Revit", report.fields_absent_in_revit, m =>
      `<li class="mismatch"${at(m.room_id)}>room ${escapeHtml(m.room_id)} · ${escapeHtml(m.field)}</li>`),
    section("Field empty in Revit", report.fields_empty_in_revit, m =>
      `<li class="mismatch"${at(m.room_id)}>room ${escapeHtml(m.room_id)} · ${escapeHtml(m.field)}</li>`),
  ].join("");

  const count = report.discrepancies?.total ?? 0;
  return `<section class="qa-source">`
    + `<h2>${label} <span class="qa-source-meta">link property `
    + `<strong>${escapeHtml(report.link_property)}</strong> · ${count ? `⚠ ${count}` : "✓ no issues"}</span></h2>`
    + (count ? body : `<p class="ok">No issues found.</p>`)
    + renderFieldCoverage(report.field_coverage)
    + `</section>`;
}

// Which Revit phase each of the project's models was filtered to, rendered ONLY
// when they disagree.
//
// This is not a reference-source finding — it has no source, which is why the
// server carries it outside `sources`. It is here because `/rooms` merges every
// model's latest snapshot regardless of phase (enforcing agreement across models
// would deadlock a project trying to move phase), so a plan can be assembled
// from two different phases and still look complete. Under the immutability rule
// that state is also permanent until someone activates a re-phase, so it will
// not resolve itself by being ignored.
//
// A `null` phase is a model pushed before phasing existed: its rooms were never
// filtered to any phase at all, which is a worse problem than disagreeing about
// which, and reads as its own value rather than as missing metadata.
function renderPhaseReport(phases) {
  if (!phases || !phases.disagree) return "";
  const rows = Object.entries(phases.by_model || {})
    .map(([model, phase]) => `<li class="mismatch">${escapeHtml(model)}: `
      + (phase ? escapeHtml(phase) : `<span class="uncounted">not phased — rooms were never filtered</span>`)
      + `</li>`)
    .join("");
  return `<section class="qa-source qa-phases">`
    + `<h2>Phases <span class="qa-source-meta">⚠ models disagree</span></h2>`
    + `<p>These models were filtered to different Revit phases, so the plan above `
    + `merges rooms from more than one phase. Areas, adjacency and room counts `
    + `across models are not comparable while this holds.</p>`
    + `<ul>${rows}</ul></section>`;
}

// The collapsed strip's label — **one definition**, because it is written from
// two places: a fresh report, and the expand/collapse toggle. They used to
// build it separately, and adding the phase marker to only the first meant the
// marker vanished the moment you expanded the panel — a strip reading "✓" over
// a body full of findings, which is worse than no strip at all.
//
// A phase disagreement is its own marker rather than folded into the count:
// `discrepancies.total` is summed per reference source and means "rows that
// failed to reconcile", so adding one for a project-level phase problem would
// make the number mean two things.
function qaStripLabel() {
  const d = currentValidation;
  if (!d) return "QA";
  const marks = [];
  const issues = d.discrepancies?.total ?? 0;
  if (issues) marks.push(`<span class="issues">⚠ ${issues}</span>`);
  if (d.phases?.disagree) marks.push(`<span class="issues">⚠ mixed phases</span>`);
  return "QA · " + (marks.length ? marks.join(" · ") : "✓");
}

// Update the globals from a fresh report and reflect it into the QA band.
function renderValidation(data) {
  currentValidation = data;
  const sources = Object.entries(data.sources || {});
  const phaseSection = renderPhaseReport(data.phases);

  // The union across sources: a room is flagged on the plan if ANY source
  // has something to say about it. Which source is in the band, not the plan.
  errorRoomIds = new Set(sources.flatMap(([, report]) => sourceErrorRoomIds(report)));

  const band = document.getElementById("qaBand");
  // No configured-and-loaded source anywhere = nothing to reconcile. This is
  // the empty-map form of what `drofus_configured: false` used to say.
  //
  // A phase disagreement keeps the band open regardless: it owes nothing to
  // reference data, and a project that reconciles against nothing is exactly
  // the one where nobody would otherwise be looking. The server computes the
  // phase report before its own no-sources bail for the same reason.
  if (sources.length === 0 && !phaseSection) {
    band.classList.add("hidden");
    updateRegionHeight();
    setShowErrors(false);
    return;
  }
  band.classList.remove("hidden");
  updateRegionHeight();

  // Fresh error set: re-highlight open plans without disturbing pan/zoom.
  if (showErrors) rerenderZones();

  // Summed across every source by the server, so a second source's problems
  // can't hide behind a clean first one.
  const issueCount = data.discrepancies?.total ?? 0;

  const open = !document.getElementById("qaBody").classList.contains("hidden");
  document.getElementById("qaHead").innerHTML = `${open ? "▾" : "▸"} ` + qaStripLabel();

  document.getElementById("qaContent").innerHTML =
    (sources.length
      ? `<p>${data.total_rooms} room(s) checked against ${sources.length} reference source(s).</p>`
      : `<p>No reference source configured — nothing to reconcile.</p>`)
    + phaseSection
    + sources.map(([name, report]) => renderSourceValidation(name, report)).join("");

  // A fresh report re-addresses the grid's QA marks.
  rebuildGridErrorIndex();
  renderGrid();
}

// Error highlighting is page state tracking the QA block: set + re-render.
function setShowErrors(on) {
  if (showErrors === on) return;
  showErrors = on;
  rerenderZones();
}

// Re-render every zone's current level in place (refit:false — never disturb
// pan/zoom for a presentation change).
function rerenderZones() {
  if (!currentPayload) return;
  for (const zone of zones) {
    if (zone.activeLevelId) renderLevel(zone, currentPayload, zone.activeLevelId, { refit: false });
  }
}

async function loadValidation(pid) {
  if (!pid) return;
  try {
    const data = await fetchJson(`/projects/${encodeURIComponent(pid)}/validation`);
    renderValidation(data);
  } catch (err) {
    // transient fetch failure -- leave the last-known validation state alone
  }
}

function csvEscape(value) {
  const s = String(value);
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

// One CSV covering every source. `source` is a real column rather than one
// file per source: a room that is clean in dRofus and broken in FFE should
// appear once per finding in one sheet, sortable by either dimension.
//
// The link-value column can no longer be headed by THE link property, since
// each source has its own — so the header is generic and the source column
// tells you which property the value came from. room_number / room_name /
// link_value come from that source's per-room detail (error_rooms).
function buildValidationCsv(data) {
  const rows = [["source", "room_id", "room_number", "room_name", "link_property", "link_value", "error"]];
  // The phase disagreement first, and under a "phase" source label rather than
  // a column of its own: it is per MODEL, not per room, so it fills none of the
  // room columns — but splitting it into a second file would hide it from
  // anyone who opens the sheet expecting every finding in one place.
  if (data.phases?.disagree) {
    for (const [model, phase] of Object.entries(data.phases.by_model || {})) {
      rows.push(["phase", "", "", "", "", "",
        `model ${model} is on phase ${phase ?? "(none — rooms were never filtered)"}; `
        + `this project's models disagree, so the merged plan spans more than one phase`]);
    }
  }
  for (const [name, report] of Object.entries(data.sources || {})) {
    const info = report.error_rooms || {};
    const label = sourceDisplayName(name);
    const push = (id, error) => {
      const r = info[id] || {};
      rows.push([label, id, r.number || "", r.name || "", report.link_property || "", r.link_value || "", error]);
    };
    for (const id of report.rooms_missing_link_value) push(id, "missing link value");
    for (const dup of report.duplicate_link_values)
      for (const id of dup.room_ids) push(id, `duplicate link value: ${dup.value}`);
    // Same two directions as the on-screen headings, and worded to match them:
    // whoever exports this CSV is doing it to find out which side is short.
    for (const id of report.rooms_unmatched) push(id, `room in the model with no match in ${label}`);
    // No room id, number or name — the whole point is that no room reached
    // this record — so only the link value is filled, under its own column.
    for (const value of report.reference_unmatched || [])
      rows.push([label, "", "", "", report.link_property || "", value,
        `row in ${label} with no match in the model`]);
    for (const value of report.reference_duplicate_ids || [])
      rows.push([label, "", "", "", report.link_property || "", value,
        `${label} id used by more than one row (only the last kept)`]);
    if (report.reference_blank_id_rows)
      rows.push([label, "", "", "", report.link_property || "", "",
        `${label} has ${report.reference_blank_id_rows} row(s) with no id (skipped at load)`]);
    for (const m of report.property_mismatches)
      push(m.room_id, `property mismatch: ${m.field} (room="${m.room_value}" vs ${label}="${m.reference_value}")`);
    for (const m of report.fields_absent_in_revit) push(m.room_id, `field absent in Revit: ${m.field}`);
    for (const m of report.fields_empty_in_revit) push(m.room_id, `field empty in Revit: ${m.field}`);
  }
  return rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
}

// Shared by both panels' Download-CSV buttons: turn CSV text into a download.
function downloadCsv(filename, csvText) {
  const blob = new Blob([csvText], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function downloadValidationCsv() {
  if (!currentValidation) return;
  // A phase disagreement is downloadable on its own: the band is visible with
  // no reference source configured in exactly that case, and a Download button
  // that silently does nothing while findings are on screen is worse than no
  // button.
  const hasFindings =
    Object.keys(currentValidation.sources || {}).length > 0 || currentValidation.phases?.disagree;
  if (!hasFindings) return;
  downloadCsv(`validation-${projectId || "project"}.csv`, buildValidationCsv(currentValidation));
}

// ============================ SVG export ============================

// The plan's visual styling lives in this page's <style> (colours) and
// tokens.css (the palette). A saved .svg leaves the browser and references
// neither, so it must carry its own <style>. Structural values (stroke widths,
// dash, non-scaling-stroke) mirror the `.room`/`.hole`/`.grid` rules above;
// colours are read live from the resolved CSS custom properties so they never
// drift from the page. `--fill-hover` is interactive-only and omitted.
function exportStyleBlock() {
  const cs = getComputedStyle(document.documentElement);
  const v = (name) => cs.getPropertyValue(name).trim();
  return `
    .grid line { stroke: ${v('--rule')}; stroke-width: 0.5; vector-effect: non-scaling-stroke; }
    .room { fill: ${v('--fill')}; stroke: ${v('--ink')}; stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .room.error { fill: ${v('--error')}; }
    .hole { fill: ${v('--paper')}; stroke: ${v('--ink')}; stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
    .label { fill: ${v('--ink')}; text-anchor: middle; dominant-baseline: middle; }
    .label .tag { fill: ${v('--accent')}; letter-spacing: 0.05em; }
  `;
}

// Build ONE standalone, self-contained SVG document string for a single level,
// framed to that level's own fitted bounds (never the zone's current pan/zoom).
// Returns null for a level with no drawable rooms. Reuses `paintLevel`, so the
// exported geometry is identical to what's on screen.
const EXPORT_WIDTH_PX = 1600;
function buildLevelSvgFile(payload, levelId, { withErrors = false, colourPlan = null, errorRoomIds = null, showLabels = true } = {}) {
  const rooms = roomsOnLevel(payload, levelId);
  const fitted = fittedBounds(rooms);
  if (!fitted) return null;

  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("xmlns", SVG);
  svg.setAttribute("viewBox", `${fitted.x} ${fitted.y} ${fitted.w} ${fitted.h}`);
  svg.setAttribute("width", EXPORT_WIDTH_PX);
  svg.setAttribute("height", Math.max(1, Math.round(EXPORT_WIDTH_PX * fitted.h / fitted.w)));

  const style = document.createElementNS(SVG, "style");
  style.textContent = exportStyleBlock();
  svg.appendChild(style);

  // Opaque paper background covering the viewBox, so the file isn't transparent
  // when pasted onto a white/dark surface. First child = painted first = behind.
  const bg = document.createElementNS(SVG, "rect");
  bg.setAttribute("x", fitted.x);
  bg.setAttribute("y", fitted.y);
  bg.setAttribute("width", fitted.w);
  bg.setAttribute("height", fitted.h);
  bg.setAttribute("fill", getComputedStyle(document.documentElement).getPropertyValue('--paper').trim());
  svg.appendChild(bg);

  paintLevel(svg, rooms, fitted, { colourPlan, errorRoomIds, showErrors: withErrors, showLabels });

  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg);
}

// A filesystem-safe, self-describing name: roomplan_<project>_<level>[_<milestone>][_errors].svg
function svgFilename(levelName, withErrors) {
  const safe = (s, fallback) =>
    (s ? String(s) : "").replace(/[^a-z0-9._-]+/gi, "-").replace(/^-+|-+$/g, "") || fallback;
  const parts = ["roomplan", safe(projectId, "project"), safe(levelName, "level")];
  if (milestone) parts.push(safe(milestone, "milestone"));
  if (withErrors) parts.push("errors");
  return parts.join("_") + ".svg";
}

function downloadSvg(svgText, filename) {
  const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Export EVERY building level of this zone's current payload, one standalone
// .svg per level. One click -> N downloads: browsers show a one-time "allow
// multiple downloads" permission and can throttle rapid clicks, so the files are
// emitted with a small stagger. Error highlighting follows the validation panel
// (`showErrors`), which is only on once validation is loaded — so an exported
// "errors" file is never a silent empty highlight.
async function exportZoneLevels(zone) {
  if (!currentPayload) return;
  const levels = levelsForPayload(currentPayload);
  if (levels.length === 0) return;
  const withErrors = showErrors; // follows the QA band, like the on-screen plans
  for (const lvl of levels) {
    const svgText = buildLevelSvgFile(currentPayload, lvl.id, {
      withErrors,
      colourPlan: zone.activeColourPlan, // per-zone presentation still applies
      errorRoomIds,
      showLabels: showRoomLabels, // export follows the header toggle
    });
    if (!svgText) continue; // level with no drawable rooms
    downloadSvg(svgText, svgFilename(lvl.name, withErrors));
    await new Promise((r) => setTimeout(r, 150));
  }
}

// ============================ hierarchy areas ============================

function areasUrl() {
  const params = new URLSearchParams();
  if (buildingKey) params.set("building", buildingKey);
  if (milestone) params.set("milestone", milestone);
  const qs = params.toString();
  return `/projects/${encodeURIComponent(projectId)}/areas${qs ? "?" + qs : ""}`;
}

// Fetch the dissolved footprints for the global scope, then refresh this
// zone's tier picker, overlay, and summary. On-demand (NOT on the 2s room
// poll): areas are derived and heavier than a room fetch, and only needed
// while the mode is on — re-fetched on toggle-on and whenever real new room
// data arrives (see ingestZone). Per-zone because the mode, tier, and level
// are presentation; two zones with areas on fetch twice, acceptably.
async function loadAreas() {
  if (!projectId) return;
  try {
    areasData = await fetchJson(areasUrl());
  } catch (err) {
    areasData = null;
  }
  // One dataset feeds every open overlay and the band's figures.
  for (const zone of zones) {
    if (!zone.areasMode) continue;
    populateAreasTier(zone);
    renderAreasOverlay(zone);
  }
  populateAreasBandTier();
  renderAreasBand();
}

// Tier labels come from the group paths: path depth i carries that tier's label.
function tierNames(data) {
  const names = [];
  for (const g of (data && data.groups) || [])
    g.path.forEach((t, i) => { if (names[i] === undefined) names[i] = t.tier; });
  return names;
}

function populateAreasTier(zone) {
  const sel = zone.els.areasTier;
  const names = tierNames(areasData);
  sel.replaceChildren();
  names.forEach((name, depth) => {
    const opt = document.createElement("option");
    opt.value = String(depth);
    opt.textContent = name;
    sel.appendChild(opt);
  });
  if (zone.areasTier >= names.length) zone.areasTier = 0;
  sel.value = String(zone.areasTier);
  sel.classList.toggle("hidden", !zone.areasMode || names.length === 0);
}

// The band's own tier picker: same option list, independent selection — the
// figures need not follow any one zone's overlay tier.
function populateAreasBandTier() {
  const sel = document.getElementById("areasBandTier");
  const names = tierNames(areasData);
  sel.replaceChildren();
  names.forEach((name, depth) => {
    const opt = document.createElement("option");
    opt.value = String(depth);
    opt.textContent = name;
    sel.appendChild(opt);
  });
  if (areasBandTier >= names.length) areasBandTier = 0;
  sel.value = String(areasBandTier);
}

// `tierSig` / `pathKey` / `tierLabel` live in common.js: the adjacency graph
// aggregates the room graph to a hierarchy tier and must build byte-identical
// group keys, so the vocabulary is shared rather than copied (same move the
// palette made — see common.js).

// Selection identity for one area group: (level, full path prefix), which is
// what makes a group a group server-side. Deliberately NOT the array index —
// a group must stay selected across the overlay rebuilds that a tier change,
// level switch or poll re-render all trigger, and index survives none of them.
function areaKey(grp) { return `${grp.level_id}|${pathKey(grp.path, grp.path.length - 1)}`; }

// A footprint ring is [[x,y],…] in model coords; flip Y for the SVG's Y-down space.
// SVG path `d` for a footprint polygon: its exterior ring plus any interior
// rings (voids), each a closed subpath. Rendered with fill-rule:evenodd so the
// interior rings cut holes. Y is flipped (model Y-up -> SVG Y-down) like every
// other geometry the viewer draws.
function ringSubpath(ring) {
  return "M" + ring.map(([x, y]) => `${x},${-y}`).join("L") + "Z";
}
function footprintPathD(poly) {
  let d = ringSubpath(poly.exterior);
  for (const hole of (poly.holes || [])) {
    if (hole && hole.length >= 3) d += ringSubpath(hole);
  }
  return d;
}

function ringAreaAbs(ring) {
  let a = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x1, y1] = ring[i], [x2, y2] = ring[(i + 1) % ring.length];
    a += x1 * y2 - x2 * y1;
  }
  return Math.abs(a) / 2;
}

// Axis-aligned bbox of a footprint ring ([[x,y],…], model coords). Used to size
// the tier label against the polygon it names. Note this OVERSTATES the usable
// interior for L-shaped or concave dissolved footprints — hence the deliberately
// conservative 0.7 width factor at the call site rather than addLabel()'s 0.9.
function ringBox(ring) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of ring) {
    if (x < x0) x0 = x;
    if (x > x1) x1 = x;
    if (y < y0) y0 = y;
    if (y > y1) y1 = y;
  }
  return { w: x1 - x0, h: y1 - y0 };
}

function ringCentroid(ring) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x1, y1] = ring[i], [x2, y2] = ring[(i + 1) % ring.length];
    const cross = x1 * y2 - x2 * y1;
    a += cross; cx += (x1 + x2) * cross; cy += (y1 + y2) * cross;
  }
  if (Math.abs(a) < 1e-9) {
    const n = ring.length || 1;
    return { x: ring.reduce((s, p) => s + p[0], 0) / n, y: ring.reduce((s, p) => s + p[1], 0) / n };
  }
  return { x: cx / (3 * a), y: cy / (3 * a) };
}

// Net area of one room = its outer loop minus its holes (shoelace, model coords).
// The dissolved footprint is always >= the summed net of its rooms; the gap is
// wall zones + filled voids (see STRATEGY-AREA-CALCULATION.md).
function roomNetArea(room) {
  if (!room.loops || room.loops.length === 0) return 0;
  const ringArea = (loop) => {
    const p = loop.points;
    let a = 0;
    for (let i = 0; i < p.length; i++) {
      const q = p[(i + 1) % p.length];
      a += p[i].x * q.y - q.x * p[i].y;
    }
    return Math.abs(a) / 2;
  };
  let area = ringArea(room.loops[0]);
  for (let i = 1; i < room.loops.length; i++) area -= ringArea(room.loops[i]);
  return Math.max(0, area);
}

// Groups on this zone's active level at its overlay tier, in server order.
function activeAreaGroups(zone) {
  if (!areasData) return [];
  const depth = zone.areasTier;
  return areasData.groups.filter(g => g.level_id === zone.activeLevelId && g.path.length === depth + 1);
}

// Draw the dissolved footprints for the active level at the selected tier, on
// top of the (ghosted) rooms. Rebuilt on every render/level/tier change; removed
// when the mode is off. Called at the end of renderLevel so it survives the
// poll/colour/validation re-renders that replaceChildren() the plan.
function renderAreasOverlay(zone) {
  const svg = zone.svg;
  const existing = svg.querySelector(".areas-overlay");
  if (existing) existing.remove();
  // Ghosting the rooms beneath the footprints is a CROSS-LAYER rule: the
  // overlay is SVG, the rooms are the renderer's, and once they are GL this
  // stops being a CSS class and becomes a uniform. Routed through the seam now
  // so that change lands in one place. Easy to miss; visibly wrong when missed.
  zone.renderer.setAreasActive(zone.areasMode);
  if (!zone.areasMode || !areasData) return;

  const groups = activeAreaGroups(zone);
  if (groups.length === 0) return;

  const depth = zone.areasTier;
  const g = document.createElementNS(SVG, "g");
  g.setAttribute("class", "areas-overlay");
  const baseFont = Math.max(zone.fitted.w, zone.fitted.h) * 0.022;

  groups.forEach((grp, i) => {
    const colour = qualitative("Set2", i);
    for (const poly of grp.polygons) {
      if (!poly.exterior || poly.exterior.length < 3) continue;
      // Exterior plus any interior rings (genuine voids) as ONE even-odd path,
      // so a courtyard reads as a hole cut from the footprint — matching the
      // area, which excludes it. A plain <polygon> per ring can't express that.
      const path = document.createElementNS(SVG, "path");
      path.setAttribute("d", footprintPathD(poly));
      path.setAttribute("fill-rule", "evenodd");
      path.setAttribute("class", grp.counted_upward ? "area-poly" : "area-poly faded");
      path.dataset.areaKey = areaKey(grp);   // hit test + re-applied selection
      path.style.fill = colour;
      // The stroke goes through a custom property, NOT `style.stroke`: an inline
      // stroke outranks every stylesheet rule, so `.area-poly.selected` could
      // never repaint the outline and a selected footprint kept its group colour.
      // The fill stays inline — it should keep that colour, selected or not, so
      // the band's swatches still name the same group.
      path.style.setProperty("--area-colour", colour);
      g.appendChild(path);
    }
    // Label goes on the largest exterior ring across the group's islands.
    const exteriors = grp.polygons.map(p => p.exterior).filter(r => r && r.length >= 3);
    const big = exteriors.reduce((a, b) => (ringAreaAbs(b) > ringAreaAbs(a || []) ? b : a), exteriors[0]);
    if (big && big.length >= 3) {
      const text = tierLabel(grp.path[depth]);
      // Fit the label to its ring, mirroring addLabel()'s room-label sizing:
      // baseFont is the ceiling, the polygon's own bbox the constraint. 0.6 is
      // the mono glyph aspect ratio; 0.7 (vs 0.9 for rooms) leaves margin for
      // the concave footprints a bbox can't see.
      const bb = ringBox(big);
      const widthLimited = (bb.w * 0.7) / Math.max(text.length, 1) / 0.6;
      const heightLimited = bb.h * 0.8;
      const fontSize = Math.min(baseFont, widthLimited, heightLimited);
      // Groups too small to carry legible text get no label at all — a
      // sub-pixel speck is worse than nothing, and the summary panel already
      // names every group. (Unlike room labels, where the same threshold was
      // removed as a bug: a suppressed room label had no other surface.)
      if (fontSize >= baseFont * 0.25) {
        const c = ringCentroid(big);
        const label = document.createElementNS(SVG, "text");
        label.setAttribute("class", "area-label");
        label.setAttribute("x", c.x);
        label.setAttribute("y", -c.y);
        label.setAttribute("font-size", fontSize);
        label.textContent = text;
        g.appendChild(label);
      }
    }
  });
  svg.appendChild(g);
  // The overlay is rebuilt on every render, tier change and level switch, so a
  // selected footprint loses its class with the old nodes. Re-applied HERE, not
  // by the callers: this is the one function that rebuilds it, and renderLevel's
  // own applySelection call runs before this one (rooms are painted first).
  applySelection(zone);
}

// The band's figures: EVERY level at the band's selected tier — each group's
// dissolved FOOTPRINT area (server) beside its summed NET room area (client)
// and the difference, with per-level subtotals and a grand total. All-levels
// where the old overlay panel was active-level-only, because the band belongs
// to the scope, not to any zone's level pick — the zone overlays remain the
// per-level view.
function renderAreasBand() {
  const band = document.getElementById("areasBand");
  const content = document.getElementById("areasContent");
  const anyOpen = zones.some(z => z.areasMode);
  band.classList.toggle("hidden", !anyOpen || !areasData);
  updateRegionHeight();
  if (!anyOpen || !areasData) { content.innerHTML = ""; return; }

  const depth = areasBandTier;
  const levelName = new Map((areasData.levels || []).map(l => [l.id, l.name]));
  const groups = areasData.groups.filter(g => g.path.length === depth + 1);

  // Net room area per (level, path-prefix), same identity the CSV export uses.
  const net = new Map();
  for (const r of (currentPayload ? currentPayload.rooms : [])) {
    if (!r.classification || r.classification.length < depth + 1) continue;
    const key = `${r.level_id}|${pathKey(r.classification, depth)}`;
    net.set(key, (net.get(key) || 0) + roomNetArea(r));
  }

  const fmt = (n) => n.toLocaleString(undefined, { maximumFractionDigits: 1 });
  // Group rows by level, keeping server order within each level (colour index
  // parity with the overlays, which use per-level server order too).
  const byLevel = new Map();
  for (const g of groups) {
    if (!byLevel.has(g.level_id)) byLevel.set(g.level_id, []);
    byLevel.get(g.level_id).push(g);
  }

  let grandF = 0, grandN = 0;
  const rows = [...byLevel.entries()].map(([lvlId, lvlGroups]) => {
    let tF = 0, tN = 0;
    const lvl = escapeHtml(levelName.get(lvlId) || lvlId);
    const body = lvlGroups.map((grp, i) => {
      const netA = net.get(`${lvlId}|${pathKey(grp.path, depth)}`) || 0;
      tF += grp.area; tN += netA;
      const colour = qualitative("Set2", i);
      const flag = grp.counted_upward ? "" : ` <span class="uncounted">(not counted up)</span>`;
      return `<tr><td class="lvl">${i === 0 ? lvl : ""}</td>
        <td><span class="swatch" style="background:${colour}"></span>${escapeHtml(tierLabel(grp.path[depth]))}${flag}</td>
        <td>${fmt(grp.area)}</td><td>${fmt(netA)}</td><td>${fmt(grp.area - netA)}</td></tr>`;
    }).join("");
    grandF += tF; grandN += tN;
    return body + `<tr class="total"><td class="lvl"></td><td>${lvl} total</td><td>${fmt(tF)}</td><td>${fmt(tN)}</td><td>${fmt(tF - tN)}</td></tr>`;
  }).join("");

  content.innerHTML = groups.length
    ? `<p class="note">Dissolved footprint vs summed net room area (model units²), every level in scope. Δ = enclosed wall bands + filled room voids (columns); open courtyards are excluded from the footprint.</p>
       <table><thead><tr><th class="lvl">Level</th><th>Group</th><th>Footprint</th><th>Net</th><th>Δ</th></tr></thead>
       <tbody>${rows}<tr class="total"><td class="lvl"></td><td>All levels</td><td>${fmt(grandF)}</td><td>${fmt(grandN)}</td><td>${fmt(grandF - grandN)}</td></tr></tbody></table>`
    : `<p class="note">No footprints at this tier.</p>`;
}

// Export every group's footprint across ALL levels and tiers (not just the
// active view the panel shows) as CSV: level, one column per tier, then the
// server footprint area, the client-summed net room area, their Δ, and whether
// the group counts toward tiers above it. Reuses the same roomNetArea/pathKey
// the summary uses, generalised past the active level/tier.
function buildAreasCsv() {
  const data = areasData;
  if (!data || !data.groups || data.groups.length === 0) return "";
  const levelName = new Map((data.levels || []).map(l => [l.id, l.name]));
  const tiers = tierNames(data);

  // Net room area per (level, depth, path-prefix) over every room, so each
  // group at any depth on any level can look up its summed net directly.
  const net = new Map();
  for (const r of (currentPayload ? currentPayload.rooms : [])) {
    if (!r.classification) continue;
    for (let d = 0; d < r.classification.length; d++) {
      const key = `${r.level_id}|${d}|${pathKey(r.classification, d)}`;
      net.set(key, (net.get(key) || 0) + roomNetArea(r));
    }
  }

  const num = (x) => Math.round(x * 1000) / 1000; // trim float-noise tails, no locale separators
  const rows = [["level", ...tiers, "footprint", "net", "delta", "counted_up"]];
  for (const g of data.groups) {
    const depth = g.path.length - 1;
    const netA = net.get(`${g.level_id}|${depth}|${pathKey(g.path, depth)}`) || 0;
    const tierCells = tiers.map((_, i) => (i < g.path.length ? tierLabel(g.path[i]) : ""));
    rows.push([
      levelName.get(g.level_id) || g.level_id,
      ...tierCells,
      num(g.area), num(netA), num(g.area - netA),
      g.counted_upward ? "yes" : "no",
    ]);
  }
  return rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
}

function downloadAreasCsv() {
  if (!areasData || !areasData.groups || areasData.groups.length === 0) return;
  downloadCsv(`areas-${projectId || "project"}.csv`, buildAreasCsv());
}

// ================= bottom region, band 1: adjacency graph =================
//
// The adjacency graph: pick a room, see what it shares a wall with, and what
// those touch. Rendered on a <canvas> by graph.js (see that file's header for
// why canvas here and SVG on the plan).
//
// It follows EITHER selectable thing on the plan. A room names a node directly;
// a hierarchy footprint names a group of rooms, and graph.js aggregates the room
// graph to that footprint's tier — same nodes, collapsed by classification
// prefix, with the shared walls between two groups summed. That is why the panel
// hands the graph a kinded focus rather than a room id: the granularity is a
// property of what the user selected, not a separate control.
//
// Fetched on a SELECTION change, not on the 2s room poll — a different trigger
// and a different consumer, which is exactly the test STRATEGY-BROWSER sets for
// "does this earn its own endpoint". It also refreshes when real new room data
// arrives, the same on-demand lifecycle `loadAreas` follows.

let adjData = null;         // the /adjacency response for the current scope
let adjRevision = null;     // change-detection cursor, same idea as the room poll
let adjGraph = null;        // the canvas controller (created lazily, on first open)
// Wall tolerance as the user sees it: MILLIMETRES. The wire value is decimal
// feet (Revit's internal unit), converted at this edge only.
//
// `null` means THE USER HAS NOT CHOSEN ONE, and that is the normal resting
// state: the request then omits `wall_max` entirely, and the server derives it
// from the project's declared `[areas] max_wall_thickness` through the boundary
// regime the models declared — zero when every level in scope is centreline,
// where neighbours already touch and any positive tolerance only invites
// bridging. The response echoes what it applied, and that is what moves the
// slider (`syncWallFromServer`).
//
// This used to be seeded from a hardcoded 1.5 ft and sent on every request, so
// the derived default was never the one applied: a project declaring 0.5 ft was
// silently overridden by its own viewer, and a centreline project opened at a
// tolerance guaranteed to over-connect. That is the same one-quantity-two-
// declarations bug `[areas] max_wall_thickness` exists to delete (it replaced
// `areas::MAX_WALL_FT` + `adjacency::WALL_MAX_FT`), reappearing across the wire
// — so the number is declared once, in project settings, and read from there.
let adjWallMm = null;
const FT_TO_MM = 304.8;

function adjacencyUrl() {
  const params = new URLSearchParams();
  if (buildingKey) params.set("building", buildingKey);
  if (milestone) params.set("milestone", milestone);
  // Omitted while unchosen: omission is how the viewer ASKS FOR the server's
  // derived default rather than restating it. Once chosen it is sent every
  // time, including 0 — zero is a real tolerance (the wall-centreline case),
  // not "unset", which is precisely why "unset" needed its own representation.
  // Rounded because a float with 14 decimals in a URL is noise, and the
  // server's revision hashes the value it received.
  if (adjWallMm != null) params.set("wall_max", (adjWallMm / FT_TO_MM).toFixed(4));
  return `/projects/${encodeURIComponent(projectId)}/adjacency?${params}`;
}

// Create the canvas controller on first use. Deferred because a canvas measures
// zero while its band is collapsed, and sizing it then would bake in a useless
// backing store.
function ensureGraph() {
  if (adjGraph) return adjGraph;
  adjGraph = createRoomGraph(document.getElementById("adjCanvas"), {
    // A click on a graph node sets the PAGE selection, which re-centres the
    // graph and highlights the room (or the footprint) on every plan showing it.
    // The graph does not own the selection, it just reads and writes it — which
    // is what makes plan->graph and graph->plan the same one-way flow twice,
    // rather than two views trying to stay in sync.
    //
    // The kind travels with the id because the selection is kinded: a group id
    // handed to `selectRoom` would name nothing, and would then be silently
    // dropped by `roomSelection()`.
    onSelect: (id, kind) => (kind === "area" ? selectArea(id, null) : selectRoom(id, null)),
  });
  return adjGraph;
}

// The graph's focus, derived from the one page selection.
//
// A room is itself a node. An area is a GROUP of nodes, so the graph also needs
// the tier depth to aggregate to — which is the group's own path depth. It is
// resolved from the areas result when that is loaded, and otherwise from the
// tier the graph is already aggregated to: a click on a graph node means the
// group is one the graph itself derived, and those can outrun `/areas` (which
// drops hierarchy-excluded rooms and is fetched by its own band).
function graphFocus() {
  if (!selection) return null;
  if (selection.kind === "room") return { kind: "room", id: selection.id };
  const grp = (areasData ? areasData.groups : []).find(g => areaKey(g) === selection.id);
  const depth = grp ? grp.path.length - 1 : (adjGraph ? adjGraph.groupDepth() : null);
  if (depth == null) return null; // nothing to aggregate to: the canvas says so
  return { kind: "area", id: selection.id, depth };
}

function adjBandOpen() {
  return !document.getElementById("adjBody").classList.contains("hidden");
}

async function loadAdjacency({ force = false } = {}) {
  if (!projectId || !adjBandOpen()) return;
  try {
    const next = await fetchJson(adjacencyUrl());
    // Before the revision check, and deliberately: the echoed tolerance is worth
    // showing even on a response that changes nothing else, and an unchanged
    // revision makes this a no-op anyway.
    syncWallFromServer(next.wall_max);
    // One server-computed revision instead of re-comparing the payload — and it
    // hashes `wall_max` alongside the snapshot set, so a slider change counts as
    // new content and the graph never looks frozen after a drag.
    if (!force && next.revision === adjRevision && adjData) return;
    adjRevision = next.revision;
    adjData = next;
  } catch (err) {
    // A 400 here is a caller fault (an out-of-range tolerance) and a 204 is an
    // empty store; neither is worth a modal. Clear and let the canvas say so.
    adjData = null;
    adjRevision = null;
  }
  renderAdjacency();
}

function renderAdjacency() {
  const g = ensureGraph();
  g.setData(adjData);
  populateAdjTier();
  g.setFocus(graphFocus());
  updateAdjMeta();
}

// Tier options come from the nodes' own classification paths, mirroring the
// areas overlay's tier picker — same vocabulary, same control, so the two
// results read as parts of one page.
function populateAdjTier() {
  const sel = document.getElementById("adjTier");
  const names = adjGraph ? adjGraph.tierNames() : [];
  const prev = sel.value;
  sel.replaceChildren();
  names.forEach((name, depth) => {
    const opt = document.createElement("option");
    opt.value = String(depth);
    opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.classList.toggle("hidden", names.length === 0);
  sel.parentElement.classList.toggle("hidden", names.length === 0);
  if (prev && names[+prev] !== undefined) sel.value = prev;
}

function updateAdjMeta() {
  const meta = document.getElementById("adjMeta");
  const focus = graphFocus();
  if (!focus) { meta.textContent = "no room or area selected"; return; }
  const name = focus.kind === "area" ? areaFocusLabel(focus.id) : focusRoomName(focus.id);
  // Both counts come from the graph, not from `adjData`: once the view is
  // aggregated the degree is a count of GROUPS, which the raw room edges cannot
  // answer. Zero while the band is collapsed, which is also when this line is
  // hidden — the graph is not built until the panel has a box to measure.
  const shown = adjGraph ? adjGraph.shownCount() : 0;
  const degree = adjGraph ? adjGraph.focusDegree() : 0;
  // Naming the zone the selection came from is Decision 3's rule: the same room
  // can appear in two zones, so the result says where the click landed. A
  // label, not focus machinery.
  const from = selection && selection.zoneId ? ` · from ${selection.zoneId}` : "";
  meta.textContent = `${name} · ${degree} adjacent · ${shown} shown${from}`;
}

function focusRoomName(roomId) {
  return currentPayload?.rooms.find(r => r.id === roomId)?.name || roomId;
}

// The full tier path, not just the leaf: two departments under different parents
// can carry the same leaf label, and the meta line is the one place with room to
// disambiguate them (the node label on the canvas has not).
function areaFocusLabel(id) {
  const grp = (areasData ? areasData.groups : []).find(g => areaKey(g) === id);
  return grp ? grp.path.map(tierLabel).join(" / ") : id;
}

// The user picking a tolerance. Assigning a number is what takes ownership of
// the control: from here `adjacencyUrl()` sends it explicitly, and the server's
// derived default no longer applies until the scope changes.
function setAdjWallMm(mm) {
  adjWallMm = mm;
  document.getElementById("adjWallOut").textContent = `${mm} mm`;
}

// Reflect the tolerance the server reports it actually applied, WITHOUT taking
// ownership: `adjWallMm` stays null, so the next request still omits `wall_max`
// and a change to the project's `[areas] max_wall_thickness` still reaches the
// viewer. Once the user has chosen, this does nothing — the slider must never
// jump under the cursor.
//
// The readout carries the server's exact figure and the thumb only approximates
// it, which is the honest way round: the input can land only on a `step`
// multiple (1.5 ft is 457.2mm, and the thumb goes to 460), and a project may
// legitimately declare a thickness past the slider's 900mm range, which is
// clamped for the thumb but still reported truthfully in the text.
function syncWallFromServer(ft) {
  if (adjWallMm != null || typeof ft !== "number" || !isFinite(ft)) return;
  const mm = Math.round(ft * FT_TO_MM);
  const slider = document.getElementById("adjWall");
  slider.value = String(Math.min(Math.max(mm, Number(slider.min)), Number(slider.max)));
  // Labelled, because "0 mm" on a centreline project reads as a broken control
  // rather than the correct answer it is.
  document.getElementById("adjWallOut").textContent = `${mm} mm · project default`;
}

// A continuous drag would otherwise fire a graph recompute per frame and hammer
// the server; the readout still updates live, only the fetch waits for the drag
// to settle.
const debouncedLoadAdjacency = debounce(() => loadAdjacency({ force: true }), 150);

// ==================== bottom region, band 2: source-data grid ====================
//
// A read-only grid over the rooms of the CURRENT SCOPE — every level, not the
// levels on screen. That is deliberate and worth restating, because a level
// filter feels like it "should" follow the plans: with several zones showing
// different levels there is no single answer, and it would make the grid's
// contents depend on presentation state, reintroducing exactly the
// scope/presentation blur the global-scope migration removed. Filtering by
// level stays available as an ordinary column filter, driven by the user.
//
// Model-derived and reference-source-derived columns are grouped and visually
// separated rather than interleaved: STRATEGY-SOURCES keeps every reference
// source a distinct sub-object ("store raw, join late") precisely because
// they have different lifecycles from the model, and an interleaved table
// would imply a single source of truth the data model deliberately doesn't
// have.

// The region reserves its dragged height only when some child actually
// flex-fills it: the grid expanded, or a band-1 block open. Otherwise it drops
// to auto height in one of two shapes, so a folded panel gives the space back
// to the plans instead of holding blank paper:
//   - `.strips` — something is still shown as a one-line strip (the folded grid
//     bar, or a collapsed band-1 head): reserve just those strips at the bottom.
//   - `.empty`  — nothing shown at all (no data): collapse to nothing.
function updateRegionHeight() {
  const band1 = document.getElementById("band1");
  const gridVisible = !document.getElementById("gridBand").classList.contains("hidden");
  const gridExpanded = gridVisible && !gridCollapsed;
  const anyBandOpen = !!band1.querySelector(".result-band.open:not(.hidden)");
  const reserves = gridExpanded || anyBandOpen;
  // A strip is present when the grid is folded (its bar) or a band-1 block is
  // visible but collapsed. If a block is open, `reserves` already wins.
  const anyStrip = gridVisible || !!band1.querySelector(".result-band:not(.hidden)");
  const region = document.getElementById("bottomRegion");
  region.classList.toggle("strips", !reserves && anyStrip);
  region.classList.toggle("empty", !reserves && !anyStrip);
  // A band appearing/disappearing, or the grid folding, can make the split
  // meaningful or moot.
  updateBandDivide();
}

const GRID_ROW_H = 20;      // px; fixed so a row's offset is index * height
const GRID_OVERSCAN = 8;    // rows rendered beyond the viewport, to hide scroll seams

let gridColumns = [];       // [{ key, label, source: "model"|<reference source name>, get(room), unmapped }]
let knownReferenceSources = []; // last-detected reference source names, see syncReferenceSources()
let enabledReferenceSources = new Set(); // subset of the above currently shown in the grid
let gridRows = [];          // rooms after filter + sort (the windowed row list)
let gridSort = { key: null, asc: true };
const gridFilters = new Map(); // column key -> lowercased filter text
let gridScrollTop = 0;
// Band 2 folds to its bar the way the band-1 blocks do. In-memory only, like
// linkViews and the region height — view state persistence is deferred as one
// decision (view prefs persist together or not at all), not per control.
let gridCollapsed = false;
// QA marks, at the finest address the report supports. `compute_validation`
// keys its field-level findings by (room, field), which in this grid IS a
// (row, column) address — so a mismatch is marked *on the disagreeing cell*
// rather than only listed in band 1. Room-level findings (no link value,
// unmatched, duplicate) have no column, so they mark the Id cell instead.
//
// Keyed by the grid's OWN column key (`gridColumns`' `key`), not by a bare
// name. Two things force that. A finding's `field` is the *reference label*
// (`NetArea`), while the Revit column is keyed by the *property* it maps to
// (`p:Area`) — comparing the two only ever matched when a label happened to
// equal its property name, which is why `Department` marked correctly and
// `NetArea` never did. And with N sources, two of them may both declare a
// label called `NetArea`, so the key has to name the source as well.
//
// A disagreement is between two cells, so BOTH are marked: the source's own
// cell and the Revit cell it contradicts (resolved through that source's
// `field_coverage`, which is where label -> revit_property already lives).
let gridCellErrors = new Set(); // `${roomId}\0${columnKey}`
let gridRoomErrors = new Set(); // roomId

function rebuildGridErrorIndex() {
  gridCellErrors = new Set();
  gridRoomErrors = new Set();
  const d = currentValidation;
  if (!d) return;
  for (const [name, report] of Object.entries(d.sources || {})) {
    // label -> the Revit property it is reconciled against, for this source.
    const revitProperty = new Map(
      (report.field_coverage || []).filter(c => c.revit_property).map(c => [c.label, c.revit_property])
    );
    const mark = (roomId, label) => {
      gridCellErrors.add(`${roomId}\0${name}:${label}`);
      const prop = revitProperty.get(label);
      if (prop) gridCellErrors.add(`${roomId}\0p:${prop}`);
    };
    for (const m of report.property_mismatches) mark(m.room_id, m.field);
    for (const m of report.fields_absent_in_revit) mark(m.room_id, m.field);
    for (const m of report.fields_empty_in_revit) mark(m.room_id, m.field);
    for (const id of report.rooms_missing_link_value) gridRoomErrors.add(id);
    for (const id of report.rooms_unmatched) gridRoomErrors.add(id);
    for (const dup of report.duplicate_link_values) for (const id of dup.room_ids) gridRoomErrors.add(id);
  }
}

// Fixed `RoomResponse` fields (`room` and `reference` are both `#[serde(flatten)]`d
// onto the same JSON object in rooms.rs) -- everything else on a room is
// either a reference-source sub-object or a regular response field.
const ROOM_FIXED_KEYS = new Set(["id", "name", "level_id", "loops", "properties", "classification", "label"]);

// Data-driven discovery of every joined/configured reference source in the
// current payload: any room key shaped like `{fields: {...}}` (a
// `ReferenceRecord`) that isn't one of Room's own fields. No extra fetch, and
// this naturally covers the unscoped multi-project view (whatever sources
// actually show up on the merged rooms).
//
// Plus every source named in `reference_labels`, so a source whose rows all
// went unmatched in this scope still gets its (empty) column group and
// toggle. That used to be a "drofus"-only fallback, and the gap it left —
// any OTHER source matching zero rooms simply vanished from the UI — closed
// when the backend started reporting a vocabulary per source rather than for
// dRofus alone (see STRATEGY-SOURCES.md).
function detectReferenceSources(payload) {
  const names = new Set();
  for (const perSource of Object.values(payload?.reference_labels || {})) {
    for (const name of Object.keys(perSource)) names.add(name);
  }
  for (const room of (payload?.rooms || [])) {
    for (const key of Object.keys(room)) {
      if (ROOM_FIXED_KEYS.has(key)) continue;
      const v = room[key];
      if (v && typeof v === "object" && !Array.isArray(v) && v.fields && typeof v.fields === "object") names.add(key);
    }
  }
  return [...names].sort();
}

const REFERENCE_SOURCE_DISPLAY_NAMES = { drofus: "dRofus" };
function sourceDisplayName(name) {
  return REFERENCE_SOURCE_DISPLAY_NAMES[name] || (name.charAt(0).toUpperCase() + name.slice(1));
}

// Refresh the known-source list from the current payload and the toggle
// checkboxes that drive `enabledReferenceSources`. Called once per payload,
// before the grid/search/inspector are rebuilt off `knownReferenceSources`.
function syncReferenceSources() {
  knownReferenceSources = detectReferenceSources(currentPayload);
  // A newly seen source defaults to shown, same "new field -> on" rule
  // refreshFieldsPanel uses for search fields.
  for (const name of knownReferenceSources) enabledReferenceSources.add(name);
  renderSourceToggles();
}

function renderSourceToggles() {
  const box = document.getElementById("srcToggles");
  box.replaceChildren();
  for (const name of knownReferenceSources) {
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = enabledReferenceSources.has(name);
    cb.addEventListener("change", () => {
      if (cb.checked) enabledReferenceSources.add(name); else enabledReferenceSources.delete(name);
      gridScrollTop = 0;
      document.getElementById("gridScroll").scrollTop = 0;
      renderGrid();
    });
    const label = document.createElement("label");
    label.append(cb, document.createTextNode(" " + sourceDisplayName(name)));
    box.appendChild(label);
  }
}

// Intrinsic columns first — the identity a reader scans by — then the room's
// own property keys. `$level` resolves through the payload's level list, which
// is why it isn't just another property.
function buildGridColumns() {
  const cols = [];
  if (!currentPayload) return cols;

  const levelName = new Map(levelsForPayload(currentPayload).map(l => [l.id, l.name]));
  cols.push({ key: "$level", label: "Level", source: "model", get: r => levelName.get(r.level_id) || r.level_id || "" });
  cols.push({ key: "$name", label: "Name", source: "model", get: r => r.name || "" });
  cols.push({ key: "$id", label: "Id", source: "model", get: r => r.id || "" });

  const propKeys = new Set();
  for (const r of currentPayload.rooms) for (const k of Object.keys(r.properties || {})) propKeys.add(k);
  for (const k of [...propKeys].sort()) {
    cols.push({ key: `p:${k}`, label: k, source: "model", get: r => (r.properties?.[k]?.value) ?? "" });
  }

  // Reference-source columns, one group per discovered source. Columns come
  // from the response's own per-source label set, NOT a union of the rooms'
  // joined fields: a column that matched no room in scope would otherwise be
  // invisible — precisely the case the coverage report goes out of its way
  // to show as "not checked" rather than omit. `reconciliation` marks which
  // columns have a Revit counterpart; the rest render as unmapped.
  //
  // The union fallback below now only fires for a source that appears on the
  // rooms but has no vocabulary for THIS project — the unscoped multi-project
  // merge, where another project's source rides along on its own rooms. It
  // yields no unmatched-only columns and no `unmapped` styling, an honest
  // lesser capability for a case where the labels genuinely belong elsewhere.
  for (const name of knownReferenceSources) {
    const labels = ((currentPayload.reference_labels || {})[projectId] || {})[name];
    if (labels) {
      const mapped = labels.reconciliation || {};
      for (const label of labels.all_labels || []) {
        cols.push({
          key: `${name}:${label}`, label, source: name,
          unmapped: !(label in mapped),
          // An unmatched room simply has no key for this source — empty
          // cells, never an error (an unmatched link value is a signal, not
          // a failure).
          get: r => (r[name]?.fields?.[label]) ?? "",
        });
      }
    } else {
      const fieldKeys = new Set();
      for (const r of currentPayload.rooms) if (r[name]) for (const k of Object.keys(r[name].fields || {})) fieldKeys.add(k);
      for (const label of [...fieldKeys].sort()) {
        cols.push({ key: `${name}:${label}`, label, source: name, get: r => (r[name]?.fields?.[label]) ?? "" });
      }
    }
  }
  return cols;
}

function visibleGridColumns() {
  const model = document.getElementById("srcModel").checked;
  return gridColumns.filter(c => (c.source === "model" ? model : enabledReferenceSources.has(c.source)));
}

// Rooms after every active column filter, then the active sort. Sorting is
// numeric when both sides parse, so "10" doesn't sort before "9".
function computeGridRows() {
  const cols = visibleGridColumns();
  const active = cols.filter(c => gridFilters.get(c.key));
  let rows = currentPayload ? currentPayload.rooms : [];
  if (active.length) {
    rows = rows.filter(r => active.every(c => String(c.get(r)).toLowerCase().includes(gridFilters.get(c.key))));
  } else {
    rows = rows.slice();
  }

  const sortCol = cols.find(c => c.key === gridSort.key);
  if (sortCol) {
    const dir = gridSort.asc ? 1 : -1;
    rows.sort((a, b) => {
      const x = sortCol.get(a), y = sortCol.get(b);
      const nx = parseFloat(x), ny = parseFloat(y);
      if (Number.isFinite(nx) && Number.isFinite(ny) && nx !== ny) return (nx - ny) * dir;
      return String(x).localeCompare(String(y)) * dir;
    });
  }
  gridRows = rows;
}

// Header: a group row (Model | each reference source, spanning their
// columns) over a names row carrying sort, over a filter row.
//
// Rebuilt ONLY when the column set changes — a sort or filter keystroke just
// restyles the existing cells. That matters for more than cost: re-rendering
// the head would detach the filter <input> the user is typing into, losing
// focus and caret mid-word.
let gridHeadSig = null;
function renderGridHead(cols) {
  const table = document.getElementById("gridTable");
  let thead = table.querySelector("thead");
  if (!thead) { thead = document.createElement("thead"); table.appendChild(thead); }

  const sig = cols.map(c => c.key).join("|");
  if (sig === gridHeadSig) {
    // Same columns: only the sort indicator can have changed.
    for (const th of thead.querySelectorAll("tr.names th")) {
      th.classList.toggle("sorted", th.dataset.key === gridSort.key);
      th.classList.toggle("asc", th.dataset.key === gridSort.key && gridSort.asc);
    }
    return;
  }
  gridHeadSig = sig;

  const groups = [];
  for (const c of cols) {
    const last = groups[groups.length - 1];
    if (last && last.source === c.source) last.span++;
    else groups.push({ source: c.source, span: 1 });
  }

  const refCls = (source) => source !== "model" ? " src-reference" : "";

  const groupRow = groups.map(g =>
    `<th class="group-cell src-${cssIdent(g.source)}${refCls(g.source)}" colspan="${g.span}"><span>${g.source === "model" ? "Model" : escapeHtml(sourceDisplayName(g.source))}</span></th>`
  ).join("");

  const nameRow = cols.map(c => {
    const sorted = gridSort.key === c.key ? ` sorted${gridSort.asc ? " asc" : ""}` : "";
    const unmapped = c.unmapped ? " unmapped" : "";
    const title = c.unmapped ? ` title="${escapeHtml(c.label)} — no Revit property mapped (not QA-checked)"` : "";
    return `<th class="src-${cssIdent(c.source)}${refCls(c.source)}${sorted}${unmapped}" data-key="${escapeHtml(c.key)}"${title}>${escapeHtml(c.label)}</th>`;
  }).join("");

  const filterRow = cols.map(c =>
    `<th class="src-${cssIdent(c.source)}${refCls(c.source)}"><input data-key="${escapeHtml(c.key)}" value="${escapeHtml(gridFilters.get(c.key) || "")}" placeholder="filter" /></th>`
  ).join("");

  thead.innerHTML = `<tr class="group">${groupRow}</tr><tr class="names">${nameRow}</tr><tr id="gridFilters">${filterRow}</tr>`;
}

// Row windowing: only the visible slice is ever in the DOM, with two spacer
// rows standing in for the rest of the scroll height. This is the
// one-dimensional case of paintLevel's cull units — same idea (precompute
// each item's extent, render only what's in view), applied to rows instead of
// room bboxes, rather than a second pattern invented for the same problem.
function renderGridBody(cols) {
  const table = document.getElementById("gridTable");
  let tbody = table.querySelector("tbody");
  if (!tbody) { tbody = document.createElement("tbody"); table.appendChild(tbody); }

  const scroll = document.getElementById("gridScroll");
  const viewH = scroll.clientHeight || 200;
  const first = Math.max(0, Math.floor(gridScrollTop / GRID_ROW_H) - GRID_OVERSCAN);
  const count = Math.ceil(viewH / GRID_ROW_H) + GRID_OVERSCAN * 2;
  const last = Math.min(gridRows.length, first + count);

  const span = cols.length || 1;
  const before = first * GRID_ROW_H;
  const after = Math.max(0, (gridRows.length - last) * GRID_ROW_H);

  const parts = [];
  if (before > 0) parts.push(`<tr class="spacer"><td colspan="${span}" style="height:${before}px"></td></tr>`);
  for (let i = first; i < last; i++) {
    const room = gridRows[i];
    const roomBad = gridRoomErrors.has(room.id);
    const cells = cols.map(c => {
      const v = String(c.get(room));
      // A field-level finding marks its own cell; a room-level one (which has
      // no column) marks the Id cell. The index is keyed by column key, so
      // reference and Revit columns are both reachable — see
      // `rebuildGridErrorIndex`.
      const bad = gridCellErrors.has(`${room.id}\0${c.key}`) || (c.key === "$id" && roomBad);
      const refCls = c.source !== "model" ? " src-reference" : "";
      return `<td class="src-${cssIdent(c.source)}${refCls}${bad ? " err" : ""}" title="${escapeHtml(v)}">${escapeHtml(v)}</td>`;
    }).join("");
    parts.push(`<tr data-room="${escapeHtml(room.id)}" style="height:${GRID_ROW_H}px">${cells}</tr>`);
  }
  if (after > 0) parts.push(`<tr class="spacer"><td colspan="${span}" style="height:${after}px"></td></tr>`);
  tbody.innerHTML = parts.join("");
}

// Full grid refresh: columns -> rows -> head + windowed body. Called on new
// data, a source toggle, a sort, or a filter change.
function renderGrid() {
  const band = document.getElementById("gridBand");
  if (!currentPayload || !currentPayload.rooms || currentPayload.rooms.length === 0) {
    band.classList.add("hidden");
    updateRegionHeight();
    return;
  }
  band.classList.remove("hidden");
  updateRegionHeight();

  const cols = visibleGridColumns();
  computeGridRows();

  const empty = document.getElementById("gridEmpty");
  const scroll = document.getElementById("gridScroll");
  if (cols.length === 0) {
    scroll.classList.add("hidden");
    empty.classList.remove("hidden");
    empty.textContent = "No columns shown — enable Model or a reference source above.";
  } else {
    scroll.classList.remove("hidden");
    empty.classList.add("hidden");
    renderGridHead(cols);
    renderGridBody(cols);
  }

  const total = currentPayload.rooms.length;
  document.getElementById("gridCount").textContent =
